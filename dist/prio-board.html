      const dir = dx >= 0 ? 1 : -1;
      start = { x: dir > 0 ? from.x + from.width : from.x, y: a.y };
      end = { x: dir > 0 ? to.x - 2 : to.x + to.width + 2, y: b.y };
      const k = Math.max(40, Math.abs(end.x - start.x) / 2) * dir;
      c1 = { x: start.x + k, y: start.y };
      c2 = { x: end.x - k, y: end.y };
    } else {
      const dir = dy >= 0 ? 1 : -1;
      start = { x: a.x, y: dir > 0 ? from.y + from.height : from.y };
      end = { x: b.x, y: dir > 0 ? to.y - 2 : to.y + to.height + 2 };
      const k = Math.max(40, Math.abs(end.y - start.y) / 2) * dir;
      c1 = { x: start.x, y: start.y + k };
      c2 = { x: end.x, y: end.y - k };
    }
    return `M${start.x},${start.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${end.x},${end.y}`;
  }

  function linkClasses(dep, a) {
    const fromTasks = model.tasksWithin(dep.from);
    const toTasks = model.tasksWithin(dep.to);
    const classes = ['link'];
    if (fromTasks.length && fromTasks.every((id) => a.stateOf(id) === 'done')) classes.push('done');
    if (fromTasks.some((id) => a.cycle.has(id)) && toTasks.some((id) => a.cycle.has(id))) classes.push('bad');
    return classes.join(' ');
  }

  function linksHtml(a, { interactive }) {
    return model.getState().dependencies.map((dep) => {
      const from = model.getNode(dep.from);
      const to = model.getNode(dep.to);
      if (!from || !to) return '';
      const d = linkPath(from.layout, to.layout);
      const hit = interactive ? `<path class="hit" d="${d}"/>` : '';
      return `<g class="${linkClasses(dep, a)}" data-dep="${U.escapeHtml(dep.id)}">${hit}<path class="vis" d="${d}"/></g>`;
    }).join('');
  }

  /** Benötigte Fläche (mindestens die ganze Prioritätsachse). */
  function contentSize() {
    let width = C.ZONE_WIDTH * C.PRIORITY_LEVELS;
    let height = 1400;
    for (const n of model.allNodes()) {
      width = Math.max(width, n.layout.x + n.layout.width + 400);
      height = Math.max(height, n.layout.y + n.layout.height + 400);
    }
    return { width, height };
  }

  /** Vollständiges Diagramm-Markup. */
  function markup(a, { interactive = false } = {}) {
    const showPriority = model.getState().view.showPriorityAxis;
    return {
      zones: zonesHtml(),
      nodes: orderedNodes().map(({ node, zIndex }) => nodeHtml(node, a, { interactive, showPriority, zIndex })).join(''),
      links: linksHtml(a, { interactive }),
      size: contentSize(),
    };
  }

  /* =====================================================================
   * Live-Board
   * ===================================================================== */

  function init(elements) {
    dom = elements;
    dom.links.querySelector('defs').innerHTML = PB.diagramStyles.markerDefs();
    dom.zones.innerHTML = zonesHtml();
  }

  const elementOf = (id) => dom.world.querySelector(`.block[data-id="${CSS.escape(id)}"]`);

  function render(a) {
    analysis = a;
    const m = markup(a, { interactive: true });
    dom.world.querySelectorAll('.block').forEach((el) => el.remove());
    dom.world.insertAdjacentHTML('beforeend', m.nodes);
    dom.linkLayer.innerHTML = m.links;
    applyView();
    applySelection();
    applyHighlight();
  }

  function applyView() {
    const { view } = model.getState();
    const { width, height } = contentSize();
    Object.assign(dom.world.style, { width: `${width}px`, height: `${height}px`, transform: `scale(${view.zoom})` });
    Object.assign(dom.sizer.style, { width: `${width * view.zoom}px`, height: `${height * view.zoom}px` });
    dom.links.setAttribute('width', width);
    dom.links.setAttribute('height', height);
    dom.zones.classList.toggle('off', !view.showPriorityAxis);
  }

  /** Positionen während einer Geste aktualisieren (ohne komplettes Neuzeichnen). */
  function refreshLayout(ids) {
    for (const id of ids) {
      const el = elementOf(id);
      const node = model.getNode(id);
      if (!el || !node) continue;
      const { x, y, width, height } = node.layout;
      Object.assign(el.style, { left: `${x}px`, top: `${y}px`, width: `${width}px`, height: `${height}px` });
    }
    dom.linkLayer.querySelectorAll('.link').forEach((g) => {
      const dep = model.getDependency(g.dataset.dep);
      if (!dep) return;
      const d = linkPath(model.getNode(dep.from).layout, model.getNode(dep.to).layout);
      g.querySelectorAll('path').forEach((p) => p.setAttribute('d', d));
    });
  }

  function showDraftLink(fromId, point) {
    const from = model.getNode(fromId);
    dom.draft.style.display = '';
    dom.draft.setAttribute('d', linkPath(from.layout, { x: point.x, y: point.y, width: 1, height: 1 }));
  }
  function hideDraftLink() {
    dom.draft.style.display = 'none';
    dom.draft.setAttribute('d', '');
  }

  function applySelection() {
    const { type, id } = ui.selection;
    dom.world.querySelectorAll('.block').forEach((el) =>
      el.classList.toggle('selected', type === 'node' && el.dataset.id === id));
    dom.linkLayer.querySelectorAll('.link').forEach((el) =>
      el.classList.toggle('sel', type === 'dependency' && el.dataset.dep === id));
  }

  /**
   * Hervorhebung: Hover (vorher nötig / blockiert) hat Vorrang vor dem Fokusmodus.
   * taskClass(id) → CSS-Klasse oder null (= abgedunkelt); linkClass(fromTasks, toTasks) analog.
   */
  function applyHighlight() {
    const CLASSES = ['dim', 'hl', 'up', 'down', 'crit', 'ready-hl'];
    const blocks = [...dom.world.querySelectorAll('.block')];
    const links = [...dom.linkLayer.querySelectorAll('.link')];
    blocks.forEach((el) => el.classList.remove(...CLASSES));
    links.forEach((el) => el.classList.remove(...CLASSES));
    if (!analysis || ui.dragging) return;

    const rule = highlightRule();
    if (!rule) return;
    blocks.forEach((el) => {
      const id = el.dataset.id;
      if (model.isGroup(id)) {
        if (!model.tasksWithin(id).some(rule.taskClass)) el.classList.add('dim');
      } else {
        el.classList.add(rule.taskClass(id) || 'dim');
      }
    });
    links.forEach((el) => {
      const dep = model.getDependency(el.dataset.dep);
      if (dep) el.classList.add(rule.linkClass(model.tasksWithin(dep.from), model.tasksWithin(dep.to)) || 'dim');
    });
  }

  function highlightRule() {
    const any = (list, set) => list.some((x) => set.has(x));
    if (ui.hoverId && model.getNode(ui.hoverId)) {
      const focus = new Set(model.tasksWithin(ui.hoverId));
      const up = A.closure(focus, analysis.predecessors);
      const down = A.closure(focus, analysis.successors);
      return {
        taskClass: (id) => (focus.has(id) ? 'hl' : up.has(id) ? 'up' : down.has(id) ? 'down' : null),
        linkClass: (from, to) => {
          if (any(from, up) && (any(to, up) || any(to, focus))) return 'up';
          if ((any(from, focus) || any(from, down)) && any(to, down)) return 'down';
          return null;
        },
      };
    }
    if (ui.focusMode === 'ready') {
      return { taskClass: (id) => (analysis.ready.has(id) ? 'ready-hl' : null), linkClass: () => null };
    }
    if (ui.focusMode === 'critical') {
      const index = new Map(analysis.criticalPath.map((id, i) => [id, i]));
      return {
        taskClass: (id) => (index.has(id) ? 'crit' : null),
        linkClass: (from, to) => (from.some((f) => index.has(f) && to.some((t) => index.get(t) === index.get(f) + 1)) ? 'crit' : null),
      };
    }
    return null;
  }

  /* ---------- Koordinaten, Zoom, Scrollen ---------- */

  function toWorld(clientX, clientY) {
    const rect = dom.world.getBoundingClientRect();
    const zoom = model.getState().view.zoom;
    return { x: (clientX - rect.left) / zoom, y: (clientY - rect.top) / zoom };
  }

  function viewportCenter() {
    const zoom = model.getState().view.zoom;
    const c = dom.canvas;
    return { x: (c.scrollLeft + c.clientWidth / 2) / zoom, y: (c.scrollTop + c.clientHeight / 2) / zoom };
  }

  /** Zoomen um einen Ankerpunkt (Pixel relativ zur Arbeitsfläche), Standard: Mitte. */
  function setZoom(zoom, anchor) {
    const c = dom.canvas;
    const old = model.getState().view.zoom;
    const next = U.clamp(zoom, C.ZOOM.min, C.ZOOM.max);
    const p = anchor || { x: c.clientWidth / 2, y: c.clientHeight / 2 };
    const wx = (c.scrollLeft + p.x) / old;
    const wy = (c.scrollTop + p.y) / old;
    model.setView({ zoom: next });
    applyView();
    c.scrollLeft = wx * next - p.x;
    c.scrollTop = wy * next - p.y;
  }

  /** Alles sichtbar machen (inkl. Prioritätsachse oben links). */
  function fit() {
    const box = U.bounds(model.allNodes().map((n) => n.layout));
    if (!box) return;
    const c = dom.canvas;
    const x0 = Math.min(0, box.x - 40);
    const y0 = 0;
    const w = box.x + box.width + 40 - x0;
    const h = box.y + box.height + 40 - y0;
    const zoom = U.clamp(Math.min(c.clientWidth / w, c.clientHeight / h, 1.25), C.ZOOM.fitMin, C.ZOOM.max);
    model.setView({ zoom });
    applyView();
    // Passt alles hinein → zentrieren, sonst oben links (hohe Priorität) beginnen
    c.scrollLeft = x0 * zoom - Math.max(0, (c.clientWidth - w * zoom) / 2);
    c.scrollTop = y0 * zoom - Math.max(0, (c.clientHeight - h * zoom) / 2);
  }

  function scrollTo(id) {
    const node = model.getNode(id);
    if (!node) return;
    const zoom = model.getState().view.zoom;
    const center = U.center(node.layout);
    dom.canvas.scrollTo({
      left: center.x * zoom - dom.canvas.clientWidth / 2,
      top: center.y * zoom - dom.canvas.clientHeight / 2,
      behavior: 'smooth',
    });
  }

  return {
    markup, linkPath,
    init, render, applyView, refreshLayout, showDraftLink, hideDraftLink, applySelection, applyHighlight,
    toWorld, viewportCenter, setZoom, fit, scrollTo,
  };
})();
</script>
  <script>
/* js/render/sidebar.js */
/**
 * Seitenleiste: Tabs „Details“ (Bearbeiten), „Ablauf“ (Wellen, kritischer Pfad) und „Hilfe“.
 * Ändert das Modell direkt; Navigation/Meldungen laufen über die bei init() übergebenen actions.
 */
PB.sidebar = (() => {
  const C = PB.config;
  const U = PB.util;
  const I = PB.icons;
  const A = PB.analysis;
  const model = PB.model;
  const ui = PB.ui;
  const esc = U.escapeHtml;

  let dom = null;
  let actions = null;
  let analysis = null;
  let editCheckpointPending = false;

  function init(elements, callbacks) {
    dom = elements;
    actions = callbacks;
    dom.tabs.addEventListener('click', onTabClick);
    dom.body.addEventListener('focusin', () => { editCheckpointPending = true; });
    dom.body.addEventListener('input', onInput);
    dom.body.addEventListener('change', onChange);
    dom.body.addEventListener('click', onClick);
    dom.body.addEventListener('mouseover', onHover);
    dom.body.addEventListener('mouseleave', () => actions.hover(null));
  }

  function render(a) {
    analysis = a;
    dom.tabs.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.tab === ui.tab));
    const views = { details: detailsView, plan: planView, help: helpView };
    dom.body.innerHTML = views[ui.tab]();
  }

  /* =====================================================================
   * Bausteine
   * ===================================================================== */

  function kindDot(node) {
    if (model.isGroup(node.id)) return '<span class="dot group"></span>';
    return `<span class="dot ${node.kind}">${I.forKind(node.kind)}</span>`;
  }

  function listItem(node, { meta = '', removeDep = null } = {}) {
    const remove = removeDep ? `<button class="x" data-remove-dep="${esc(removeDep)}" title="Entfernen">×</button>` : '';
    return `<li data-goto="${esc(node.id)}">${kindDot(node)}<span class="t">${esc(node.title || 'Ohne Titel')}</span>${meta}${remove}</li>`;
  }

  const list = (items, empty = '– nichts –') =>
    `<ul class="list">${items.join('') || `<li class="hint">${empty}</li>`}</ul>`;

  function field(label, control) {
    return `<div class="field"><label>${label}</label>${control}</div>`;
  }

  function select(name, options, current) {
    const opts = Object.entries(options)
      .map(([value, label]) => `<option value="${value}"${value === current ? ' selected' : ''}>${label}</option>`).join('');
    return `<select data-field="${name}">${opts}</select>`;
  }

  /** Mögliche Partner für eine neue Abhängigkeit (ohne Duplikate, ohne Verschachtelte). */
  function dependencyOptions(id, direction) {
    const deps = model.getState().dependencies;
    const used = new Set(direction === 'incoming'
      ? deps.filter((d) => d.to === id).map((d) => d.from)
      : deps.filter((d) => d.from === id).map((d) => d.to));
    return model.allNodes()
      .filter((n) => n.id !== id && !used.has(n.id) && !model.areNested(n.id, id))
      .sort((a, b) => a.title.localeCompare(b.title, 'de'))
      .map((n) => {
        const kind = model.isGroup(n.id) ? 'Gruppe' : C.KIND_LABELS[n.kind];
        return `<option value="${esc(n.id)}">${kind}: ${esc(n.title || 'Ohne Titel')}</option>`;
      }).join('');
  }

  function legend() {
    const arrow = (color, dash = '') =>
      `<svg width="32" height="12"><path d="M1,6 H25" stroke="var(${color})" stroke-width="2" ${dash}/>` +
      `<path d="M23,1 L31,6 L23,11z" fill="var(${color})"/></svg>`;
    return `<h3>Legende</h3><div class="legend">
      <div><span class="dot thinking">${I.svg('brain')}</span><span><b>Denken</b> – Analyse, Konzept, braucht Zeit</span></div>
      <div><span class="dot implementation">${I.svg('wrench')}</span><span><b>Umsetzung</b> – direkt machbar</span></div>
      <div><span class="dot group"></span><span><b>Gruppe</b> – Abhängigkeitsblock / Rahmen</span></div>
      <div>${arrow('--link')}<span>A → B: A muss vor B fertig sein</span></div>
      <div>${arrow('--link-done', 'stroke-dasharray="4 3"')}<span>Voraussetzung erfüllt</span></div>
      <div><span class="sw" style="box-shadow:0 0 0 3px var(--up)"></span><span>Beim Hovern: wird vorher benötigt</span></div>
      <div><span class="sw" style="box-shadow:0 0 0 3px var(--down)"></span><span>Beim Hovern: wird dadurch blockiert</span></div>
    </div>`;
  }

  /* =====================================================================
   * Tab „Details“
   * ===================================================================== */

  function detailsView() {
    if (ui.selection.type === 'dependency') return dependencyDetails(model.getDependency(ui.selection.id));
    const node = ui.selection.type === 'node' && model.getNode(ui.selection.id);
    if (!node) return `<p class="hint">Wähle einen Block auf dem Board aus, um ihn zu beschreiben.</p>${legend()}`;
    return model.isGroup(node.id) ? groupDetails(node) : taskDetails(node);
  }

  function dependencyDetails(dep) {
    if (!dep) return '';
    return `<h3>Abhängigkeit</h3>
      ${list([listItem(model.getNode(dep.from), { meta: '<span class="small">zuerst</span>' })])}
      <div class="hint" style="margin:0 8px 6px">↓ muss fertig sein, bevor</div>
      ${list([listItem(model.getNode(dep.to), { meta: '<span class="small">danach</span>' })])}
      <div class="btnrow">
        <button class="btn" data-action="reverse-dependency">Richtung umkehren</button>
        <button class="btn danger" data-action="delete">Löschen</button>
      </div>`;
  }

  function taskDetails(task) {
    const priority = analysis.priorityOf(task.id);
    const notes = task.notes.join('\n');
    return `
      ${field('Titel', `<input data-field="title" value="${esc(task.title)}">`)}
      <div class="row">
        ${field('Art', select('kind', { thinking: 'Denken (Analyse)', implementation: 'Umsetzung' }, task.kind))}
        ${field('Status', select('status', C.STATUS_LABELS, task.status))}
      </div>
      <div class="row">
        ${field('Aufwand (Personentage)', `<input data-field="effortDays" inputmode="decimal" value="${task.effortDays ?? ''}">`)}
        ${field('Priorität (Position)', `<input disabled value="${priority} – ${A.priorityLabel(priority)}">`)}
      </div>
      ${field('Stichpunkte (eine Zeile = ein Punkt)', `<textarea data-field="notes" rows="3">${esc(notes)}</textarea>`)}
      ${field('Beschreibung', `<textarea data-field="description" rows="4">${esc(task.description)}</textarea>`)}
      <p class="hint">${taskStateText(task)}</p>
      ${blockedBySection(task)}
      ${dependencySections(task.id)}
      <div class="btnrow">
        <button class="btn" data-action="duplicate">Duplizieren</button>
        <button class="btn danger" data-action="delete">Löschen</button>
      </div>`;
  }

  function taskStateText(task) {
    const wave = analysis.wave.get(task.id);
    switch (analysis.stateOf(task.id)) {
      case 'done': return 'Erledigt.';
      case 'cycle': return '⚠ Teil eines Zyklus – Abhängigkeiten prüfen.';
      case 'ready': return `✓ Kann jetzt gestartet werden (Welle ${wave}).`;
      case 'in_progress': return `In Arbeit (Welle ${wave}).`;
      default: return `Wartet auf ${analysis.openPredecessors(task.id).length} offene Aufgabe(n) – Welle ${wave}.`;
    }
  }

  function blockedBySection(task) {
    const open = analysis.openPredecessors(task.id);
    if (!open.length) return '';
    return `<h3>Effektiv blockiert durch</h3>
      ${list(open.map((id) => listItem(model.getNode(id))))}
      <p class="hint" style="margin-top:-4px">inkl. Abhängigkeiten der umgebenden Gruppe(n)</p>`;
  }

  function groupDetails(group) {
    const children = model.childrenOf(group.id);
    return `
      ${field('Titel', `<input data-field="title" value="${esc(group.title)}">`)}
      ${field('Beschreibung', `<textarea data-field="description" rows="3">${esc(group.description)}</textarea>`)}
      <h3>Enthält (${children.length})</h3>
      ${list(children.map((c) => listItem(c)), 'Blöcke in den Rahmen ziehen')}
      ${dependencySections(group.id)}
      <div class="btnrow"><button class="btn danger" data-action="delete">Löschen</button></div>`;
  }

  function dependencySections(id) {
    const deps = model.getState().dependencies;
    const incoming = deps.filter((d) => d.to === id).map((d) => listItem(model.getNode(d.from), { removeDep: d.id }));
    const outgoing = deps.filter((d) => d.from === id).map((d) => listItem(model.getNode(d.to), { removeDep: d.id }));
    return `
      <h3>Hängt ab von</h3>${list(incoming)}
      <select class="adddep" data-add-dependency="incoming">
        <option value="">+ Voraussetzung hinzufügen…</option>${dependencyOptions(id, 'incoming')}</select>
      <h3>Ist Voraussetzung für</h3>${list(outgoing)}
      <select class="adddep" data-add-dependency="outgoing">
        <option value="">+ abhängigen Block hinzufügen…</option>${dependencyOptions(id, 'outgoing')}</select>`;
  }

  /* =====================================================================
   * Tab „Ablauf“
   * ===================================================================== */

  function planView() {
    const { tasks } = model.getState();
    if (!tasks.length) return '<p class="hint">Noch keine Aufgaben. Lege oben mit „Denken“ oder „Umsetzung“ los.</p>';
    const a = analysis;
    const byId = (id) => model.getNode(id);
    const openEffort = (kind) => tasks
      .filter((t) => t.kind === kind && t.status !== 'done')
      .reduce((sum, t) => sum + A.effortOf(t), 0);
    const done = tasks.filter((t) => t.status === 'done');
    const blocked = tasks.length - done.length - a.ready.size;

    const stats = `<div class="stats">
      <div class="stat"><b>${a.ready.size}</b><span>jetzt parallel startbar</span></div>
      <div class="stat"><b>${blocked}</b><span>blockiert / laufend</span></div>
      <div class="stat thinking"><b>${U.formatNumber(openEffort('thinking'))} PT</b><span>${I.svg('brain')} Denken offen</span></div>
      <div class="stat impl"><b>${U.formatNumber(openEffort('implementation'))} PT</b><span>${I.svg('wrench')} Umsetzung offen</span></div>
    </div>`;

    const warning = a.cycle.size
      ? `<div class="warn">⚠ Zyklische Abhängigkeit zwischen: ${[...a.cycle].map((id) => esc(byId(id).title)).join(', ')}</div>`
      : '';

    const waves = a.waves.map((ids, i) => {
      const effort = ids.reduce((sum, id) => sum + A.effortOf(byId(id)), 0);
      const items = ids.map((id) => {
        const t = byId(id);
        const running = t.status === 'in_progress' ? '● läuft · ' : '';
        return listItem(t, { meta: `<span class="small">${running}P${a.priorityOf(id)} · ${U.formatNumber(A.effortOf(t))} PT</span>` });
      });
      return `<div class="wavebox${i === 0 ? ' now' : ''}">
        <div class="wh"><span>Welle ${i + 1}${i === 0 ? ' – jetzt' : ''}</span>
        <span class="small">${ids.length} Aufgaben · ${U.formatNumber(effort)} PT</span></div>${list(items)}</div>`;
    }).join('');

    const critical = a.criticalPath.length ? `
      <h3>Kritischer Pfad · ${U.formatNumber(a.criticalEffort)} PT</h3>
      <p class="hint">Längste Kette nacheinander abhängiger Aufgaben – bestimmt die minimale Gesamtdauer.</p>
      ${list(a.criticalPath.map((id, i) => listItem(byId(id), {
        meta: `<span class="small">${i ? '↳ ' : ''}${U.formatNumber(A.effortOf(byId(id)))} PT</span>`,
      })))}` : '';

    const finished = done.length
      ? `<h3>Erledigt (${done.length})</h3>${list(done.map((t) => listItem(t, { meta: '<span class="small">✓</span>' })))}`
      : '';

    return `${stats}${warning}
      <p class="hint">Alles in einer Welle hat keine Abhängigkeit untereinander und kann <b>parallel</b> bearbeitet werden. Sortiert nach Priorität.</p>
      ${waves}${critical}${finished}`;
  }

  /* =====================================================================
   * Tab „Hilfe“
   * ===================================================================== */

  function helpView() {
    return `<h3>So funktioniert's</h3>
    <ul class="help">
      <li><b>Blöcke anlegen</b> mit „Denken“, „Umsetzung“ oder „Gruppe“.</li>
      <li><b>Verschieben</b>: Block ziehen. <b>Grösse</b>: Ecke unten rechts ziehen.</li>
      <li><b>Abhängigkeit</b>: am runden Punkt rechts am Block ziehen und auf dem Block loslassen, der davon abhängt – oder im Detail-Panel wählen.</li>
      <li><b>Gruppen</b>: Blöcke in einen Rahmen ziehen. Hängt eine Gruppe von etwas ab, gilt das für alle Blöcke darin.</li>
      <li><b>Priorität</b> ergibt sich aus der Position: links hoch, rechts tief.</li>
      <li><b>Hover</b> zeigt, was vorher nötig ist (orange) und was blockiert wird (blau).</li>
      <li><b>Ablauf</b>: Wellen paralleler Arbeit, offener Aufwand, kritischer Pfad.</li>
    </ul>
    <h3>Tastatur</h3>
    <ul class="help">

      <li><b>Strg + Mausrad</b> zoomen · leere Fläche ziehen = verschieben</li>
    </ul>
    <h3>Speichern & Teilen</h3>
    <ul class="help">
      <li>Alles wird automatisch im Browser gespeichert.</li>
      <li><b>Export</b> speichert das Board als JSON-Datei (Format „prio-board“, siehe README), <b>Import</b> lädt sie wieder.</li>
      <li><b>Als HTML</b> erzeugt eine statische Seite nur mit dem Diagramm – zum Verschicken oder Ablegen.</li>

   * Ereignisse
   * ===================================================================== */

  const selectedNode = () => (ui.selection.type === 'node' ? model.getNode(ui.selection.id) : null);

  function onTabClick(event) {
    const button = event.target.closest('button[data-tab]');
    if (!button) return;
    ui.tab = button.dataset.tab;
    render(analysis);

  /** Text-Eingaben: ein Historieneintrag pro Fokus, Seitenleiste wird nicht neu gezeichnet. */
  function onInput(event) {
    const name = event.target.dataset.field;
    const node = selectedNode();
    if (!name || !node || event.target.tagName === 'SELECT') return;
    if (editCheckpointPending) {
      model.checkpoint();
      editCheckpointPending = false;
    }
    model.updateNode(node.id, { [name]: readField(name, event.target.value) }, { record: false, source: 'sidebar' });
  }

  function readField(name, value) {
    if (name === 'notes') return value.split('\n').map((s) => s.trim()).filter(Boolean);
    if (name === 'effortDays') return U.parseNumber(value);
    return value;
  }

  function onChange(event) {
    const target = event.target;
    const node = selectedNode();
    if (!node) return;
    if (target.tagName === 'SELECT' && target.dataset.field) {
      model.updateNode(node.id, { [target.dataset.field]: target.value });
    } else if (target.dataset.addDependency && target.value) {
      const [from, to] = target.dataset.addDependency === 'incoming' ? [target.value, node.id] : [node.id, target.value];
      actions.addDependency(from, to);
    }
  }

  function onClick(event) {
    const remove = event.target.closest('[data-remove-dep]');
    if (remove) {
      event.stopPropagation();
      model.removeDependency(remove.dataset.removeDep);
      return;
    }
    const action = event.target.closest('[data-action]');
    if (action) {
      actions.run(action.dataset.action);
      return;
    }
    const item = event.target.closest('[data-goto]');
    if (item) actions.goTo(item.dataset.goto);
  }

  function onHover(event) {
    const item = event.target.closest('[data-goto]');
    actions.hover(item ? item.dataset.goto : null);
  }

  return { init, render };
})();

/* js/ui/dialog.js */
/**
 * Eigene Dialoge statt alert()/confirm() und Datei-Download-Fallback.
 *
 * Grund: In eingebetteten Vorschauen (sandboxed iframes) werden alert/confirm ignoriert
 * und Downloads still blockiert. Diese Dialoge funktionieren überall; Exporte bieten
 * zusätzlich „In Zwischenablage kopieren“, Importe „JSON einfügen“.
 */
PB.dialog = (() => {
  const esc = PB.util.escapeHtml;
  let dialog = null;

  function ensure() {
    if (dialog) return dialog;
    dialog = document.createElement('dialog');
    dialog.className = 'pb-dialog';
    document.body.appendChild(dialog);
    return dialog;
  }

  /** Öffnet einen Dialog; resolve(value) schliesst ihn. */
  function open(html, setup) {
    const d = ensure();
    d.innerHTML = `<form method="dialog" class="pb-dialog-body">${html}</form>`;
    return new Promise((resolve) => {
      const finish = (value) => {
        d.close();
        resolve(value);
      };
      d.onclose = () => resolve(undefined);
      d.querySelectorAll('[data-result]').forEach((b) => b.addEventListener('click', (e) => {
        e.preventDefault();
        finish(b.dataset.result === 'true');
      }));
      setup?.(d, finish);
      d.showModal();
    });
  }

  const paragraphs = (text) => esc(text).split('\n').map((line) => `<p>${line}</p>`).join('');

  /** Ja/Nein-Frage. Liefert true/false. */
  async function confirm(message, { okLabel = 'OK', danger = false } = {}) {
    const result = await open(`
      <div class="pb-dialog-text">${paragraphs(message)}</div>
      <div class="pb-dialog-actions">
        <button class="btn" data-result="false">Abbrechen</button>
        <button class="btn primary${danger ? ' danger' : ''}" data-result="true" autofocus>${esc(okLabel)}</button>
      </div>`);
    return result === true;
  }

  /** Hinweis mit OK-Knopf. */
  function alert(message, { title = 'Hinweis' } = {}) {
    return open(`
      <h2>${esc(title)}</h2>
      <div class="pb-dialog-text">${paragraphs(message)}</div>
      <div class="pb-dialog-actions"><button class="btn primary" data-result="true" autofocus>OK</button></div>`);
  }

  async function copyText(textarea) {
    try {
      await navigator.clipboard.writeText(textarea.value);
      return true;
    } catch {
      textarea.focus();
      textarea.select();
      try {
        return document.execCommand('copy');
      } catch {
        return false;
      }
    }
  }

  /**
   * Export-Dialog: Herunterladen und/oder Kopieren.
   * download: Funktion, die den Download auslöst.
   */
  function exportFile({ title, description, filename, content, download }) {
    return open(`
      <h2>${esc(title)}</h2>
      <p class="pb-dialog-hint">${esc(description)}</p>
      <textarea class="pb-dialog-code" readonly spellcheck="false">${esc(content)}</textarea>
      <p class="pb-dialog-hint small">Falls der Download hier blockiert ist (z. B. in einer Vorschau):
        kopieren, in einen Texteditor einfügen und als <b>${esc(filename)}</b> speichern.</p>
      <div class="pb-dialog-actions">
        <span class="pb-dialog-status" aria-live="polite"></span>
        <button class="btn" data-result="false">Schliessen</button>
        <button class="btn" data-copy>In Zwischenablage kopieren</button>
        <button class="btn primary" data-download autofocus>Herunterladen</button>
      </div>`, (d) => {
      const status = d.querySelector('.pb-dialog-status');
      d.querySelector('[data-download]').addEventListener('click', (e) => {
        e.preventDefault();
        download();
        status.textContent = 'Download gestartet – falls nichts passiert: kopieren.';
      });
      d.querySelector('[data-copy]').addEventListener('click', async (e) => {
        e.preventDefault();
        status.textContent = (await copyText(d.querySelector('textarea'))) ? '✓ Kopiert' : 'Bitte Text markieren und mit Strg+C kopieren';
      });
    });
  }

  /** Import-Dialog: Datei wählen oder Text einfügen. Liefert den Text oder undefined. */
  function importFile() {
    return open(`
      <h2>Board importieren</h2>
      <p class="pb-dialog-hint">JSON-Datei („prio-board“) oder eine mit „Als HTML“ erstellte Seite.</p>
      <label class="btn pb-file">Datei wählen…<input type="file" accept=".json,application/json,.html,text/html" hidden></label>
      <p class="pb-dialog-hint">…oder Inhalt hier einfügen:</p>
      <textarea class="pb-dialog-code" spellcheck="false" placeholder='{ "format": "prio-board", … }'></textarea>
      <div class="pb-dialog-actions">
        <button class="btn" data-result="false">Abbrechen</button>
        <button class="btn primary" data-import>Importieren</button>
      </div>`, (d, finish) => {
      const textarea = d.querySelector('textarea');
      d.querySelector('input[type=file]').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) finish(await file.text());
      });
      d.querySelector('[data-import]').addEventListener('click', (e) => {
        e.preventDefault();
        if (textarea.value.trim()) finish(textarea.value);
        else textarea.focus();
      });
    });
  }

  return { confirm, alert, exportFile, importFile };
})();

  <script>
/* js/ui/interactions.js */
/**
 * Maus-/Touch-Interaktionen auf der Arbeitsfläche:
 * Verschieben, Grösse ändern, Abhängigkeiten ziehen, Pannen, Hover, Zoom mit Strg+Mausrad.
 */
PB.interactions = (() => {
  const C = PB.config;
  const U = PB.util;
  const model = PB.model;
  const board = PB.board;
  const ui = PB.ui;

  /** Ab dieser Mausbewegung (px) gilt ein Klick als Ziehen. */
  const DRAG_THRESHOLD = 4;

  let dom = null;
  let actions = null;

  function init(elements, callbacks) {
    dom = elements;
    actions = callbacks;
    dom.canvas.addEventListener('pointerdown', onPointerDown);
    dom.canvas.addEventListener('wheel', onWheel, { passive: false });
    dom.world.addEventListener('pointerover', onPointerOver);
    dom.world.addEventListener('pointerleave', () => actions.hover(null));
    dom.world.addEventListener('dblclick', onDoubleClick);
  }

  /* ---------- Verteilung ---------- */

  function onPointerDown(event) {
    if (event.button !== 0 && event.button !== 1) return;
    const target = event.target;
    const block = target.closest('.block');
    const id = block?.dataset.id;
    if (block && target.closest('.port')) return startLink(event, id);
    if (block && target.closest('.rs')) return startResize(event, id);
    if (block && event.button === 0) return startMove(event, id);
    const link = target.closest('.link');
    if (link) return actions.select('dependency', link.dataset.dep);
    return startPan(event);
  }

  /** Verfolgt eine Zeigerbewegung bis zum Loslassen. */
  function track(onMove, onEnd) {
    const move = (e) => onMove(e);
    const end = (e) => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', end);
      window.removeEventListener('pointercancel', end);
      ui.dragging = false;
      onEnd(e);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  }

  /** Startet eine Geste beim ersten echten Bewegen (damit Klicks keinen Historieneintrag erzeugen). */
  function gesture() {
    let started = false;
    return {
      get started() { return started; },
      start() {
        if (started) return;
        started = true;
        ui.dragging = true;
        model.beginGesture();
        board.applyHighlight();
      },
    };
  }

  /* ---------- Verschieben ---------- */

  function startMove(event, id) {
    event.preventDefault();
    actions.select('node', id);
    const origin = board.toWorld(event.clientX, event.clientY);
    // Gruppen nehmen ihren Inhalt mit
    const moving = [id, ...model.descendantsOf(id)].map((nodeId) => {
      const { x, y } = model.getNode(nodeId).layout;
      return { id: nodeId, x, y };
    });
    const lead = moving[0];
    const g = gesture();

    track((e) => {
      const p = board.toWorld(e.clientX, e.clientY);
      const dx = p.x - origin.x;
      const dy = p.y - origin.y;
      if (!g.started && Math.hypot(dx, dy) * model.getState().view.zoom < DRAG_THRESHOLD) return;
      g.start();
      const offsetX = Math.max(0, U.snap(lead.x + dx)) - lead.x;
      const offsetY = Math.max(0, U.snap(lead.y + dy)) - lead.y;
      moving.forEach((m) => model.setLayout(m.id, { x: m.x + offsetX, y: m.y + offsetY }));
      board.refreshLayout(moving.map((m) => m.id));
    }, () => {
      if (g.started) model.endGesture();
    });
  }

  /* ---------- Grösse ändern ---------- */

  function startResize(event, id) {
    event.preventDefault();
    event.stopPropagation();
    actions.select('node', id);
    const node = model.getNode(id);
    const origin = board.toWorld(event.clientX, event.clientY);
    const start = { width: node.layout.width, height: node.layout.height };
    const min = model.isGroup(id) ? C.MIN_SIZE.group : C.MIN_SIZE.task;
    const g = gesture();

    track((e) => {
      g.start();
      const p = board.toWorld(e.clientX, e.clientY);
      model.setLayout(id, {
        width: Math.max(min.width, U.snap(start.width + p.x - origin.x)),
        height: Math.max(min.height, U.snap(start.height + p.y - origin.y)),
      });
      board.refreshLayout([id]);
    }, () => {
      if (g.started) model.endGesture();
    });
  }

  /* ---------- Abhängigkeit ziehen ---------- */

  function startLink(event, fromId) {
    event.preventDefault();
    event.stopPropagation();
    ui.dragging = true;
    document.body.classList.add('linking');
    board.applyHighlight();

    track((e) => {
      board.showDraftLink(fromId, board.toWorld(e.clientX, e.clientY));
    }, (e) => {
      document.body.classList.remove('linking');
      board.hideDraftLink();
      const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.block');
      if (target && target.dataset.id !== fromId) actions.addDependency(fromId, target.dataset.id);
      else board.applyHighlight();
    });
  }

  /* ---------- Pannen ---------- */

  function startPan(event) {
    const canvas = dom.canvas;
    const start = { left: canvas.scrollLeft, top: canvas.scrollTop, x: event.clientX, y: event.clientY };
    let moved = false;
    canvas.classList.add('panning');
    track((e) => {
      if (Math.abs(e.clientX - start.x) + Math.abs(e.clientY - start.y) > DRAG_THRESHOLD) moved = true;
      canvas.scrollLeft = start.left - (e.clientX - start.x);
      canvas.scrollTop = start.top - (e.clientY - start.y);
    }, () => {
      canvas.classList.remove('panning');
      if (!moved) actions.clearSelection();
    });
  }

  /* ---------- Hover, Doppelklick, Zoom ---------- */

  function onPointerOver(event) {
    if (ui.dragging) return;
    actions.hover(event.target.closest('.block')?.dataset.id ?? null);
  }

  function onDoubleClick(event) {
    const block = event.target.closest('.block');
    if (!block) return;
    actions.select('node', block.dataset.id);
    actions.focusTitle();
  }

  function onWheel(event) {
    if (!event.ctrlKey && !event.metaKey) return;
    event.preventDefault();
    const rect = dom.canvas.getBoundingClientRect();
    const factor = event.deltaY < 0 ? 1.1 : 1 / 1.1;
    board.setZoom(model.getState().view.zoom * factor, { x: event.clientX - rect.left, y: event.clientY - rect.top });
    actions.viewChanged();
  }

  return { init };
})();
</script>
  <script>
/* js/app.js */
/**
 * Einstiegspunkt: verbindet Modell, Darstellung, Interaktionen und Werkzeugleiste.
 *
 * Datenfluss:  Benutzeraktion → PB.model (Änderung) → Ereignis → onModelChange()
 *              → Analyse → Board + Seitenleiste neu zeichnen → im Browser speichern.
 */
PB.app = (() => {
  const C = PB.config;
  const U = PB.util;
  const model = PB.model;
  const board = PB.board;
  const sidebar = PB.sidebar;
  const storage = PB.storage;
  const format = PB.format;
  const ui = PB.ui;

  const $ = (selector) => document.querySelector(selector);
  let analysis = null;
  let toastTimer = null;

  /* ---------- Start ---------- */

  function init() {
    PB.diagramStyles.inject();
    PB.icons.hydrate();

    board.init({
      canvas: $('#canvas'),
      sizer: $('#sizer'),
      world: $('#world'),
      zones: $('#zones'),
      links: $('#links'),
      linkLayer: $('#linkLayer'),
      draft: $('#draftLink'),
    });
    sidebar.init({ tabs: $('#sideTabs'), body: $('#sideBody') }, {
      goTo, hover, addDependency, run: runAction,
    });
    PB.interactions.init({ canvas: $('#canvas'), world: $('#world') }, {
      select, clearSelection, hover, addDependency, focusTitle, viewChanged: persist,
    });

    model.subscribe(onModelChange);
    bindToolbar();
    bindBoardTitle();
    bindKeyboard();

    const saved = storage.loadLocal();
    model.load(saved ? saved.state : format.parse(PB.example));
    requestAnimationFrame(() => {
      board.fit();
      updateHeader();
      persist();
      if (saved?.repairs.length) reportRepairs(saved);
    });
  }

  function onModelChange(meta = {}) {
    dropStaleSelection();
    analysis = PB.analysis.analyze(model);
    board.render(analysis);
    if (meta.source !== 'sidebar') sidebar.render(analysis);
    updateHeader();
    persist();
  }

  /** Speichert im Browser; zeigt einen Hinweis, wenn das nicht möglich ist (z. B. Vorschau/Sandbox). */
  function persist() {
    const saved = storage.saveLocal(model.getState());
    $('#saveWarning').hidden = saved;
  }

  function reportRepairs({ repairs, backupKey }) {
    const list = repairs.slice(0, 6).map((r) => `• ${r}`).join('\n');
    const more = repairs.length > 6 ? `\n• … (+${repairs.length - 6})` : '';
    PB.dialog.alert(
      `Dein gespeichertes Board hatte kleine Fehler und wurde automatisch repariert:\n${list}${more}\n\n` +
      `Das Original ist im Browser gesichert (${backupKey}).`,
      { title: 'Board repariert' });
  }

  /* ---------- Auswahl & Navigation ---------- */

  function select(type, id) {
    ui.selection = { type, id };
    ui.tab = 'details';
    board.applySelection();
    sidebar.render(analysis);
  }

  function clearSelection() {
    if (!ui.selection.type) return;
    ui.selection = { type: null, id: null };
    if (ui.tab === 'details') ui.tab = 'plan';
    board.applySelection();
    sidebar.render(analysis);
  }

  function dropStaleSelection() {
    const { type, id } = ui.selection;
    const exists = type === 'node' ? model.getNode(id) : type === 'dependency' ? model.getDependency(id) : true;
    if (!exists) ui.selection = { type: null, id: null };
  }

  function hover(id) {
    if (ui.hoverId === id) return;
    ui.hoverId = id;
    board.applyHighlight();
  }

  function goTo(id) {
    board.scrollTo(id);
    select('node', id);
  }

  function focusTitle() {
    const input = $('#sideBody [data-field="title"]');
    if (input) {
      input.focus();
      input.select();
    }
  }

  /* ---------- Aktionen ---------- */

  function addNode(kind) {
    const position = board.viewportCenter();
    const id = kind === 'group' ? model.addGroup(position) : model.addTask(kind, position);
    select('node', id);
    focusTitle();
  }

  function addDependency(from, to) {
    const result = model.addDependency(from, to);
    toast(result.ok
      ? `„${model.getNode(to).title}“ hängt jetzt von „${model.getNode(from).title}“ ab`
      : result.error);
  }

  function deleteSelection() {
    const { type, id } = ui.selection;
    if (type === 'node') model.removeNode(id);
    if (type === 'dependency') model.removeDependency(id);
  }

  function duplicateSelection() {
    if (ui.selection.type !== 'node' || model.isGroup(ui.selection.id)) return;
    const copy = model.duplicateTask(ui.selection.id);
    if (copy) select('node', copy);
  }

  function reverseSelectedDependency() {
    if (ui.selection.type !== 'dependency') return;
    const result = model.reverseDependency(ui.selection.id);
    if (!result.ok) toast(result.error);
  }

  function runAction(name) {
    const handlers = { delete: deleteSelection, duplicate: duplicateSelection, 'reverse-dependency': reverseSelectedDependency };
    handlers[name]?.();
  }

  /* ---------- Import / Export ---------- */

  const fileName = (extension) => `${U.slugify(model.getState().board.title)}-${U.today()}.${extension}`;

  function exportJson() {
    const filename = fileName('json');
    const content = JSON.stringify(format.serialize(model.getState(), { model, analysis }), null, 2);
    PB.dialog.exportFile({
      title: 'Export (JSON)',
      description: 'Das Board im Format „prio-board“ – mit „Import“ wieder ladbar.',
      filename,
      content,
      download: () => storage.downloadText(content, filename, 'application/json'),
    });
  }

  function exportHtml() {
    const filename = fileName('html');
    const content = PB.staticExport.build(analysis);
    PB.dialog.exportFile({
      title: 'Als HTML',
      description: 'Eigenständige Seite nur mit dem Diagramm – zum Verschicken oder Ablegen. Lässt sich auch wieder importieren.',
      filename,
      content,
      download: () => storage.downloadText(content, filename, 'text/html'),
    });
  }

  async function importBoard() {
    let text = await PB.dialog.importFile();
    if (!text) return;
    try {
      if (/^\s*</.test(text)) {
        text = PB.staticExport.extractData(text);
        if (!text) throw new format.FormatError(['Die HTML-Datei enthält keine Prio-Board-Daten']);
      }
      model.replace(format.parse(text));
      clearSelection();
      board.fit();
      updateHeader();
      persist();
      toast(`„${model.getState().board.title}“ importiert`);
    } catch (error) {
      if (!(error instanceof format.FormatError)) console.error(error);
      PB.dialog.alert(error instanceof format.FormatError ? error.message : `Import fehlgeschlagen: ${error.message}`,
        { title: 'Import nicht möglich' });
    }
  }

  async function loadExample() {
    if (!await PB.dialog.confirm('Aktuelles Board durch das Beispiel ersetzen?\n(Rückgängig möglich)', { okLabel: 'Ersetzen' })) return;
    model.replace(format.parse(PB.example));
    board.fit();
    updateHeader();
    persist();
  }

  async function clearBoard() {
    if (!await PB.dialog.confirm('Alle Blöcke und Abhängigkeiten entfernen?\n(Rückgängig möglich)', { okLabel: 'Leeren', danger: true })) return;
    model.clear();
  }

  /* ---------- Werkzeugleiste ---------- */

  function bindToolbar() {
    const on = (selector, handler) => $(selector).addEventListener('click', handler);
    on('#addThinking', () => addNode('thinking'));
    on('#addImplementation', () => addNode('implementation'));
    on('#addGroup', () => addNode('group'));
    on('#undo', model.undo);
    on('#redo', model.redo);
    on('#zoomIn', () => { board.setZoom(model.getState().view.zoom * C.ZOOM.step); updateHeader(); persist(); });
    on('#zoomOut', () => { board.setZoom(model.getState().view.zoom / C.ZOOM.step); updateHeader(); persist(); });
    on('#fit', () => { board.fit(); updateHeader(); persist(); });
    on('#priorityAxis', () => {
      model.setView({ showPriorityAxis: !model.getState().view.showPriorityAxis });
      board.render(analysis);
      updateHeader();
      persist();
    });
    $('#focusMode').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-focus]');
      if (!button) return;
      ui.focusMode = button.dataset.focus;
      updateHeader();
      board.applyHighlight();
    });
    bindFileMenu();
    on('#exportJson', exportJson);
    on('#exportHtml', exportHtml);
    on('#importJson', importBoard);
    on('#loadExample', loadExample);
    on('#saveWarning', () => PB.dialog.alert(
      'Diese Ansicht darf nichts im Browser speichern (z. B. eingebettete Vorschau).\n' +
      'Änderungen gehen beim Schliessen verloren. Sichere dein Board über Datei ▸ Export\n' +
      'oder öffne prio-board.html direkt im Browser (Chrome, Edge, Firefox).',
      { title: 'Nicht gespeichert' }));
    on('#clearBoard', clearBoard);
  }

  function bindFileMenu() {
    const menu = $('#fileMenu');
    const button = $('#fileMenuButton');
    const setOpen = (open) => {
      menu.classList.toggle('open', open);
      button.setAttribute('aria-expanded', String(open));
    };
    button.addEventListener('click', () => setOpen(!menu.classList.contains('open')));
    menu.querySelector('.menu-panel').addEventListener('click', () => setOpen(false));
    document.addEventListener('pointerdown', (event) => { if (!menu.contains(event.target)) setOpen(false); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') setOpen(false); });
  }

  function bindBoardTitle() {
    const title = $('#boardTitle');
    title.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === 'Escape') {
        event.preventDefault();
        title.blur();
      }
    });
    title.addEventListener('blur', () => model.setBoardTitle(title.textContent));
  }

  function updateHeader() {
    const { board: info, view } = model.getState();
    const title = $('#boardTitle');
    if (document.activeElement !== title) title.textContent = info.title;
    document.title = `${info.title} – Prio-Board`;
    $('#undo').disabled = !model.canUndo();
    $('#redo').disabled = !model.canRedo();
    $('#zoomLabel').textContent = `${Math.round(view.zoom * 100)}%`;
    $('#priorityAxis').classList.toggle('on', view.showPriorityAxis);
    document.querySelectorAll('#focusMode button').forEach((b) => b.classList.toggle('on', b.dataset.focus === ui.focusMode));
  }

  /* ---------- Tastatur ---------- */

  function bindKeyboard() {
    document.addEventListener('keydown', (event) => {
      const active = document.activeElement;
      const typing = active && (/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName) || active.isContentEditable);
      const mod = event.ctrlKey || event.metaKey;
      const key = event.key.toLowerCase();

      if (event.key === 'Escape') {
        if (typing) active.blur();
        clearSelection();
        return;
      }
      if (typing) return;
      if (mod && key === 'z') { event.preventDefault(); event.shiftKey ? model.redo() : model.undo(); }
      else if (mod && key === 'y') { event.preventDefault(); model.redo(); }
      else if (mod && key === 'd') { event.preventDefault(); duplicateSelection(); }
      else if (event.key === 'Delete' || event.key === 'Backspace') { event.preventDefault(); deleteSelection(); }
    });
  }

  /* ---------- Meldungen ---------- */

  function toast(message) {
    const el = $('#toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  return { init };
})();

PB.app.init();
</script>
</body>
</html>
