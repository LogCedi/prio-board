<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prio-Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
/* css/theme.css */
/*
 * Prio-Board – Design-Tokens
 * Farben, Schrift und Radien zentral anpassen (z. B. an das CSS-Corporate-Design).
 */
:root{
  --navy:#0b2d55; --navy-2:#173f72; --navy-soft:#e9eff7;
  --accent:#009fe3;
  --bg:#f3f6fa; --panel:#ffffff; --ink:#0b2d55; --text:#24364f; --muted:#62738a; --line:#dbe3ee; --soft:#eef3f9;
  --thinking:#009fe3; --thinking-bg:#eef8fd; --thinking-fill:#bde5f8; --thinking-line:#7fcdf0;
  --impl:#1f9a6b; --impl-bg:#eef8f3; --impl-fill:#bfe8d4; --impl-line:#8fd2b4;
  --group:#8a9ab0;
  --ok:#1a7f4e; --ok-bg:#dcf3e7; --wait:#9a5b00; --wait-bg:#fff1d6; --bad:#c62828; --bad-bg:#fde4e4;
  --run:#0b5cad; --run-bg:#dcecfb;
  --link:#7f90a8; --link-done:#9ccfb6; --risky:#e8590c;
  --up:#f29200; --down:#0b5cad; --crit:#d6336c; --sel:#009fe3;
  --radius:14px;
  --shadow:0 1px 2px rgba(11,45,85,.06),0 4px 14px rgba(11,45,85,.06);
}
</style>
  <style>
/* css/app.css */
/* Prio-Board – Layout & Komponenten (nutzt die Tokens aus theme.css) */
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 "Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 360px;height:100vh;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
.ico{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Kopfzeile ---------- */
header{grid-column:1/-1;display:flex;gap:6px;align-items:center;padding:9px 16px;font-size:14px;background:var(--navy);color:#fff;flex-wrap:wrap}
header h1{font-size:17px;margin:0 8px 0 0;white-space:nowrap;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
#boardTitle{outline:none;border-radius:6px;padding:1px 6px;margin-left:-6px;cursor:text;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#boardTitle:hover{background:rgba(255,255,255,.1)}
#boardTitle:focus{background:rgba(255,255,255,.16);text-overflow:clip}
header h1 .mark{width:10px;height:22px;border-radius:3px;background:var(--accent)}
.sep{width:1px;height:24px;background:rgba(255,255,255,.2);margin:0 2px}
.btn{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn.on{background:#fff;color:var(--navy);border-color:#fff}
.btn.primary{background:#fff;color:var(--navy);border-color:#fff}
.btn.primary:hover{background:var(--navy-soft)}
.btn.primary .ib{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:13px}
.btn.thinking .ib{background:var(--thinking)}
.btn.impl .ib{background:var(--impl)}
.btn.grp .ib{background:var(--group)}
.btn:disabled{opacity:.35;cursor:default}
.btn.icon{padding:4px 9px}
#zoomLabel{min-width:40px;text-align:center;opacity:.8;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:#fff;padding:4px 10px;cursor:pointer;font-weight:600}
.seg button.on{background:#fff;color:var(--navy)}
.lbl{opacity:.75;font-size:13px;margin-left:4px}
.spacer{flex:1}
.menu{position:relative}
.menu-panel{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:3000;min-width:270px;background:#fff;color:var(--text);
  border-radius:12px;box-shadow:0 10px 30px rgba(11,45,85,.22);padding:6px}
.menu.open .menu-panel{display:block}
.menu-panel button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink)}
.menu-panel button:hover{background:var(--soft)}
.menu-panel button small{display:block;color:var(--muted);font-size:12.5px}
.menu-panel button.danger b{color:var(--bad)}
.menu-panel hr{border:0;border-top:1px solid var(--line);margin:6px 4px}

/* panel buttons (light surface) */
aside .btn{color:var(--navy);border-color:var(--line);background:#fff}
aside .btn:hover{background:var(--soft);border-color:var(--navy)}
aside .btn.danger{color:var(--bad);border-color:#f2c4c4}

/* ---------- Arbeitsfläche (Diagramm-Stile: js/render/diagram-styles.js) ---------- */
#canvas{position:relative;overflow:auto;cursor:grab}
#canvas.panning{cursor:grabbing}
#sizer{position:relative}
#world .bar{user-select:none;cursor:grab;transition:opacity .15s,box-shadow .15s}
#world .bar:active{cursor:grabbing}
#world .bar.selected{outline:3px solid var(--sel);outline-offset:3px}
#world .tl-frame{pointer-events:none}
#world .tl-frame-label{pointer-events:auto;cursor:pointer;padding:0 4px;border-radius:6px}
#world .tl-frame-label:hover{background:rgba(255,255,255,.9)}
#world .tl-frame.selected{box-shadow:0 0 0 3px var(--sel)}
#world .tl-frame.drop{box-shadow:0 0 0 3px var(--sel);background:rgba(0,159,227,.08)}
#world .theme-port{pointer-events:auto;left:auto;right:-9px;top:12px;border-color:var(--c);opacity:.7}
#world .theme-port:hover{background:var(--c);border-color:var(--c);opacity:1}
/* Verschieben: Vorschau folgt der Maus, Ziel-Band markiert, übrige Elemente treten zurück */
#world .bar.drag-preview{z-index:200;opacity:.92;box-shadow:0 10px 28px rgba(11,45,85,.28);transition:none;cursor:grabbing}
#world .tl-band.drop{background:rgba(0,159,227,.09);box-shadow:inset 4px 0 0 var(--accent)}
#world.moving .pb-links,#world.moving .tl-frame{opacity:.35}
#world .drag-hint{position:absolute;z-index:300;padding:4px 10px;border-radius:999px;background:var(--navy);color:#fff;
  font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow)}
#world .lasso{position:absolute;z-index:50;border:1.5px dashed var(--sel);background:rgba(0,159,227,.08);border-radius:4px;pointer-events:none}

/* Griffe an Balken: Dauer (rechte Kante), Puffer (Ende gestrichelt), Abhängigkeit (Punkte) */
.rs{position:absolute;top:6px;bottom:6px;width:10px;cursor:ew-resize;z-index:4;border-radius:4px}
.rs.dur{right:-5px}
.rs:hover{background:rgba(11,45,85,.18)}
.port{position:absolute;left:calc(100% - 8px);top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#fff;
  border:2.5px solid var(--navy);cursor:crosshair;opacity:0;z-index:6;transition:opacity .12s}
.port.it{top:auto;bottom:-6px;margin-top:0;width:14px;height:14px;border-color:var(--thinking)}
.bar:hover>.port,.linking .port{opacity:1}
.port:hover{background:var(--accent);border-color:var(--accent)}
.linking #world .bar:hover{outline:3px dashed var(--sel);outline-offset:3px}

/* Hervorhebungen (#world-Präfix, damit sie die Diagramm-Stile überschreiben) */
#world .bar.dim{opacity:.2}
#world .bar.hl{box-shadow:0 0 0 4px rgba(11,45,85,.3),var(--shadow)}
#world .bar.up{box-shadow:0 0 0 4px var(--up)}
#world .bar.down{box-shadow:0 0 0 4px var(--down)}
#world .bar.crit{box-shadow:0 0 0 4px var(--crit)}
#world .bar.ready-hl{box-shadow:0 0 0 4px var(--ok)}

/* Doppelklick-Menü */
.create-menu{position:fixed;z-index:3000;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(11,45,85,.22);padding:8px;
  display:flex;flex-direction:column;gap:2px;min-width:190px}
.create-menu>span{font-size:12px;color:var(--muted);padding:2px 8px 4px}
.create-menu button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:7px 8px;border-radius:8px;cursor:pointer;
  font-weight:600;color:var(--ink);text-align:left}
.create-menu button:hover{background:var(--soft)}

/* ---------- Pfeile (interaktiv) ---------- */
#world .pb-links .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
#world .link.up .vis{stroke:var(--up);stroke-width:3.2;marker-end:url(#m-up)}
#world .link.down .vis{stroke:var(--down);stroke-width:3.2;marker-end:url(#m-down)}
#world .link.crit .vis{stroke:var(--crit);stroke-width:3.2;marker-end:url(#m-crit)}
#world .link.sel .vis{stroke:var(--sel);stroke-width:3.6;marker-end:url(#m-sel)}
#world .link.dim .vis{opacity:.15}
#world .link:hover .vis{stroke-width:3.6}
#world .pb-links .draft{fill:none;stroke:var(--sel);stroke-width:2.5;stroke-dasharray:6 5;marker-end:url(#m-sel)}

/* ---------- Seitenleiste ---------- */
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;padding:0 10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:13px 8px 11px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--navy);border-bottom-color:var(--accent)}
#sideBody{overflow:auto;padding:18px;flex:1}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:5px}
.field input,.field select,.field textarea,select.adddep{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus,select.adddep:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,159,227,.15)}
.field input:disabled{background:var(--soft);color:var(--muted)}
.field textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:10px}
.row>.field{flex:1}
.hint{font-size:13px;color:var(--muted)}
h3{font-size:12px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.8px;color:var(--navy)}
h3:first-child{margin-top:0}
ul.help{padding-left:18px;margin:0 0 10px}
ul.help li{margin-bottom:4px}
ul.list{list-style:none;margin:0 0 8px;padding:0}
ul.list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer}
ul.list li:hover{background:var(--soft)}
ul.list li .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
ul.list li .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
ul.list li .x:hover{color:var(--bad)}
.dot{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:12px}
.dot.thinking{background:var(--thinking)}
.dot.implementation{background:var(--impl)}
.small{font-size:12px;color:var(--muted);white-space:nowrap}
.wavebox{border:1.5px solid var(--line);border-radius:var(--radius);padding:10px 8px 4px;margin-bottom:12px}
.wavebox .wh{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;color:var(--navy);margin:0 6px 4px}
.wavebox.now{border-color:var(--ok);background:#f5fbf8}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;color:var(--navy)}
.stat span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.stat.thinking b{color:var(--thinking)} .stat.impl b{color:var(--impl)}
.warn{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px;margin-bottom:12px;font-size:14px}
.legend{display:grid;gap:8px;font-size:13.5px}
.legend div{display:flex;gap:10px;align-items:center}
.sw{width:32px;height:20px;border-radius:6px;flex:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
  padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:9999;font-size:14px;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr 42vh}
  aside{border-left:0;border-top:1px solid var(--line)}
}
@media print{
  header,aside{display:none}
  body{display:block;height:auto}
  #canvas{overflow:visible}
}

/* ---------- Dialoge (js/ui/dialog.js) ---------- */
.pb-dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(11,45,85,.3);color:var(--text)}
.pb-dialog::backdrop{background:rgba(11,45,85,.45)}
.pb-dialog-body{padding:22px 24px 18px}
.pb-dialog h2{margin:0 0 10px;font-size:19px;color:var(--ink)}
.pb-dialog-text p{margin:0 0 6px}
.pb-dialog-hint{margin:0 0 10px;color:var(--muted);font-size:14px}
.pb-dialog-hint.small{font-size:13px;margin-top:8px}
.pb-dialog-code{width:100%;height:180px;border:1.5px solid var(--line);border-radius:10px;padding:10px;resize:vertical;
  font:12.5px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--text);background:var(--soft)}
.pb-dialog-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px;flex-wrap:wrap}
.pb-dialog-status{flex:1;font-size:13px;color:var(--ok)}
.pb-dialog .btn{color:var(--navy);border-color:var(--line);background:#fff}
.pb-dialog .btn:hover{background:var(--soft);border-color:var(--navy)}
.pb-dialog .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.pb-dialog .btn.primary:hover{background:var(--navy-2)}
.pb-dialog .btn.primary.danger{background:var(--bad);border-color:var(--bad)}
.pb-file{margin-bottom:12px}
header .btn.warn{background:#fff1d6;color:#7a4700;border-color:#fff1d6;line-height:1.2;height:30px}

/* Schmalere Fenster (z. B. eingebettete Vorschau): Kopfzeile kompakter, damit sie einzeilig bleibt */
@media (max-width:1500px){
  header{gap:4px;padding:8px 12px}
  header .btn{padding:4px 9px}
  .seg button{padding:4px 8px}
  #boardTitle{max-width:150px}
  #saveWarning .long{display:none}
}
@media (max-width:1250px){
  #addThinking,#addImplementation,#addGroup{font-size:0;gap:0;padding:4px}
  #addThinking .ib,#addImplementation .ib,#addGroup .ib{font-size:13px}
  #fit,#zoomLabel,.sep{display:none}
}

/* ---------- Eingaben in der Seitenleiste ---------- */
.duration{display:flex;align-items:center;gap:10px}
.duration input{width:90px !important;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#sideBody .chips{margin-bottom:14px}
.field .chips{margin-bottom:0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer}
.chip:hover{border-color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.iter-row{display:grid;grid-template-columns:auto 1fr 54px 104px auto;gap:6px;align-items:center;margin-bottom:6px}
.iter-row input:not([type=checkbox]),.iter-row select{border:1.5px solid var(--line);border-radius:8px;padding:5px 6px;width:100%;min-width:0;background:#fff}
.iter-head{margin-bottom:2px;font-size:11.5px;font-weight:700;color:var(--muted)}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text);cursor:pointer}
.field input[type=color]{height:36px;padding:2px}
.dot.theme{border-radius:4px;border:2px solid var(--c);background:transparent}
.sw.int-focused{border:1.5px solid var(--thinking-line);background:var(--thinking-fill)}
.sw.int-medium{border:1.5px solid var(--thinking-line);background:repeating-linear-gradient(-45deg,var(--thinking-fill) 0 4px,var(--thinking-bg) 4px 5.5px)}
.sw.int-background{border:1.5px solid var(--thinking-line);background:repeating-linear-gradient(-45deg,var(--thinking-fill) 0 2px,var(--thinking-bg) 2px 7px)}
.sw.frame{border:2px solid #7b5ea7;background:transparent}
.sw.buffer{border:1.5px dashed var(--thinking-line);background:linear-gradient(90deg,rgba(0,159,227,.22),rgba(0,159,227,.04))}
.sw.ongoing{background:linear-gradient(90deg,rgba(0,159,227,.35),rgba(0,159,227,0))}
.sw.risky-line{height:3px;border-radius:2px;background:var(--risky)}
.legend .lev{min-width:32px;font-weight:700;color:var(--ink)}
</style>
</head>
<body>
  <header>
    <h1><span class="mark"></span><span id="boardTitle" contenteditable="plaintext-only" spellcheck="false" title="Titel bearbeiten">Prio-Board</span></h1>

    <button class="btn primary thinking" id="addThinking" title="Analyse/Konzept – braucht Denkzeit"><span class="ib" data-icon="brain"></span>Denken</button>
    <button class="btn primary impl" id="addImplementation" title="Direkt umsetzbar"><span class="ib" data-icon="wrench"></span>Umsetzung</button>
    <button class="btn primary grp" id="addTheme" title="Thema anlegen – ausgewählte Aufgaben werden zugeordnet"><span class="ib" data-icon="group"></span>Thema</button>
    <span class="sep"></span>

    <button class="btn icon" id="undo" title="Rückgängig (Strg+Z)">↶</button>
    <button class="btn icon" id="redo" title="Wiederholen (Strg+Y)">↷</button>
    <span class="sep"></span>

    <button class="btn icon" id="zoomOut" title="Verkleinern">−</button>
    <span id="zoomLabel">100%</span>
    <button class="btn icon" id="zoomIn" title="Vergrössern">+</button>
    <button class="btn" id="fit">Einpassen</button>
    <span class="sep"></span>

    <div class="seg" id="focusMode" title="Fokus: hebt Balken hervor">
      <button data-focus="none" class="on">Aus</button>
      <button data-focus="ready">Jetzt startbar</button>
      <button data-focus="critical">Kritischer Pfad</button>
    </div>

    <span class="spacer"></span>
    <button class="btn warn" id="saveWarning" hidden title="Wird nicht im Browser gespeichert – Details">⚠<span class="long"> Nicht gespeichert</span></button>
    <div class="menu" id="fileMenu">
      <button class="btn" id="fileMenuButton" aria-haspopup="true" aria-expanded="false">Datei ▾</button>
      <div class="menu-panel" role="menu">
        <button role="menuitem" id="exportHtml"><b>Als HTML</b><small>Statische Seite nur mit dem Diagramm</small></button>
        <button role="menuitem" id="exportJson"><b>Export (JSON)</b><small>Board als Datei speichern</small></button>
        <button role="menuitem" id="importJson"><b>Import</b><small>JSON oder exportierte HTML-Seite laden</small></button>
        <hr>
        <button role="menuitem" id="loadExample"><b>Beispiel laden</b></button>
        <button role="menuitem" id="clearBoard" class="danger"><b>Board leeren</b></button>
      </div>
    </div>
  </header>

  <div id="canvas">
    <div id="sizer">
      <div id="world" class="pb-world"></div>
    </div>
  </div>

  <div id="createMenu" class="create-menu" hidden>
    <span>Neu an dieser Stelle:</span>
    <button data-kind="thinking"><span class="dot thinking" data-icon="brain"></span>Denken</button>
    <button data-kind="implementation"><span class="dot implementation" data-icon="wrench"></span>Umsetzung</button>
  </div>

  <aside>
    <nav class="tabs" id="sideTabs">
      <button data-tab="details">Details</button>
      <button data-tab="plan">Ablauf</button>
      <button data-tab="help">Hilfe</button>
    </nav>
    <div id="sideBody"></div>
  </aside>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Reihenfolge = Abhängigkeiten der Module -->
  <script>
/* js/core/config.js */
/**
 * Prio-Board – zentrale Konfiguration.
 * Alle Module hängen am globalen Namensraum `PB` (klassische Skripte,
 * damit das Tool auch per Doppelklick über file:// funktioniert).
 */
window.PB = window.PB || {};

PB.config = Object.freeze({
  /* ---------- Zeitachse (x) ---------- */
  /** Breite eines Arbeitstags in Pixeln (1 Woche = 5 Tage). */
  DAY_WIDTH: 28,
  /** Mindestens so viele Arbeitstage werden angezeigt (12 Wochen). */
  MIN_HORIZON_DAYS: 60,
  /** Freier Platz nach dem spätesten Ende (4 Wochen). */
  HORIZON_TAIL_DAYS: 20,

  /* ---------- Prioritätsbänder (y) ---------- */
  PRIORITY_LEVELS: 5,
  PRIORITY_LABELS: ['sehr hoch', 'hoch', 'mittel', 'tief', 'sehr tief'],
  LABEL_WIDTH: 132,
  HEADER_HEIGHT: 50,
  BAR_HEIGHT: 58,
  ROW_GAP: 12,
  BAND_PADDING: 14,
  /** Themen-Rahmen: Kopfzeile mit Namen, Innenabstand, Abstand zwischen Abschnitten eines Bandes. */
  FRAME_HEADER: 24,
  FRAME_PADDING: 10,
  SECTION_GAP: 12,
  /** Schmaler als das → Titel steht rechts neben dem Balken. */

/* js/core/util.js */
/** Kleine, zustandslose Hilfsfunktionen. */
PB.util = (() => {
  const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ESCAPES[c]);
  const uid = (prefix) => `${prefix}-${Math.random().toString(36).slice(2, 9)}`;
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

  /** Geometrie auf Layout-Objekten { x, y, width, height } (für die Migration alter Boards). */
  const center = (l) => ({ x: l.x + l.width / 2, y: l.y + l.height / 2 });
  const area = (l) => l.width * l.height;
  const containsPoint = (l, p) => p.x > l.x && p.x < l.x + l.width && p.y > l.y && p.y < l.y + l.height;

  /** "2,5" → 2.5; leer/ungültig → null */
  function parseNumber(value) {
    if (value === null || value === undefined || value === '') return null;
    const n = Number(String(value).trim().replace(',', '.'));
    return Number.isFinite(n) ? n : null;
  }

  function slugify(text) {
    return String(text || 'prio-board')
      .toLowerCase()
      .replace(/ß/g, 'ss')
      .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'prio-board';
  }

  const today = () => new Date().toISOString().slice(0, 10);

  return { escapeHtml, uid, clamp, center, area, containsPoint, parseNumber, slugify, today };
})();

  <script>
/* js/core/calendar.js */
/**
 * Arbeitstag-Kalender. Interne Zeiteinheit ist der Arbeitstag ab heute:
 *   Tag 0 = heute (am Wochenende: nächster Montag), Tag 5 = eine Woche später.
 * Wochenenden werden übersprungen. Daten vor heute werden auf heute gesetzt.
 */
PB.calendar = (() => {
  const isWeekend = (d) => d.getDay() === 0 || d.getDay() === 6;

  function startOfDay(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function nextBusinessDay(date) {
    const d = startOfDay(date);
    while (isWeekend(d)) d.setDate(d.getDate() + 1);
    return d;
  }

  /** Tag 0 – einmal beim Laden festgelegt, damit sich während der Sitzung nichts verschiebt. */
  const origin = nextBusinessDay(new Date());

  /** Arbeitstag-Index → Datum */
  function dateOf(day) {
    const d = new Date(origin);
    let left = Math.max(0, Math.round(day));
    while (left > 0) {
      d.setDate(d.getDate() + 1);
      if (!isWeekend(d)) left--;
    }
    return d;
  }

  /** "YYYY-MM-DD" → Arbeitstag-Index (Vergangenheit → 0, ungültig → null). */
  function dayOf(iso) {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    if (!match) return null;
    const target = nextBusinessDay(new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])));
    if (Number.isNaN(target.getTime())) return null;
    if (target <= origin) return 0;
    let day = 0;
    const d = new Date(origin);
    while (d < target) {
      d.setDate(d.getDate() + 1);
      if (!isWeekend(d)) day++;
    }
    return day;
  }

  const pad = (n) => String(n).padStart(2, '0');
  const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const isoOf = (day) => isoDate(dateOf(day));

  /** ISO-Kalenderwoche */
  function weekNumber(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const weekday = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - weekday);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  }

  const shortDate = (date) => `${date.getDate()}.${date.getMonth() + 1}.`;
  const longDate = (date) => `${pad(date.getDate())}.${pad(date.getMonth() + 1)}.${date.getFullYear()}`;

  /** Wochenanfänge (Montage) im Bereich [0, totalDays) – Tag 0 immer dabei. */
  function weeks(totalDays) {
    const result = [];
    for (let day = 0; day < totalDays; day++) {
      const date = dateOf(day);
      if (day === 0 || date.getDay() === 1) result.push({ day, date, week: weekNumber(date) });
    }
    return result;
  }

  /** 12 → "2 Wo 2 T" */
  function durationLabel(days) {
    const n = Math.max(0, Math.round(days));
    const w = Math.floor(n / 5);
    const d = n % 5;
    if (!w) return `${d} T`;
    return d ? `${w} Wo ${d} T` : `${w} Wo`;
  }

  return { origin, dateOf, dayOf, isoOf, weekNumber, shortDate, longDate, weeks, durationLabel };
})();
</script>

  <script>
/* js/domain/model.js */
/**
 * Datenmodell: Zustand, Abfragen, Änderungen, Undo/Redo.
 *
 * Zustand (intern; Zeiten in Arbeitstagen ab heute, siehe calendar.js):
 *   { board: { title }, view: { zoom },
 *     themes: [{ id, title, color }],
 *     tasks:  [{ id, kind, title, description, notes[], status, priority,
 *                start, durationDays, bufferDays, intensity, ongoing,
 *                iterations: [{ title, durationDays, intensity, done }], theme }],
 *     dependencies: [{ id, from, to, fromIteration }] }   // from muss vor to fertig sein
 *
 * Eine Aufgabe gehört zu höchstens einem Thema (theme = id | null).
 * from/to einer Abhängigkeit sind Aufgaben oder Themen (Thema = alle Aufgaben darin).
 * fromIteration (Index oder null): Nachfolger braucht nur diese Iteration des Vorgängers.
 *
 * Aufgaben liegen frei auf der Zeitachse – Abhängigkeiten verschieben nichts automatisch.
 * Nur Aufgaben ganz ohne Startdatum (start = null, z. B. Beispiel oder alte Boards) bekommen
 * beim Laden einmalig einen Vorschlag aus ihren Abhängigkeiten (placeUnscheduled).
 */
PB.model = (() => {
  const C = PB.config;
  const U = PB.util;

  let state = createEmptyState();
  const past = [];
  const future = [];
  const listeners = new Set();

  function createEmptyState(title = 'Prio-Board', view = { zoom: 1 }) {
    return { board: { title }, view: { ...view }, themes: [], tasks: [], dependencies: [] };
  }

  /* ---------- Ereignisse ---------- */

  function subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  }

  /** Änderung melden. */
  function commit(meta) {
    listeners.forEach((fn) => fn(meta));
  }

  /* ---------- Abfragen ---------- */

  const getState = () => state;
  const getTask = (id) => state.tasks.find((t) => t.id === id) || null;
  const getTheme = (id) => state.themes.find((t) => t.id === id) || null;
  const getNode = (id) => getTask(id) || getTheme(id);
  const isTheme = (id) => state.themes.some((t) => t.id === id);
  const getDependency = (id) => state.dependencies.find((d) => d.id === id) || null;
  const membersOf = (themeId) => state.tasks.filter((t) => t.theme === themeId).map((t) => t.id);

  /** Aufgaben, für die ein Knoten steht (Aufgabe selbst oder alle Aufgaben eines Themas). */
  const tasksOf = (id) => (isTheme(id) ? membersOf(id) : getTask(id) ? [id] : []);

  /** Dauer: Summe der Iterationen, falls vorhanden, sonst durationDays. */
  function durationOf(task) {
    if (task.iterations.length) return task.iterations.reduce((sum, it) => sum + it.durationDays, 0);
    return task.durationDays;
  }
  const endOf = (task) => task.start + durationOf(task);

  /** Ende der Iteration index (inkl.); ohne gültige Iteration: Ende der Aufgabe. */
  function iterationEnd(task, index) {
    if (index === null || index === undefined || !task.iterations[index]) return endOf(task);
    return task.start + task.iterations.slice(0, index + 1).reduce((sum, it) => sum + it.durationDays, 0);
  }

  const wouldCycle = (dependencies) => PB.analysis.hasCycle(PB.analysis.predecessorMap(api, dependencies));

  /* ---------- Startvorschlag ---------- */

  /**
   * Einmaliger Vorschlag für Aufgaben ohne Startdatum: frühestens nach dem Ende ihrer Vorgänger.
   * Aufgaben mit Startdatum werden nie verändert.
   */
  function placeUnscheduled() {
    const open = new Set(state.tasks.filter((t) => t.start === null || t.start === undefined).map((t) => t.id));
    if (!open.size) return;
    open.forEach((id) => { getTask(id).start = 0; });
    const edges = PB.analysis.edges(api).filter((e) => open.has(e.to));
    for (let pass = 0; pass <= state.tasks.length; pass++) {
      let changed = false;
      for (const e of edges) {
        const to = getTask(e.to);
        const earliest = iterationEnd(getTask(e.from), e.iteration);
        if (to.start < earliest) {
          to.start = earliest;
          changed = true;
        }
      }
      if (!changed) break;
    }
  }

  /* ---------- Historie ---------- */

  function checkpoint() {
    past.push(JSON.stringify(state));
    if (past.length > C.HISTORY_LIMIT) past.shift();
    future.length = 0;
  }
  function restore(from, to) {
    if (!from.length) return;
    to.push(JSON.stringify(state));
    state = JSON.parse(from.pop());
    commit({ type: 'history' });
  }
  const undo = () => restore(past, future);
  const redo = () => restore(future, past);
  const canUndo = () => past.length > 0;
  const canRedo = () => future.length > 0;

  /* ---------- Ganzes Board ---------- */

  /** Lädt einen Zustand ohne Historieneintrag (Programmstart). */
  function load(next) {
    state = next;
    placeUnscheduled();
    commit({ type: 'load' });
  }
  /** Ersetzt den Zustand mit Historieneintrag (Import, Beispiel, Leeren). */
  function replace(next) {
    checkpoint();
    load(next);
  }
  const clear = () => replace(createEmptyState(state.board.title, state.view));

  function setBoardTitle(title) {
    const clean = String(title).trim() || 'Prio-Board';
    if (clean === state.board.title) return;
    checkpoint();
    state.board.title = clean;
    commit({ type: 'board' });
  }

  /** Ansichtseinstellungen (Zoom) – ohne Historie und ohne Ereignis. */
  function setView(patch) {
    Object.assign(state.view, patch);
  }

  /* ---------- Aufgaben ---------- */

  function addTask(kind, { priority = 3, start = 0 } = {}) {
    const task = {
      id: U.uid('t'),
      kind,
      title: C.DEFAULT_TITLES[kind],
      description: '',
      notes: [],
      status: 'open',
      priority: U.clamp(priority, 1, C.PRIORITY_LEVELS),
      start: Math.max(0, Math.round(start)),
      durationDays: C.DEFAULT_DURATION[kind],
      bufferDays: 0,
      intensity: 'focused',
      ongoing: false,
      iterations: [],
      theme: null,
    };
    checkpoint();
    state.tasks.push(task);
    commit({ type: 'add', id: task.id });
    return task.id;
  }

  /** Nur Denk-Themen haben Iterationen; Pfeile „ab Iteration“ gelten sonst für die ganze Aufgabe. */
  function normalizeKind(task) {
    if (task.kind === 'thinking' || (!task.iterations.length && !task.ongoing)) return;
    if (task.iterations.length) task.durationDays = durationOf(task);
    task.iterations = [];
    task.ongoing = false;
    state.dependencies.forEach((d) => { if (d.from === task.id) d.fromIteration = null; });
  }

  /**
   * Ändert Felder einer Aufgabe (nicht das Thema – dafür assignTheme).
   * options.record=false: kein Historieneintrag (z. B. beim Tippen, siehe checkpoint()).
   * options.source: wird im Ereignis weitergegeben (z. B. 'sidebar').
   */
  function updateTask(id, patch, { record = true, source } = {}) {
    const task = getTask(id);
    if (!task) return;
    if (record) checkpoint();
    Object.assign(task, patch);
    normalizeKind(task);
    commit({ type: 'update', id, source });
  }

  /** Gleiche Änderung für mehrere Aufgaben (ein Historieneintrag). */
  function updateTasks(ids, patch) {
    const tasks = ids.map(getTask).filter(Boolean);
    if (!tasks.length) return;
    checkpoint();
    tasks.forEach((task) => {
      Object.assign(task, patch);
      normalizeKind(task);
    });
    commit({ type: 'update' });
  }

  function removeTasks(ids) {
    const remove = new Set(ids.filter(getTask));
    if (!remove.size) return;
    checkpoint();
    state.tasks = state.tasks.filter((t) => !remove.has(t.id));
    state.dependencies = state.dependencies.filter((d) => !remove.has(d.from) && !remove.has(d.to));
    commit({ type: 'remove' });
  }

  function duplicateTask(id) {
    const task = getTask(id);
    if (!task) return null;
    const copy = { ...JSON.parse(JSON.stringify(task)), id: U.uid('t'), title: `${task.title} (Kopie)`, status: 'open' };
    copy.iterations.forEach((it) => { it.done = false; });
    checkpoint();
    state.tasks.push(copy);
    commit({ type: 'add', id: copy.id });
    return copy.id;
  }

  /* ---------- Iterationen (nur Denken) ---------- */

  function addIteration(taskId) {
    const task = getTask(taskId);
    if (!task || task.kind !== 'thinking') return;
    checkpoint();
    // Erste Iteration übernimmt die bisherige Dauer, weitere starten mit einer Woche
    const durationDays = task.iterations.length ? 5 : task.durationDays;
    task.iterations.push({ title: `Iteration ${task.iterations.length + 1}`, durationDays, intensity: task.intensity, done: false });
    commit({ type: 'update', id: taskId });
  }

  function updateIteration(taskId, index, patch, { record = true, source } = {}) {
    const iteration = getTask(taskId)?.iterations[index];
    if (!iteration) return;
    if (record) checkpoint();
    Object.assign(iteration, patch);
    iteration.durationDays = Math.max(1, Math.round(iteration.durationDays) || 1);
    commit({ type: 'update', id: taskId, source });
  }

  function removeIteration(taskId, index) {
    const task = getTask(taskId);
    if (!task?.iterations[index]) return;
    checkpoint();
    if (task.iterations.length === 1) task.durationDays = task.iterations[0].durationDays;
    task.iterations.splice(index, 1);
    for (const dep of state.dependencies) {
      if (dep.from !== taskId || dep.fromIteration === null) continue;
      if (dep.fromIteration === index) dep.fromIteration = null;
      else if (dep.fromIteration > index) dep.fromIteration -= 1;
    }
    commit({ type: 'update', id: taskId });
  }

  /* ---------- Themen ---------- */

  function addTheme() {
    const used = new Set(state.themes.map((t) => t.color));
    const color = C.THEME_COLORS.find((c) => !used.has(c)) || C.THEME_COLORS[state.themes.length % C.THEME_COLORS.length];
    const theme = { id: U.uid('th'), title: C.DEFAULT_TITLES.theme, color };
    checkpoint();
    state.themes.push(theme);
    commit({ type: 'add', id: theme.id });
    return theme.id;
  }

  function updateTheme(id, patch, { record = true, source } = {}) {
    const theme = getTheme(id);
    if (!theme) return;
    if (record) checkpoint();
    Object.assign(theme, patch);
    commit({ type: 'update', id, source });
  }

  function removeTheme(id) {
    if (!getTheme(id)) return;
    checkpoint();
    state.themes = state.themes.filter((t) => t.id !== id);
    state.tasks.forEach((t) => { if (t.theme === id) t.theme = null; });
    state.dependencies = state.dependencies.filter((d) => d.from !== id && d.to !== id);
    commit({ type: 'remove', id });
  }

  /**
   * Ordnet Aufgaben einem Thema zu (themeId = null: aus dem Thema nehmen).
   * Abgelehnt, wenn dadurch ein Zyklus entstünde oder eine Aufgabe von ihrem eigenen Thema abhinge
   * (Zyklen ergeben keine sinnvolle Reihenfolge, auch ohne automatisches Schieben).
   */
  function assignTheme(ids, themeId) {
    const tasks = ids.map(getTask).filter(Boolean);
    if (!tasks.length || (themeId !== null && !getTheme(themeId))) return { ok: false, error: 'Ungültiges Thema' };
    const direct = themeId && state.dependencies.some((d) =>
      (d.to === themeId && ids.includes(d.from)) || (d.from === themeId && ids.includes(d.to)));
    if (direct) return { ok: false, error: 'Eine Aufgabe kann nicht von ihrem eigenen Thema abhängen (oder umgekehrt)' };
    const before = tasks.map((t) => t.theme);
    tasks.forEach((t) => { t.theme = themeId; });
    const cyclic = wouldCycle();
    tasks.forEach((t, i) => { t.theme = before[i]; });
    if (cyclic) return { ok: false, error: 'Nicht möglich – das Thema würde einen Kreis (Zyklus) erzeugen' };
    checkpoint();
    tasks.forEach((t) => { t.theme = themeId; });
    commit({ type: 'update' });
    return { ok: true };
  }

  /* ---------- Abhängigkeiten ---------- */

  /** Prüft, ob from → to erlaubt ist. Liefert null oder einen Fehlertext. */
  function validateDependency(from, to, dependencies = state.dependencies) {
    if (!getNode(from) || !getNode(to) || from === to) return 'Ungültige Abhängigkeit';
    if ((isTheme(to) && getTask(from)?.theme === to) || (isTheme(from) && getTask(to)?.theme === from)) {
      return 'Ein Thema und eine Aufgabe darin können nicht voneinander abhängen';
    }
    if (dependencies.some((d) => d.from === from && d.to === to)) return 'Diese Abhängigkeit existiert bereits';
    if (wouldCycle([...dependencies, { from, to }])) return 'Nicht möglich – das würde einen Kreis (Zyklus) erzeugen';
    return null;
  }

  /** Legt from → to an (optional nur ab einer Iteration). Liefert { ok, error? }. */
  function addDependency(from, to, fromIteration = null) {
    const error = validateDependency(from, to);
    if (error) return { ok: false, error };
    const iteration = getTask(from)?.iterations[fromIteration] ? fromIteration : null;
    checkpoint();
    state.dependencies.push({ id: U.uid('d'), from, to, fromIteration: iteration });
    commit({ type: 'dependency' });
    return { ok: true };
  }

  function removeDependency(id) {
    if (!getDependency(id)) return;
    checkpoint();
    state.dependencies = state.dependencies.filter((d) => d.id !== id);
    commit({ type: 'dependency' });
  }

  function setDependencyIteration(id, fromIteration) {
    const dep = getDependency(id);
    const task = dep && getTask(dep.from);
    if (!task) return;
    checkpoint();
    dep.fromIteration = task.iterations[fromIteration] ? fromIteration : null;
    commit({ type: 'dependency' });
  }

  function reverseDependency(id) {
    const dep = getDependency(id);
    if (!dep) return { ok: false, error: 'Abhängigkeit nicht gefunden' };
    const error = validateDependency(dep.to, dep.from, state.dependencies.filter((d) => d.id !== id));
    if (error) return { ok: false, error: `Umkehren nicht möglich: ${error}` };
    checkpoint();
    [dep.from, dep.to] = [dep.to, dep.from];
    dep.fromIteration = null;
    commit({ type: 'dependency' });
    return { ok: true };
  }

  /* ---------- Gesten (Ziehen von Balken) ---------- */
  // Während einer Geste wird direkt geändert (ohne Ereignis); endGesture() meldet die Änderung.

  const beginGesture = () => checkpoint();

  /** Vorschau während einer Geste: patches = Map<taskId, Teiländerung>. */
  function previewTasks(patches) {
    patches.forEach((patch, id) => {
      const task = getTask(id);
      if (task) Object.assign(task, patch);
    });
  }

  const previewTask = (id, patch) => previewTasks(new Map([[id, patch]]));

  /** Iterationsdauer während einer Geste ändern (Grösse der letzten Iteration). */
  function previewIteration(id, index, durationDays) {
    const iteration = getTask(id)?.iterations[index];
    if (iteration) iteration.durationDays = Math.max(1, durationDays);
  }

  function endGesture() {
    commit({ type: 'layout' });
  }

  const api = {
    subscribe,
    // Abfragen
    getState, getTask, getTheme, getNode, isTheme, getDependency, membersOf, tasksOf,
    durationOf, endOf, iterationEnd,
    // Historie
    checkpoint, undo, redo, canUndo, canRedo,
    // Board
    createEmptyState, load, replace, clear, setBoardTitle, setView,
    // Aufgaben & Iterationen
    addTask, updateTask, updateTasks, removeTasks, duplicateTask, addIteration, updateIteration, removeIteration,
    // Themen
    addTheme, updateTheme, removeTheme, assignTheme,
    // Abhängigkeiten
    validateDependency, addDependency, removeDependency, setDependencyIteration, reverseDependency,
    // Gesten
    beginGesture, previewTasks, previewTask, previewIteration, endGesture,
  };
  return api;

  <script>
/* js/domain/analysis.js */
/**
 * Abhängigkeitsanalyse (reine Funktionen über dem Modell).
 *
 * Kanten (edges) verbinden immer Aufgaben: Eine Abhängigkeit auf/von einem Thema
 * wird zu Kanten auf/von allen Aufgaben dieses Themas aufgelöst.
 */
PB.analysis = (() => {
  /** Alle Aufgaben-Kanten: { depId, from, to, iteration, viaTheme } */
  function edges(model, dependencies = model.getState().dependencies) {
    const result = [];
    for (const dep of dependencies) {
      const viaTheme = model.isTheme(dep.from) || model.isTheme(dep.to);
      const iteration = model.isTheme(dep.from) ? null : dep.fromIteration ?? null;
      for (const from of model.tasksOf(dep.from)) {
        for (const to of model.tasksOf(dep.to)) {
          if (from !== to) result.push({ depId: dep.id, from, to, iteration, viaTheme });
        }
      }
    }
    return result;
  }

  /** Map<taskId, Set<taskId>> der Vorgänger. */
  function predecessorMap(model, dependencies) {
    const preds = new Map(model.getState().tasks.map((t) => [t.id, new Set()]));
    for (const e of edges(model, dependencies)) preds.get(e.to)?.add(e.from);
    return preds;
  }

  function hasCycle(preds) {
    const VISITING = 1;
    const DONE = 2;
    const mark = new Map();
    const visit = (node) => {
      mark.set(node, VISITING);
      for (const p of preds.get(node) || []) {
        if (mark.get(p) === VISITING) return true;
        if (!mark.has(p) && visit(p)) return true;
      }
      mark.set(node, DONE);
      return false;
    };
    for (const node of preds.keys()) if (!mark.has(node) && visit(node)) return true;
    return false;
  }

  /** Transitive Hülle ausgehend von start über map (Vorgänger oder Nachfolger). */
  function closure(start, map) {
    const result = new Set();
    const stack = [...start];
    while (stack.length) {
      for (const next of map.get(stack.pop()) || []) {
        if (!result.has(next)) {
          result.add(next);
          stack.push(next);
        }
      }
    }
    return result;
  }

  /**
   * Vollständige Auswertung:
   *  - Wellen: offene Aufgaben in topologischen Stufen (gleiche Welle = parallel möglich)
   *  - ready: alle Vorgänger erledigt
   *  - leverage („Hebel“): Anzahl offener Umsetzungen, die eine Aufgabe (indirekt) freigibt
   *  - kritischer Pfad: längste Kette nach Dauer über offene Aufgaben
   *  - riskante Kanten: Nachfolger startet, bevor der Vorgänger (inkl. Puffer) fertig ist
   */
  function analyze(model) {
    const { tasks } = model.getState();
    const byId = new Map(tasks.map((t) => [t.id, t]));
    const isDone = (id) => byId.get(id)?.status === 'done';
    const allEdges = edges(model);

    const predecessors = new Map(tasks.map((t) => [t.id, new Set()]));
    const successors = new Map(tasks.map((t) => [t.id, new Set()]));
    for (const e of allEdges) {
      predecessors.get(e.to).add(e.from);
      successors.get(e.from).add(e.to);
    }

    // Kahn-Algorithmus über offene Aufgaben
    const open = tasks.filter((t) => !isDone(t.id));
    const remaining = new Map(open.map((t) => [t.id, [...predecessors.get(t.id)].filter((p) => !isDone(p)).length]));
    const wave = new Map();
    const order = open.filter((t) => remaining.get(t.id) === 0).map((t) => t.id);
    order.forEach((id) => wave.set(id, 1));
    for (let i = 0; i < order.length; i++) {
      for (const next of successors.get(order[i])) {
        if (!remaining.has(next)) continue;
        wave.set(next, Math.max(wave.get(next) || 1, wave.get(order[i]) + 1));
        remaining.set(next, remaining.get(next) - 1);
        if (remaining.get(next) === 0) order.push(next);
      }
    }
    const inOrder = new Set(order);
    const cycle = new Set(open.filter((t) => !inOrder.has(t.id)).map((t) => t.id));

    const openPredecessors = (id) => [...(predecessors.get(id) || [])].filter((p) => !isDone(p));
    const ready = new Set(open.filter((t) => !cycle.has(t.id) && openPredecessors(t.id).length === 0).map((t) => t.id));

    const waves = [];
    wave.forEach((n, id) => (waves[n - 1] ||= []).push(id));
    const byPriorityThenStart = (a, b) => byId.get(a).priority - byId.get(b).priority || byId.get(a).start - byId.get(b).start;
    waves.forEach((list) => list.sort(byPriorityThenStart));

    // Hebel
    const leverage = new Map(tasks.map((t) => [t.id,
      [...closure([t.id], successors)].filter((id) => byId.get(id).kind === 'implementation' && !isDone(id)).length]));

    // Kritischer Pfad
    const finish = new Map();
    const via = new Map();
    for (const id of order) {
      let best = 0;
      let bestPred = null;
      for (const p of predecessors.get(id)) {
        if (finish.has(p) && finish.get(p) > best) {
          best = finish.get(p);
          bestPred = p;
        }
      }
      finish.set(id, best + model.durationOf(byId.get(id)));
      via.set(id, bestPred);
    }
    let end = null;
    finish.forEach((f, id) => { if (end === null || f > finish.get(end)) end = id; });
    const criticalPath = [];
    for (let id = end; id; id = via.get(id)) criticalPath.unshift(id);

    // Riskante Kanten: Nachfolger startet vor dem (spätesten) Ende des Vorgängers – inkl. Puffer
    const riskyDeps = new Set();
    for (const e of allEdges) {
      const from = byId.get(e.from);
      if (from.status === 'done') continue;
      const end = e.iteration !== null ? model.iterationEnd(from, e.iteration) : model.endOf(from) + from.bufferDays;
      if (byId.get(e.to).start < end) riskyDeps.add(`${e.from}→${e.to}`);
    }

    // Wichtigste Denk-Themen: viel Hebel × lange Dauer
    const importantThinking = open
      .filter((t) => t.kind === 'thinking')
      .map((t) => ({ id: t.id, score: (leverage.get(t.id) + 1) * model.durationOf(t) }))
      .sort((a, b) => b.score - a.score)
      .map((x) => x.id);

    const planEnd = open.reduce((max, t) => Math.max(max, model.endOf(t)), 0);

    /** 'done' | 'cycle' | 'in_progress' | 'ready' | 'waiting' */
    function stateOf(id) {
      const task = byId.get(id);
      if (!task) return null;
      if (task.status === 'done') return 'done';
      if (cycle.has(id)) return 'cycle';
      if (task.status === 'in_progress') return 'in_progress';
      return ready.has(id) ? 'ready' : 'waiting';
    }

    return {
      edges: allEdges, predecessors, successors,
      wave, waves, cycle, ready, leverage,
      criticalPath, criticalDays: end ? finish.get(end) : 0,
      isRisky: (from, to) => riskyDeps.has(`${from}→${to}`),
      importantThinking, planEnd,
      openPredecessors, stateOf,
    };
  }

  return { edges, predecessorMap, hasCycle, closure, analyze };
})();

  <script>
/* js/io/format.js */
/**
 * JSON-Dateiformat „prio-board“ (Version 3) – Export, Import, Validierung, Migration.
 * Beschreibung: schema/prio-board.schema.json und README.md.
 *
 *   {
 *     "format": "prio-board", "version": 3, "exportedAt": "…",
 *     "board": { "title": "…" }, "view": { "zoom": 1 },
 *     "themes": [ { "id", "title", "color": "#rrggbb" } ],
 *     "tasks": [ { "id", "kind": "thinking|implementation", "title", "description", "notes": [],
 *                  "status": "open|in_progress|done", "priority": 1-5, "start": "YYYY-MM-DD",
 *                  "durationDays", "bufferDays", "intensity": "focused|medium|background", "ongoing",
 *                  "iterations": [ { "title", "durationDays", "intensity", "done" } ], "theme": id|null } ],
 *     "dependencies": [ { "id", "from", "to", "fromIteration": null | index } ],
 *     "analysis": { … }   // nur Export, wird beim Import ignoriert
 *   }
 *
 * Ältere Stände werden schrittweise migriert: erste interne Speicherstände ({ blocks, deps }) → v1
 * (freies Board mit Gruppen) → v2 (Zeitachse, mehrere Themen je Aufgabe) → v3.
 */
PB.format = (() => {
  const C = PB.config;
  const U = PB.util;
  const CAL = PB.calendar;
  const KINDS = ['thinking', 'implementation'];
  const STATUSES = ['open', 'in_progress', 'done'];
  const INTENSITIES = ['focused', 'medium', 'background'];

  class FormatError extends Error {
    constructor(problems) {
      super(`Datei ungültig:\n• ${problems.slice(0, 8).join('\n• ')}${problems.length > 8 ? `\n• … (+${problems.length - 8})` : ''}`);
      this.name = 'FormatError';
      this.problems = problems;
    }
  }

  /* =====================================================================
   * Export
   * ===================================================================== */

  /**
   * Zustand → Dokument. Mit { model, analysis } wird zusätzlich ein berechneter
   * "analysis"-Block angehängt (für Auswertungen ausserhalb des Tools).
   */
  function serialize(state, { model, analysis, exportedAt = new Date().toISOString() } = {}) {
    const doc = {
      format: C.FORMAT.name,
      version: C.FORMAT.version,
      exportedAt,
      board: { title: state.board.title },
      view: { zoom: state.view.zoom },
      themes: state.themes.map((t) => ({ id: t.id, title: t.title, color: t.color })),
      tasks: state.tasks.map((t) => ({
        id: t.id,
        kind: t.kind,
        title: t.title,
        description: t.description,
        notes: [...t.notes],
        status: t.status,
        priority: t.priority,
        start: CAL.isoOf(t.start),
        durationDays: t.durationDays,
        bufferDays: t.bufferDays,
        intensity: t.intensity,
        ongoing: t.ongoing,
        iterations: t.iterations.map((it) => ({ title: it.title, durationDays: it.durationDays, intensity: it.intensity, done: it.done })),
        theme: t.theme,
      })),
      dependencies: state.dependencies.map((d) => ({ id: d.id, from: d.from, to: d.to, fromIteration: d.fromIteration })),
    };
    if (model && analysis) doc.analysis = buildAnalysis(state, model, analysis);
    return doc;
  }

  function buildAnalysis(state, model, a) {
    return {
      note: 'Beim Export berechnet – wird beim Import ignoriert.',
      planEnd: CAL.isoOf(a.planEnd),
      tasks: Object.fromEntries(state.tasks.map((t) => [t.id, {
        end: CAL.isoOf(model.endOf(t)),
        durationDays: model.durationOf(t),
        wave: a.wave.get(t.id) ?? null,
        state: a.stateOf(t.id),
        leverage: a.leverage.get(t.id),
        blockedBy: a.openPredecessors(t.id),
      }])),
      waves: a.waves,
      importantThinking: a.importantThinking,
      criticalPath: { tasks: a.criticalPath, durationDays: a.criticalDays },
    };
  }

  /* =====================================================================
   * Import
   * ===================================================================== */

  /**
   * String oder Objekt → normalisierter Zustand.
   * Standard (Import): streng – wirft FormatError mit allen Problemen.
   * { repair: true } (eigener gespeicherter Stand): repariert, was geht
   *   (ungültige Werte → Standardwerte, kaputte Pfeile entfernt, doppelte IDs umbenannt)
   *   und meldet jede Reparatur über onWarning(message).
   */
  function parse(input, { repair = false, onWarning = () => {} } = {}) {
    let raw = input;
    if (typeof input === 'string') {
      try {
        raw = JSON.parse(input);
      } catch (e) {
        throw new FormatError([`Kein gültiges JSON (${e.message})`]);
      }
    }
    if (isLegacy(raw)) raw = migrateLegacy(raw);
    if (raw?.format === C.FORMAT.name && raw.version === 1) raw = migrateV1(raw);
    if (raw?.format === C.FORMAT.name && raw.version === 2) raw = migrateV2(raw);
    return normalize(raw, { repair, onWarning });
  }

  function normalize(raw, { repair, onWarning }) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new FormatError(['Inhalt ist kein JSON-Objekt']);

    // Grundstruktur ist nie reparierbar
    const fatal = [];
    if (raw.format !== C.FORMAT.name) fatal.push(`"format" muss "${C.FORMAT.name}" sein`);
    if (raw.version !== C.FORMAT.version) fatal.push(`"version" ${JSON.stringify(raw.version)} wird nicht unterstützt (1–${C.FORMAT.version})`);
    for (const key of ['tasks', 'dependencies']) {
      if (!Array.isArray(raw[key])) fatal.push(`"${key}" muss eine Liste sein`);
    }
    if (raw.themes !== undefined && !Array.isArray(raw.themes)) fatal.push('"themes" muss eine Liste sein');
    if (fatal.length) throw new FormatError(fatal);

    // Alles Weitere: im Reparaturmodus Hinweis + Standardwert, sonst Fehler
    const problems = [];
    const report = (message) => (repair ? onWarning(message) : problems.push(message));
    const text = (v) => (typeof v === 'string' ? v : '');

    const ids = new Set();
    const readId = (id, where) => {
      if (typeof id !== 'string' || !id.trim()) {
        report(`${where}: "id" fehlt`);
        id = U.uid('n');
      } else if (ids.has(id)) {
        report(`${where}: doppelte id "${id}"`);
        id = U.uid('n');
      }
      ids.add(id);
      return id;
    };
    /** Ganze Zahl in [min, max]; fehlend → fallback, ungültig → Problem + fallback. */
    const readInt = (value, where, field, { min, max = Infinity, fallback }) => {
      if (value === undefined || value === null || value === '') return fallback;
      const n = Number(value);
      if (!Number.isFinite(n) || n < min || n > max) {
        report(`${where}: "${field}" muss eine Zahl zwischen ${min} und ${max === Infinity ? '∞' : max} sein`);
        return fallback;
      }
      return Math.round(n);
    };
    const readEnum = (value, allowed, where, field, fallback) => {
      if (value === undefined) return fallback;
      if (allowed.includes(value)) return value;
      report(`${where}: "${field}" muss ${allowed.map((a) => `"${a}"`).join(' oder ')} sein`);
      return fallback;
    };

    const themes = (raw.themes || []).map((th, i) => {
      const where = `themes[${i}]`;
      const color = /^#[0-9a-f]{6}$/i.test(th?.color) ? th.color : C.THEME_COLORS[i % C.THEME_COLORS.length];
      return { id: readId(th?.id, where), title: text(th?.title) || 'Thema', color };
    });
    const themeIds = new Set(themes.map((t) => t.id));

    const tasks = raw.tasks.map((t, i) => {
      const where = `tasks[${i}]`;
      const kind = readEnum(t?.kind, KINDS, where, 'kind', 'thinking');
      // Fehlt der Start, ist die Aufgabe ungeplant (null) – das Modell schlägt beim Laden einen vor.
      const start = t?.start === undefined || t?.start === null ? null : CAL.dayOf(t.start);
      if (start === null && t?.start !== undefined && t?.start !== null) {
        report(`${where}: "start" muss ein Datum im Format JJJJ-MM-TT sein`);
      }
      const intensity = readEnum(t?.intensity, INTENSITIES, where, 'intensity', 'focused');
      const iterations = kind === 'thinking' && Array.isArray(t?.iterations)
        ? t.iterations.map((it, j) => ({
          title: text(it?.title) || `Iteration ${j + 1}`,
          durationDays: readInt(it?.durationDays, `${where}.iterations[${j}]`, 'durationDays', { min: 1, fallback: 5 }),
          intensity: readEnum(it?.intensity, INTENSITIES, `${where}.iterations[${j}]`, 'intensity', intensity),
          done: it?.done === true,
        }))
        : [];
      let theme = t?.theme ?? null;
      if (theme !== null && !themeIds.has(theme)) {
        report(`${where}: unbekanntes Thema "${theme}"${repair ? ' – entfernt' : ''}`);
        theme = null;
      }
      return {
        id: readId(t?.id, where),
        kind,
        title: text(t?.title) || 'Ohne Titel',
        description: text(t?.description),
        notes: Array.isArray(t?.notes) ? t.notes.filter((n) => typeof n === 'string' && n.trim()) : [],
        status: readEnum(t?.status, STATUSES, where, 'status', 'open'),
        priority: readInt(t?.priority, where, 'priority', { min: 1, max: C.PRIORITY_LEVELS, fallback: 3 }),
        start,
        durationDays: readInt(t?.durationDays, where, 'durationDays', { min: 1, fallback: C.DEFAULT_DURATION[kind] }),
        bufferDays: readInt(t?.bufferDays, where, 'bufferDays', { min: 0, fallback: 0 }),
        intensity,
        ongoing: kind === 'thinking' && t?.ongoing === true,
        iterations,
        theme,
      };
    });
    const taskById = new Map(tasks.map((t) => [t.id, t]));

    const dependencies = [];
    const depIds = new Set();
    const pairs = new Set();
    raw.dependencies.forEach((d, i) => {
      const where = `dependencies[${i}]`;
      const broken = [];
      if (!ids.has(d?.from)) broken.push(`"from" verweist auf unbekannte id "${d?.from}"`);
      if (!ids.has(d?.to)) broken.push(`"to" verweist auf unbekannte id "${d?.to}"`);
      if (d?.from === d?.to) broken.push('"from" und "to" sind identisch');
      if (broken.length) {
        broken.forEach((b) => report(`${where}: ${b}${repair ? ' – entfernt' : ''}`));
        return;
      }
      const pair = `${d.from}→${d.to}`;
      if (pairs.has(pair)) return; // Duplikate still ignorieren
      pairs.add(pair);
      const id = typeof d.id === 'string' && d.id && !depIds.has(d.id) ? d.id : U.uid('d');
      depIds.add(id);
      const index = Number.isInteger(d.fromIteration) ? d.fromIteration : null;
      const fromIteration = index !== null && taskById.get(d.from)?.iterations[index] ? index : null;
      if (index !== null && fromIteration === null) report(`${where}: "fromIteration" ${index} existiert nicht`);
      dependencies.push({ id, from: d.from, to: d.to, fromIteration });
    });

    if (problems.length) throw new FormatError(problems);

    return {
      board: { title: text(raw.board?.title).trim() || 'Prio-Board' },
      view: { zoom: U.clamp(Number(raw.view?.zoom) || 1, C.ZOOM.min, C.ZOOM.max) },
      themes,
      tasks,
      dependencies,
    };
  }

  /* =====================================================================
   * Migration älterer Stände
   * ===================================================================== */

  const V1_ZONE_WIDTH = 480;

  /**
   * v2 → v3: höchstens ein Thema je Aufgabe (das erste bleibt).
   * Damit keine Abhängigkeit verloren geht, werden Abhängigkeiten der übrigen Themen
   * direkt auf die Aufgabe übertragen. Iterationen übernehmen die Intensität der Aufgabe.
   */
  function migrateV2(v2) {
    const tasks = Array.isArray(v2.tasks) ? v2.tasks : [];
    const dependencies = Array.isArray(v2.dependencies) ? [...v2.dependencies] : [];
    for (const task of tasks) {
      const themes = Array.isArray(task.themes) ? task.themes : [];
      for (const dropped of themes.slice(1)) {
        for (const d of v2.dependencies || []) {
          if (d.to === dropped && d.from !== task.id) dependencies.push({ from: d.from, to: task.id, fromIteration: d.fromIteration ?? null });
          if (d.from === dropped && d.to !== task.id) dependencies.push({ from: task.id, to: d.to, fromIteration: null });
        }
      }
    }
    return {
      ...v2,
      version: 3,
      tasks: tasks.map(({ themes, ...task }) => ({
        ...task,
        theme: Array.isArray(themes) && themes.length ? themes[0] : null,
        iterations: Array.isArray(task.iterations)
          ? task.iterations.map((it) => ({ intensity: task.intensity, ...it }))
          : task.iterations,
      })),
      dependencies,
    };
  }

  /**
   * v1 (freies Board) → v2 (Zeitplan):
   *  - Priorität aus der x-Spalte (480 px je Stufe, links = hoch)
   *  - Dauer aus effortDays (1 PT ≈ 1 Arbeitstag)
   *  - Gruppen → Themen (alle umschliessenden Gruppen, innerste zuerst; v2→v3 behält die innerste)
   *  - ohne Start: das Modell schlägt beim Laden einmalig Startdaten aus den Abhängigkeiten vor
   */
  function migrateV1(v1) {
    const groups = Array.isArray(v1.groups) ? v1.groups : [];
    const tasks = Array.isArray(v1.tasks) ? v1.tasks : [];
    const groupsAround = (layout) => {
      if (!layout) return [];
      const c = U.center(layout);
      return groups
        .filter((g) => g.layout && U.area(g.layout) > U.area(layout) && U.containsPoint(g.layout, c))
        .sort((a, b) => U.area(a.layout) - U.area(b.layout)) // innerste Gruppe zuerst
        .map((g) => g.id);
    };
    const priorityOf = (layout) => (layout
      ? U.clamp(Math.floor((layout.x + layout.width / 2) / V1_ZONE_WIDTH) + 1, 1, C.PRIORITY_LEVELS)
      : 3);
    return {
      format: C.FORMAT.name,
      version: 2,
      board: v1.board,
      view: { zoom: v1.view?.zoom ?? 1 },
      themes: groups.map((g, i) => ({ id: g.id, title: g.title, color: C.THEME_COLORS[i % C.THEME_COLORS.length] })),
      tasks: tasks.map((t) => ({
        id: t.id,
        kind: t.kind,
        title: t.title,
        description: t.description,
        notes: t.notes,
        status: t.status,
        priority: priorityOf(t.layout),
        durationDays: Math.max(1, Math.round(Number(t.effortDays) || C.DEFAULT_DURATION[t.kind] || 5)),
        bufferDays: 0,
        themes: groupsAround(t.layout),
      })),
      dependencies: Array.isArray(v1.dependencies) ? v1.dependencies.map((d) => ({ id: d.id, from: d.from, to: d.to })) : [],
    };
  }

  /** Interner Speicherstand der ersten Versionen: { blocks: [...], deps: [...] } */
  const isLegacy = (o) => o && !o.format && Array.isArray(o.blocks) && Array.isArray(o.deps);

  /** Erste Versionen → v1. mirror=true: Version mit „hohe Priorität rechts“ → horizontal spiegeln. */

/* js/io/storage.js */
/** Persistenz: Browser-Speicher (automatisch) und Dateien (Import/Export). */
PB.storage = (() => {
  const C = PB.config;
  const F = PB.format;

  function read(key) {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  }

  function write(key, value) {
    try {
      localStorage.setItem(key, value);
      return true;
    } catch {
      return false;
    }
  }

  /**
   * Letzten Stand laden; ältere Speicherstände werden migriert, kleine Schäden repariert.
   * Liefert { state, repairs[], migrated, fromVersion, backupKey } oder null, wenn nichts Brauchbares gespeichert ist.
   * Vor jeder Reparatur oder Migration wird das Original unter einem Sicherungs-Key abgelegt.
   */
  function loadLocal() {
    const candidates = [
      { key: C.STORAGE_KEY, convert: (o) => o },
      ...C.LEGACY_STORAGE.map((l) => ({ key: l.key, convert: (o) => F.migrateLegacy(o, { mirror: l.mirror }) })),
    ];
    for (const { key, convert } of candidates) {
      const text = read(key);
      if (!text) continue;
      try {
        const raw = JSON.parse(text);
        const fromVersion = key === C.STORAGE_KEY ? raw.version : 0; // 0 = erste interne Speicherstände
        const migrated = fromVersion !== C.FORMAT.version;
        const repairs = [];
        const state = F.parse(convert(raw), { repair: true, onWarning: (m) => repairs.push(m) });
        let backupKey = null;
        if (repairs.length || migrated) {
          backupKey = `${C.STORAGE_KEY}.backup-${new Date().toISOString()}`;
          write(backupKey, text);
        }
        return { state, repairs, migrated, fromVersion, backupKey };
      } catch (e) {
        console.warn(`Gespeicherter Stand ${key} nicht lesbar:`, e);
        write(`${key}.unreadable-${new Date().toISOString()}`, text);
      }
    }
    return null;
  }

  /** Liefert false, wenn der Browser-Speicher nicht verfügbar ist (z. B. Sandbox, privates Fenster). */
  function saveLocal(state) {
    return write(C.STORAGE_KEY, JSON.stringify(F.serialize(state)));
  }

  function download(content, filename, type) {
    const url = URL.createObjectURL(new Blob([content], { type }));
    const link = Object.assign(document.createElement('a'), { href: url, download: filename });
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  return { loadLocal, saveLocal, downloadText: download };
})();
</script>

/* js/render/layout.js */
/**
 * Geometrie der Zeitachse (reine Berechnung, kein DOM).
 *
 *   x = Arbeitstage ab heute, y = Prioritätsbänder (1 oben).
 *   Jedes Band besteht aus Abschnitten: je ein Abschnitt pro Thema (mit Rahmen) und
 *   ein Abschnitt für Aufgaben ohne Thema. Innerhalb eines Abschnitts werden Balken
 *   so auf Zeilen verteilt, dass sie sich nicht überlappen.
 */
PB.layout = (() => {
  const C = PB.config;
  const model = PB.model;

  const dayX = (day) => C.LABEL_WIDTH + day * C.DAY_WIDTH;
  const rowsHeight = (rows) => rows * C.BAR_HEIGHT + (rows - 1) * C.ROW_GAP;

  /** Verteilt Aufgaben (nach Start sortiert) auf Zeilen; liefert Boxen und Zeilenzahl. */
  function packRows(tasks, width) {
    const rowEnds = [];
    const boxes = tasks.map((task) => {
      const x = dayX(task.start);
      const w = model.durationOf(task) * C.DAY_WIDTH;
      const bufferWidth = task.bufferDays * C.DAY_WIDTH;
      const narrow = w < C.NARROW_BAR;
      const right = task.ongoing ? width : x + w + bufferWidth + (narrow ? C.LABEL_RESERVE : 0);
      let row = rowEnds.findIndex((end) => end + C.DAY_WIDTH / 2 <= x);
      if (row < 0) row = rowEnds.push(0) - 1;
      rowEnds[row] = right;
      return { id: task.id, x, w, bufferWidth, narrow, row, right };
    });
    return { boxes, rows: Math.max(1, rowEnds.length) };
  }

  /** Abschnitte eines Bandes: Themen (nach frühestem Start), danach Aufgaben ohne Thema. */
  function sectionsOf(tasks) {
    const byTheme = new Map();
    const loose = [];
    for (const task of tasks) {
      if (task.theme && model.getTheme(task.theme)) {
        if (!byTheme.has(task.theme)) byTheme.set(task.theme, []);
        byTheme.get(task.theme).push(task);
      } else {
        loose.push(task);
      }
    }
    const themed = [...byTheme.entries()]
      .map(([themeId, list]) => ({ themeId, tasks: list }))
      .sort((a, b) => a.tasks[0].start - b.tasks[0].start);
    return loose.length ? [...themed, { themeId: null, tasks: loose }] : themed;

   * Komplettes Layout:
   *   { width, height, horizon, bands[{ priority, y, height }],
   *     boxes Map<taskId, { x, y, w, bufferWidth, narrow }>, frames[{ themeId, x, y, width, height }] }
   */
  function compute() {
    const { tasks } = model.getState();
    const latest = tasks.reduce((max, t) => Math.max(max, model.endOf(t) + t.bufferDays), 0);
    const horizon = Math.ceil(Math.max(C.MIN_HORIZON_DAYS, latest + C.HORIZON_TAIL_DAYS) / 5) * 5;

    const frames = [];
    let y = C.HEADER_HEIGHT;

    for (let priority = 1; priority <= C.PRIORITY_LEVELS; priority++) {

        .filter((t) => t.priority === priority)
        .sort((a, b) => a.start - b.start || a.title.localeCompare(b.title, 'de'));
      const bandTop = y;
      let cursor = bandTop + C.BAND_PADDING;

      sectionsOf(bandTasks).forEach((section, i) => {
        if (i > 0) cursor += C.SECTION_GAP;

        const packed = packRows(section.tasks, width);
        const barsTop = cursor + (framed ? C.FRAME_HEADER : 0);
        for (const box of packed.boxes) {
          box.y = barsTop + box.row * (C.BAR_HEIGHT + C.ROW_GAP);
          boxes.set(box.id, box);
        }
        const height = (framed ? C.FRAME_HEADER + C.FRAME_PADDING : 0) + rowsHeight(packed.rows);
        if (framed) {
          const left = Math.max(C.LABEL_WIDTH + 2, Math.min(...packed.boxes.map((b) => b.x)) - C.FRAME_PADDING);
          const right = Math.min(width, Math.max(...packed.boxes.map((b) => b.right)) + C.FRAME_PADDING);
          frames.push({ themeId: section.themeId, x: left, y: cursor, width: right - left, height });
        }
        cursor += height;
      });

      const height = Math.max(cursor - bandTop + C.BAND_PADDING, rowsHeight(1) + 2 * C.BAND_PADDING);
      bands.push({ priority, y: bandTop, height });
      y = bandTop + height;
    }
    return { width, height: y, horizon, bands, boxes, frames };
  }

  /** Arbeitstag an einer x-Position (≥ 0). */
  const dayAt = (x) => Math.max(0, Math.floor((x - C.LABEL_WIDTH) / C.DAY_WIDTH));

  /** Prioritätsband an einer y-Position (oberhalb → 1, unterhalb → letztes). */
  function priorityAt(layout, y) {
    const band = layout.bands.find((b) => y < b.y + b.height);
    return band ? band.priority : C.PRIORITY_LEVELS;
  }

  return { compute, dayX, dayAt, priorityAt };
})();

  <script>
/* js/render/board.js */
/**
 * Darstellung der Zeitachse (Geometrie kommt aus PB.layout).

 */
PB.board = (() => {

  const A = PB.analysis;
  const L = PB.layout;

  const ui = PB.ui;
  const esc = U.escapeHtml;

  let dom = null;
  let analysis = null;
  let current = null; // letztes Layout (für Koordinaten-Umrechnung)

  /* =====================================================================
   * Markup (zustandslos)
   * ===================================================================== */

  function gridHtml(layout) {
    const weeks = CAL.weeks(layout.horizon);
    const columns = weeks.map((w, i) => {
      const x = L.dayX(w.day);
      const nextX = i + 1 < weeks.length ? L.dayX(weeks[i + 1].day) : layout.width;
      const label = i === 0 ? `Heute · KW ${w.week}` : `KW ${w.week}`;
      return `<div class="tl-week${i % 2 ? ' alt' : ''}${i === 0 ? ' today' : ''}" style="left:${x}px;width:${nextX - x}px;height:${layout.height}px">
        <div class="tl-week-label"><b>${label}</b>${CAL.shortDate(w.date)}</div></div>`;
    }).join('');
    const bands = layout.bands.map((b, i) => `<div class="tl-band${i % 2 ? ' alt' : ''}" data-priority="${b.priority}" style="top:${b.y}px;height:${b.height}px;width:${layout.width}px">
        <div class="tl-band-label"><b>Prio ${b.priority}</b><span>${C.PRIORITY_LABELS[b.priority - 1]}</span></div></div>`).join('');
    return `<div class="tl-days"></div>${columns}${bands}
      <div class="tl-corner"><b>Prio ↓</b><br>Zeit →</div><div class="tl-today"></div>`;
  }

  function framesHtml(layout, interactive) {
    return layout.frames.map((f) => {
      const theme = model.getTheme(f.themeId);
      const port = interactive
        ? '<div class="port theme-port" title="Ziehen: ganzes Thema → Aufgabe oder anderes Thema"></div>' : '';
      return `<div class="tl-frame" data-theme="${esc(theme.id)}" style="left:${f.x}px;top:${f.y}px;width:${f.width}px;height:${f.height}px;--c:${theme.color}">
        <span class="tl-frame-label"><i></i>${esc(theme.title)}</span>${port}</div>`;
    }).join('');
  }

  function statusBadge(task, a) {
    const state = a.stateOf(task.id);
    const text = {
      done: '✓ fertig',
      cycle: '⟳ Zyklus',
      in_progress: '● läuft',
      ready: '▶ startbar',
      waiting: `⏸ wartet auf ${a.openPredecessors(task.id).length}`,

    return `<span class="badge ${state}">${text}</span>`;
  }

  /** Iterationen als Phasen über die ganze Balkenhöhe, jede mit eigener Intensität. */
  function phasesHtml(task) {
    if (!task.iterations.length) return '';
    return `<div class="bar-phases">${task.iterations.map((it) => {
      const tip = `${it.title} · ${CAL.durationLabel(it.durationDays)} · ${C.INTENSITY_LABELS[it.intensity]}${it.done ? ' · erledigt' : ''}`;
      return `<div class="phase int-${it.intensity}${it.done ? ' done' : ''}" style="width:${it.durationDays * C.DAY_WIDTH}px" title="${esc(tip)}">
        <span>${esc(it.title)}${it.done ? ' ✓' : ''}</span></div>`;
    }).join('')}</div>`;
  }

  function barHtml(task, box, a, layout, interactive) {
    const duration = model.durationOf(task);
    const leverage = a.leverage.get(task.id);
    const classes = ['bar', task.kind, `st-${task.status}`,
      task.iterations.length ? 'has-iterations' : `int-${task.intensity}`,
      box.narrow && 'narrow', task.ongoing && 'ongoing'].filter(Boolean).join(' ');
    const style = `left:${box.x}px;top:${box.y}px;width:${box.w}px;height:${C.BAR_HEIGHT}px;--buf:${box.bufferWidth}px`;

    const durationText = CAL.durationLabel(duration) + (task.bufferDays ? ` (bis ${CAL.durationLabel(duration + task.bufferDays)})` : '');
    const meta = [
      statusBadge(task, a),
      `<span>${durationText}</span>`,
      leverage ? `<span class="lev" title="Gibt ${leverage} Umsetzung(en) frei">🔓 ${leverage}</span>` : '',
    ].join('');
    const buffer = task.bufferDays
      ? `<div class="bar-buffer" style="width:${box.bufferWidth}px" title="Puffer ${CAL.durationLabel(task.bufferDays)}"></div>`
      : '';
    const ongoing = task.ongoing
      ? `<div class="bar-ongoing" style="width:${Math.max(0, layout.width - box.x - box.w - box.bufferWidth)}px" title="Läuft danach weiter"><span>∞ laufend</span></div>`
      : '';
    const tooltip = [task.title, `${CAL.longDate(CAL.dateOf(task.start))} – ${CAL.longDate(CAL.dateOf(model.endOf(task)))}`,
      ...task.notes.map((n) => `• ${n}`), task.description].filter(Boolean).join('\n');

    return `<div class="${classes}" data-id="${esc(task.id)}" style="${style}" title="${esc(tooltip)}">
      ${buffer}${ongoing}${phasesHtml(task)}
      <div class="bar-body"><span class="tico">${I.forKind(task.kind)}</span>
        <div class="bar-text"><div class="title">${esc(task.title)}</div><div class="meta">${meta}</div></div></div>
      ${interactive ? handlesHtml(task, box) : ''}
    </div>`;
  }

  function handlesHtml(task, box) {
    let offset = 0;
    const iterationPorts = task.iterations.slice(0, -1).map((it, i) => {
      offset += it.durationDays * C.DAY_WIDTH;
      return `<div class="port it" data-iteration="${i}" style="left:${offset - 7}px" title="Ziehen: Abhängigkeit ab „${esc(it.title)}“"></div>`;
    }).join('');
    const bufferHandle = task.bufferDays
      ? `<div class="rs buf" style="left:calc(100% + ${box.bufferWidth}px - 5px)" title="Puffer ändern"></div>` : '';
    return `<div class="rs dur" title="Dauer ändern"></div>${bufferHandle}${iterationPorts}
      <div class="port end" title="Ziehen: Pfeil zu einer Aufgabe, die hiervon abhängt"></div>`;

  /** Waagrechte Kurve vom Ende des Vorgängers zum Anfang des Nachfolgers. */
  function linkPath(x1, y1, x2, y2) {
    const k = Math.max(30, Math.abs(x2 - x1) / 2);
    return `M${x1},${y1} C${x1 + k},${y1} ${x2 - k},${y2} ${x2 - 2},${y2}`;

  /**
   * Ankerpunkte für Pfeile zwischen Aufgaben (Ende → Anfang) und für den Pfeil beim Ziehen.

   */
  function sourcePoint(layout, id, iteration) {
    if (model.isTheme(id)) {
      const frames = layout.frames.filter((f) => f.themeId === id);
      if (!frames.length) return null;
      const f = frames.reduce((best, x) => (x.x + x.width > best.x + best.width ? x : best));
      return { x: f.x + f.width, y: f.y + C.FRAME_HEADER / 2 };
    }
    const box = layout.boxes.get(id);
    if (!box) return null;
    const x = L.dayX(model.iterationEnd(model.getTask(id), iteration));
    return { x, y: iteration !== null ? box.y + C.BAR_HEIGHT - 8 : box.y + C.BAR_HEIGHT / 2 };
  }

  function targetPoint(layout, id) {
    const box = layout.boxes.get(id);
    return box ? { x: box.x, y: box.y + C.BAR_HEIGHT / 2 } : null;
  }

  /* ---------- Pfeile mit Themen: Rechteck zu Rechteck ---------- */

  /** Rechtecke eines Knotens: alle Rahmen eines Themas bzw. der Balken einer Aufgabe. */
  function rectsOf(layout, id) {
    if (model.isTheme(id)) {
      return layout.frames.filter((f) => f.themeId === id).map((f) => ({ x: f.x, y: f.y, w: f.width, h: f.height, frame: true }));
    }
    const box = layout.boxes.get(id);
    return box ? [{ x: box.x, y: box.y, w: box.w, h: C.BAR_HEIGHT, frame: false }] : [];
  }

  /** x-Position auf einer Kante: Mitte der gemeinsamen Zeitspanne, bei Rahmen rechts neben dem Namen. */
  function edgeX(rect, overlapFrom, overlapTo) {
    const labelSpace = rect.frame ? 150 : 0;
    const min = rect.x + Math.min(labelSpace, rect.w / 2);
    const max = rect.x + rect.w - 16;
    const wanted = overlapTo > overlapFrom ? (overlapFrom + overlapTo) / 2 : rect.x + rect.w / 2;
    return Math.max(min, Math.min(max, wanted));
  }

  /**
   * Ankerpunkte zwischen zwei Rechtecken:
   *  - Ziel rechts daneben → waagrecht (rechter Rand → linker Rand)
   *  - Ziel darunter/darüber → senkrecht (Unter- → Oberkante bzw. umgekehrt)
   */
  function rectAnchors(src, dst) {
    const gapX = dst.x - (src.x + src.w);
    const below = dst.y - (src.y + src.h);
    const above = src.y - (dst.y + dst.h);
    if (gapX >= 24 || (below < 0 && above < 0)) {
      const top = Math.max(src.y, dst.y);
      const bottom = Math.min(src.y + src.h, dst.y + dst.h);
      const shared = bottom > top ? (top + bottom) / 2 : null;
      return {
        vertical: false,
        start: { x: src.x + src.w, y: shared ?? src.y + Math.min(src.h / 2, 30) },
        end: { x: dst.x, y: shared ?? dst.y + Math.min(dst.h / 2, 30) },
      };
    }
    const from = Math.max(src.x, dst.x);
    const to = Math.min(src.x + src.w, dst.x + dst.w);
    const down = below >= 0;
    return {
      vertical: true,
      start: { x: edgeX(src, from, to), y: down ? src.y + src.h : src.y },
      end: { x: edgeX(dst, from, to), y: down ? dst.y : dst.y + dst.h },

  /** Bestes (kürzestes) Ankerpaar über alle Rahmen der beteiligten Themen. */
  function themeLinkGeometry(layout, fromId, toId) {
    let best = null;
    for (const src of rectsOf(layout, fromId)) {
      for (const dst of rectsOf(layout, toId)) {
        const g = rectAnchors(src, dst);
        const length = Math.hypot(g.end.x - g.start.x, g.end.y - g.start.y);
        if (!best || length < best.length) best = { ...g, length };
      }
    }
    return best;
  }

  /** Kurve mit senkrechten Tangenten (für Pfeile über/unter Rahmen). */
  function verticalPath(x1, y1, x2, y2) {
    const k = Math.max(20, Math.abs(y2 - y1) / 2) * Math.sign(y2 - y1 || 1);
    return `M${x1},${y1} C${x1},${y1 + k} ${x2},${y2 - k} ${x2},${y2 - Math.sign(k) * 2}`;

   * Ein Pfeil pro Abhängigkeit – auch wenn Themen beteiligt sind (statt eines Pfeils je Aufgabe).

      let d;

        const g = themeLinkGeometry(layout, dep.from, dep.to);
        if (!g) return '';
        d = g.vertical ? verticalPath(g.start.x, g.start.y, g.end.x, g.end.y) : linkPath(g.start.x, g.start.y, g.end.x, g.end.y);
      } else {
        const start = sourcePoint(layout, dep.from, dep.fromIteration);
        const end = targetPoint(layout, dep.to);
        if (!start || !end) return '';
        d = linkPath(start.x, start.y, end.x, end.y);
      }
      const fromTasks = model.tasksOf(dep.from);
      const toTasks = model.tasksOf(dep.to);
      const done = fromTasks.length > 0 && fromTasks.every((id) => model.getTask(id).status === 'done');
      const bad = fromTasks.some((f) => a.cycle.has(f)) && toTasks.some((t) => a.cycle.has(t));
      const risky = a.edges.some((e) => e.depId === dep.id && a.isRisky(e.from, e.to));
      const classes = ['link', viaTheme && 'via-theme', done && 'done', bad && 'bad', risky && 'risky'].filter(Boolean).join(' ');
      return `<g class="${classes}" data-dep="${esc(dep.id)}" data-from="${esc(fromTasks.join(' '))}" data-to="${esc(toTasks.join(' '))}">
        <path class="hit" d="${d}"/><path class="vis" d="${d}"/></g>`;

  function render(a) {

  function applyView() {

    Object.assign(dom.world.style, { width: `${current.width}px`, height: `${current.height}px`, transform: `scale(${zoom})` });
    Object.assign(dom.sizer.style, { width: `${current.width * zoom}px`, height: `${current.height * zoom}px` });

  function showDraftLink(fromId, iteration, point) {

    const start = sourcePoint(current, fromId, iteration);

  }

  /** Thema, dessen Rahmen den Punkt enthält (für Abhängigkeiten auf ein Thema). */
