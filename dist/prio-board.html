<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prio-Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
/* css/theme.css */
/*
 * Prio-Board – Design-Tokens
 * Farben, Schrift und Radien zentral anpassen (z. B. an das CSS-Corporate-Design).
 */
:root{
  --navy:#0b2d55; --navy-2:#173f72; --navy-soft:#e9eff7;
  --accent:#009fe3;
  --bg:#f3f6fa; --panel:#ffffff; --ink:#0b2d55; --text:#24364f; --muted:#62738a; --line:#dbe3ee; --soft:#eef3f9;
  --thinking:#009fe3; --thinking-bg:#eaf7fd; --thinking-line:#9bd8f3;
  --impl:#1f9a6b; --impl-bg:#eaf7f1; --impl-line:#a6dcc6;
  --group:#8a9ab0;
  --ok:#1a7f4e; --ok-bg:#dcf3e7; --wait:#9a5b00; --wait-bg:#fff1d6; --bad:#c62828; --bad-bg:#fde4e4;
  --run:#0b5cad; --run-bg:#dcecfb;
  --link:#7f90a8; --link-done:#9ccfb6;
  --up:#f29200; --down:#0b5cad; --crit:#d6336c; --sel:#009fe3;
  --radius:14px;
  --shadow:0 1px 2px rgba(11,45,85,.06),0 4px 14px rgba(11,45,85,.06);
}
</style>
  <style>
/* css/app.css */
/* Prio-Board – Layout & Komponenten (nutzt die Tokens aus theme.css) */
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 "Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 360px;height:100vh;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
.ico{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Kopfzeile ---------- */
header{grid-column:1/-1;display:flex;gap:6px;align-items:center;padding:9px 16px;font-size:14px;background:var(--navy);color:#fff;flex-wrap:wrap}
header h1{font-size:17px;margin:0 8px 0 0;white-space:nowrap;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
#boardTitle{outline:none;border-radius:6px;padding:1px 6px;margin-left:-6px;cursor:text;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#boardTitle:hover{background:rgba(255,255,255,.1)}
#boardTitle:focus{background:rgba(255,255,255,.16);text-overflow:clip}
header h1 .mark{width:10px;height:22px;border-radius:3px;background:var(--accent)}
.sep{width:1px;height:24px;background:rgba(255,255,255,.2);margin:0 2px}
.btn{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn.on{background:#fff;color:var(--navy);border-color:#fff}
.btn.primary{background:#fff;color:var(--navy);border-color:#fff}
.btn.primary:hover{background:var(--navy-soft)}
.btn.primary .ib{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:13px}
.btn.thinking .ib{background:var(--thinking)}
.btn.impl .ib{background:var(--impl)}
.btn.grp .ib{background:var(--group)}
.btn:disabled{opacity:.35;cursor:default}
.btn.icon{padding:4px 9px}
#zoomLabel{min-width:40px;text-align:center;opacity:.8;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:#fff;padding:4px 10px;cursor:pointer;font-weight:600}
.seg button.on{background:#fff;color:var(--navy)}
.lbl{opacity:.75;font-size:13px;margin-left:4px}
.spacer{flex:1}
.menu{position:relative}
.menu-panel{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:3000;min-width:270px;background:#fff;color:var(--text);
  border-radius:12px;box-shadow:0 10px 30px rgba(11,45,85,.22);padding:6px}
.menu.open .menu-panel{display:block}
.menu-panel button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink)}
.menu-panel button:hover{background:var(--soft)}
.menu-panel button small{display:block;color:var(--muted);font-size:12.5px}
.menu-panel button.danger b{color:var(--bad)}
.menu-panel hr{border:0;border-top:1px solid var(--line);margin:6px 4px}

/* panel buttons (light surface) */
aside .btn{color:var(--navy);border-color:var(--line);background:#fff}
aside .btn:hover{background:var(--soft);border-color:var(--navy)}
aside .btn.danger{color:var(--bad);border-color:#f2c4c4}

/* ---------- Arbeitsfläche (Diagramm-Stile: js/render/diagram-styles.js) ---------- */
#canvas{position:relative;overflow:auto;cursor:grab}
#canvas.panning{cursor:grabbing}
#sizer{position:relative}
#world .block{user-select:none;cursor:move;transition:opacity .15s,box-shadow .15s}
#world .block.selected{outline:3px solid var(--sel);outline-offset:3px}
.port{position:absolute;right:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#fff;
  border:2.5px solid var(--navy);cursor:crosshair;opacity:0;z-index:5;transition:opacity .12s}
.group>.port{top:24px}
.block:hover>.port,.linking .port{opacity:1}
.port:hover{background:var(--accent);border-color:var(--accent)}
.rs{position:absolute;right:3px;bottom:3px;width:14px;height:14px;cursor:nwse-resize;z-index:5;opacity:.35;
  background:linear-gradient(135deg,transparent 0 55%,var(--navy) 55% 62%,transparent 62% 75%,var(--navy) 75% 82%,transparent 82%)}
.block:hover>.rs{opacity:.8}
.linking .block.task:hover,.linking .block.group:hover{outline:3px dashed var(--sel);outline-offset:3px}

/* Hervorhebungen (#world-Präfix, damit sie die Diagramm-Stile überschreiben) */
#world .block.dim{opacity:.2}
#world .block.hl{box-shadow:0 0 0 4px rgba(11,45,85,.3),var(--shadow)}
#world .block.up{box-shadow:0 0 0 4px var(--up)}
#world .block.down{box-shadow:0 0 0 4px var(--down)}
#world .block.crit{box-shadow:0 0 0 4px var(--crit)}
#world .block.ready-hl{box-shadow:0 0 0 4px var(--ok)}


/* ---------- Pfeile (interaktiv) ---------- */
#links .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
#links .link.up .vis{stroke:var(--up);stroke-width:3.2;marker-end:url(#m-up)}
#links .link.down .vis{stroke:var(--down);stroke-width:3.2;marker-end:url(#m-down)}
#links .link.crit .vis{stroke:var(--crit);stroke-width:3.2;marker-end:url(#m-crit)}
#links .link.sel .vis{stroke:var(--sel);stroke-width:3.6;marker-end:url(#m-sel)}
#links .link.dim .vis{opacity:.15}
#links .link:hover .vis{stroke-width:3.6}
#links .draft{fill:none;stroke:var(--sel);stroke-width:2.5;stroke-dasharray:6 5;marker-end:url(#m-sel)}

/* ---------- Seitenleiste ---------- */
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;padding:0 10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:13px 8px 11px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--navy);border-bottom-color:var(--accent)}
#sideBody{overflow:auto;padding:18px;flex:1}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:5px}
.field input,.field select,.field textarea,select.adddep{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus,select.adddep:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,159,227,.15)}
.field input:disabled{background:var(--soft);color:var(--muted)}
.field textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:10px}
.row>.field{flex:1}
.hint{font-size:13px;color:var(--muted)}
h3{font-size:12px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.8px;color:var(--navy)}
h3:first-child{margin-top:0}
ul.help{padding-left:18px;margin:0 0 10px}
ul.help li{margin-bottom:4px}
ul.list{list-style:none;margin:0 0 8px;padding:0}
ul.list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer}
ul.list li:hover{background:var(--soft)}
ul.list li .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
ul.list li .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
ul.list li .x:hover{color:var(--bad)}
.dot{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:12px}
.dot.thinking{background:var(--thinking)}
.dot.implementation{background:var(--impl)}
.dot.group{border:2px dashed var(--group)}
.small{font-size:12px;color:var(--muted);white-space:nowrap}
.wavebox{border:1.5px solid var(--line);border-radius:var(--radius);padding:10px 8px 4px;margin-bottom:12px}
.wavebox .wh{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;color:var(--navy);margin:0 6px 4px}
.wavebox.now{border-color:var(--ok);background:#f5fbf8}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;color:var(--navy)}
.stat span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.stat.thinking b{color:var(--thinking)} .stat.impl b{color:var(--impl)}
.warn{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px;margin-bottom:12px;font-size:14px}
.legend{display:grid;gap:8px;font-size:13.5px}
.legend div{display:flex;gap:10px;align-items:center}
.sw{width:32px;height:20px;border-radius:6px;flex:none}
.sw.g{border:2px dashed var(--group)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
  padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:9999;font-size:14px;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr 42vh}
  aside{border-left:0;border-top:1px solid var(--line)}
}
@media print{
  header,aside{display:none}
  body{display:block;height:auto}
  #canvas{overflow:visible}
}

/* ---------- Dialoge (js/ui/dialog.js) ---------- */
.pb-dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(11,45,85,.3);color:var(--text)}
.pb-dialog::backdrop{background:rgba(11,45,85,.45)}
.pb-dialog-body{padding:22px 24px 18px}
.pb-dialog h2{margin:0 0 10px;font-size:19px;color:var(--ink)}
.pb-dialog-text p{margin:0 0 6px}
.pb-dialog-hint{margin:0 0 10px;color:var(--muted);font-size:14px}
.pb-dialog-hint.small{font-size:13px;margin-top:8px}
.pb-dialog-code{width:100%;height:180px;border:1.5px solid var(--line);border-radius:10px;padding:10px;resize:vertical;
  font:12.5px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--text);background:var(--soft)}
.pb-dialog-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px;flex-wrap:wrap}
.pb-dialog-status{flex:1;font-size:13px;color:var(--ok)}
.pb-dialog .btn{color:var(--navy);border-color:var(--line);background:#fff}
.pb-dialog .btn:hover{background:var(--soft);border-color:var(--navy)}
.pb-dialog .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.pb-dialog .btn.primary:hover{background:var(--navy-2)}
.pb-dialog .btn.primary.danger{background:var(--bad);border-color:var(--bad)}
.pb-file{margin-bottom:12px}
header .btn.warn{background:#fff1d6;color:#7a4700;border-color:#fff1d6;line-height:1.2;height:30px}

/* Schmalere Fenster (z. B. eingebettete Vorschau): Kopfzeile kompakter, damit sie einzeilig bleibt */
@media (max-width:1500px){
  header{gap:4px;padding:8px 12px}
  header .btn{padding:4px 9px}
  .seg button{padding:4px 8px}
  #boardTitle{max-width:150px}
  #saveWarning .long{display:none}
}
@media (max-width:1250px){
  #addThinking,#addImplementation,#addGroup{font-size:0;gap:0;padding:4px}
  #addThinking .ib,#addImplementation .ib,#addGroup .ib{font-size:13px}
  #fit,#zoomLabel,.sep{display:none}
}
</style>
</head>
<body>
  <header>
    <h1><span class="mark"></span><span id="boardTitle" contenteditable="plaintext-only" spellcheck="false" title="Titel bearbeiten">Prio-Board</span></h1>

    <button class="btn primary thinking" id="addThinking" title="Analyse/Konzept – braucht Denkzeit"><span class="ib" data-icon="brain"></span>Denken</button>
    <button class="btn primary impl" id="addImplementation" title="Direkt umsetzbar"><span class="ib" data-icon="wrench"></span>Umsetzung</button>
    <button class="btn primary grp" id="addGroup" title="Rahmen für zusammengehörige Themen (Abhängigkeitsblock)"><span class="ib" data-icon="group"></span>Gruppe</button>
    <span class="sep"></span>

    <button class="btn icon" id="undo" title="Rückgängig (Strg+Z)">↶</button>
    <button class="btn icon" id="redo" title="Wiederholen (Strg+Y)">↷</button>
    <span class="sep"></span>

    <button class="btn icon" id="zoomOut" title="Verkleinern">−</button>
    <span id="zoomLabel">100%</span>
    <button class="btn icon" id="zoomIn" title="Vergrössern">+</button>
    <button class="btn" id="fit">Einpassen</button>
    <span class="sep"></span>

    <div class="seg" id="focusMode" title="Fokus: hebt Blöcke auf dem Board hervor">
      <button data-focus="none" class="on">Aus</button>
      <button data-focus="ready">Jetzt startbar</button>
      <button data-focus="critical">Kritischer Pfad</button>
    </div>
    <button class="btn on" id="priorityAxis" title="Prioritätsachse ein/aus">Prio-Achse</button>

    <span class="spacer"></span>
    <button class="btn warn" id="saveWarning" hidden title="Wird nicht im Browser gespeichert – Details">⚠<span class="long"> Nicht gespeichert</span></button>
    <div class="menu" id="fileMenu">
      <button class="btn" id="fileMenuButton" aria-haspopup="true" aria-expanded="false">Datei ▾</button>
      <div class="menu-panel" role="menu">
        <button role="menuitem" id="exportHtml"><b>Als HTML</b><small>Statische Seite nur mit dem Diagramm</small></button>
        <button role="menuitem" id="exportJson"><b>Export (JSON)</b><small>Board als Datei speichern</small></button>
        <button role="menuitem" id="importJson"><b>Import</b><small>JSON oder exportierte HTML-Seite laden</small></button>
        <hr>
        <button role="menuitem" id="loadExample"><b>Beispiel laden</b></button>
        <button role="menuitem" id="clearBoard" class="danger"><b>Board leeren</b></button>
      </div>
    </div>
  </header>

  <div id="canvas">
    <div id="sizer">
      <div id="world" class="pb-world">
        <div id="zones" class="pb-zones"></div>
        <svg id="links" class="pb-links" xmlns="http://www.w3.org/2000/svg">
          <defs></defs>
          <g id="linkLayer"></g>
          <path id="draftLink" class="draft" d="" style="display:none"/>
        </svg>
      </div>
    </div>
  </div>

  <aside>
    <nav class="tabs" id="sideTabs">
      <button data-tab="details">Details</button>
      <button data-tab="plan">Ablauf</button>
      <button data-tab="help">Hilfe</button>
    </nav>
    <div id="sideBody"></div>
  </aside>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Reihenfolge = Abhängigkeiten der Module -->
  <script>
/* js/core/config.js */
/**
 * Prio-Board – zentrale Konfiguration.
 * Alle Module hängen am globalen Namensraum `PB` (klassische Skripte,
 * damit das Tool auch per Doppelklick über file:// funktioniert).
 */
window.PB = window.PB || {};

PB.config = Object.freeze({
  /** Rasterweite in Pixeln; Positionen und Grössen rasten darauf ein. */
  GRID: 20,

  /** Breite einer Prioritätsspalte. Spalte 1 (links) = höchste Priorität. */
  ZONE_WIDTH: 480,
  PRIORITY_LEVELS: 5,
  PRIORITY_LABELS: ['sehr hoch', 'hoch', 'mittel', 'tief', 'sehr tief'],

  KIND_LABELS: { thinking: 'Denken', implementation: 'Umsetzung' },
  KIND_SUBTITLES: { thinking: 'Denken · Analyse', implementation: 'Umsetzung' },
  STATUS_LABELS: { open: 'Offen', in_progress: 'Läuft', done: 'Fertig' },

  DEFAULT_TITLES: { thinking: 'Neues Denk-Thema', implementation: 'Neue Umsetzung', group: 'Neue Gruppe' },
  DEFAULT_SIZE: {
    thinking: { width: 340, height: 150 },
    implementation: { width: 240, height: 130 },
    group: { width: 560, height: 340 },
  },
  DEFAULT_EFFORT: { thinking: 3, implementation: 1 },
  MIN_SIZE: {
    task: { width: 120, height: 80 },
    group: { width: 200, height: 120 },
  },

  /** fitMin: „Einpassen“ zoomt nie kleiner, damit Text lesbar bleibt (Rest per Scrollen). */
  ZOOM: { min: 0.25, max: 2, step: 1.2, fitMin: 0.7 },
  HISTORY_LIMIT: 100,

  /** Dateiformat für Import/Export (siehe schema/prio-board.schema.json). */
  FORMAT: { name: 'prio-board', version: 1 },

  STORAGE_KEY: 'prioBoard.document',
  /** Ältere Speicherstände: v1 hatte „hohe Prio rechts“ und wird gespiegelt. */
  LEGACY_STORAGE: [
    { key: 'prioBoard.v2', mirror: false },
    { key: 'prioBoard.v1', mirror: true },
  ],
});
</script>
  <script>
/* js/core/util.js */
/** Kleine, zustandslose Hilfsfunktionen. */
PB.util = (() => {
  const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const NUMBER = new Intl.NumberFormat('de-CH', { maximumFractionDigits: 1 });

  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ESCAPES[c]);
  const uid = (prefix) => `${prefix}-${Math.random().toString(36).slice(2, 9)}`;
  const snap = (value) => Math.round(value / PB.config.GRID) * PB.config.GRID;
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const formatNumber = (n) => NUMBER.format(n);

  /** Geometrie auf Layout-Objekten { x, y, width, height }. */
  const center = (l) => ({ x: l.x + l.width / 2, y: l.y + l.height / 2 });
  const area = (l) => l.width * l.height;
  const containsPoint = (l, p) => p.x > l.x && p.x < l.x + l.width && p.y > l.y && p.y < l.y + l.height;

  /** Bounding-Box über mehrere Layouts. */
  function bounds(layouts) {
    if (!layouts.length) return null;
    const box = { x: Infinity, y: Infinity, right: -Infinity, bottom: -Infinity };
    for (const l of layouts) {
      box.x = Math.min(box.x, l.x);
      box.y = Math.min(box.y, l.y);
      box.right = Math.max(box.right, l.x + l.width);
      box.bottom = Math.max(box.bottom, l.y + l.height);
    }
    return { x: box.x, y: box.y, width: box.right - box.x, height: box.bottom - box.y };
  }

  /** "2,5" → 2.5; leer/ungültig → null */
  function parseNumber(value) {
    if (value === null || value === undefined || value === '') return null;
    const n = Number(String(value).trim().replace(',', '.'));
    return Number.isFinite(n) ? n : null;
  }

  function slugify(text) {
    return String(text || 'prio-board')
      .toLowerCase()
      .normalize('NFKD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'prio-board';
  }

  const today = () => new Date().toISOString().slice(0, 10);

  return { escapeHtml, uid, snap, clamp, formatNumber, center, area, containsPoint, bounds, parseNumber, slugify, today };
})();
</script>
  <script>
/* js/core/icons.js */
/** SVG-Icons (Pfade nach Lucide, ISC-Lizenz). */
PB.icons = (() => {
  const PATHS = {
    brain:
      '<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>' +
      '<path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>' +
      '<path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/>' +
      '<path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/>' +
      '<path d="M19.938 10.5a4 4 0 0 1 .585.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/>' +

  <script>
/* js/domain/model.js */
/**
 * Datenmodell des Boards: Zustand, Abfragen, Änderungen und Undo/Redo.
 *
 * Zustand (identisch mit dem Datenteil des JSON-Formats):
 *   { board: { title }, view: { zoom, showPriorityAxis },
 *     groups: [{ id, title, description, layout }],
 *     tasks:  [{ id, kind, title, description, notes[], status, effortDays, layout }],
 *     dependencies: [{ id, from, to }] }      // from muss vor to fertig sein
 *
 * Gruppenzugehörigkeit wird NICHT gespeichert, sondern aus der Geometrie
 * abgeleitet: ein Element gehört zur kleinsten (grösseren) Gruppe, die seinen
 * Mittelpunkt enthält.
 *
 * Änderungen melden sich über subscribe(fn) mit einem meta-Objekt { type, source }.
 */
PB.model = (() => {
  const C = PB.config;
  const U = PB.util;

  let state = createEmptyState();
  let parents = new Map();
  const past = [];
  const future = [];
  const listeners = new Set();

  function createEmptyState(title = 'Prio-Board', view = { zoom: 1, showPriorityAxis: true }) {
    return { board: { title }, view: { ...view }, groups: [], tasks: [], dependencies: [] };
  }

  /* ---------- Ereignisse ---------- */

  function subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  }
  function emit(meta) {
    listeners.forEach((fn) => fn(meta));
  }

  /* ---------- Abfragen ---------- */

  const getState = () => state;
  const allNodes = () => [...state.groups, ...state.tasks];
  const getNode = (id) => state.tasks.find((n) => n.id === id) || state.groups.find((n) => n.id === id) || null;
  const isGroup = (id) => state.groups.some((g) => g.id === id);
  const getDependency = (id) => state.dependencies.find((d) => d.id === id) || null;

  const parentOf = (id) => parents.get(id) ?? null;
  const childrenOf = (id) => allNodes().filter((n) => parents.get(n.id) === id);

  function descendantsOf(id) {
    const result = [];
    const walk = (parentId) => childrenOf(parentId).forEach((child) => {
      result.push(child.id);
      walk(child.id);
    });
    walk(id);
    return result;
  }

  function ancestorsOf(id) {
    const result = [];
    for (let p = parentOf(id); p && !result.includes(p); p = parentOf(p)) result.push(p);
    return result;
  }

  /** Alle Aufgaben-IDs, die ein Knoten repräsentiert (Aufgabe selbst oder Inhalt einer Gruppe). */
  function tasksWithin(id) {
    if (!isGroup(id)) return getNode(id) ? [id] : [];
    return descendantsOf(id).filter((d) => !isGroup(d));
  }

  const areNested = (a, b) => ancestorsOf(a).includes(b) || ancestorsOf(b).includes(a);

  /* ---------- Hierarchie ---------- */

  function rebuildHierarchy() {
    parents = new Map();
    for (const node of allNodes()) {
      const c = U.center(node.layout);
      const ownArea = U.area(node.layout);
      let best = null;
      let bestArea = Infinity;
      for (const group of state.groups) {
        if (group.id === node.id) continue;
        const a = U.area(group.layout);
        if (a > ownArea && a < bestArea && U.containsPoint(group.layout, c)) {
          best = group.id;
          bestArea = a;
        }
      }
      if (best) parents.set(node.id, best);
    }
  }

  /* ---------- Historie ---------- */

  function checkpoint() {
    past.push(JSON.stringify(state));
    if (past.length > C.HISTORY_LIMIT) past.shift();
    future.length = 0;
  }
  function restore(from, to) {
    if (!from.length) return;
    to.push(JSON.stringify(state));
    state = JSON.parse(from.pop());
    rebuildHierarchy();
    emit({ type: 'history' });
  }
  const undo = () => restore(past, future);
  const redo = () => restore(future, past);
  const canUndo = () => past.length > 0;
  const canRedo = () => future.length > 0;

  /* ---------- Ganzes Board ---------- */

  /** Lädt einen Zustand ohne Historieneintrag (Programmstart). */
  function load(next) {
    state = next;
    rebuildHierarchy();
    emit({ type: 'load' });
  }
  /** Ersetzt den Zustand mit Historieneintrag (Import, Beispiel, Leeren). */
  function replace(next) {
    checkpoint();
    load(next);
  }
  const clear = () => replace(createEmptyState(state.board.title, state.view));

  function setBoardTitle(title) {
    const clean = String(title).trim() || 'Prio-Board';
    if (clean === state.board.title) return;
    checkpoint();
    state.board.title = clean;
    emit({ type: 'board' });
  }

  /** Ansichtseinstellungen (Zoom, Achse) – ohne Historie und ohne Ereignis. */
  function setView(patch) {
    Object.assign(state.view, patch);
  }

  /* ---------- Knoten ---------- */

  /** Nächster freier Platz (keine Überlappung mit Aufgaben) möglichst nahe an position. */
  function placeAt(position, size) {
    const STEP = C.GRID * 2;
    const MAX_RADIUS = 30;
    const origin = {
      x: Math.max(0, U.snap(position.x - size.width / 2)),
      y: Math.max(0, U.snap(position.y - size.height / 2)),
    };
    const margin = C.GRID;
    const overlaps = (l) => state.tasks.some((t) =>
      l.x < t.layout.x + t.layout.width + margin && l.x + l.width + margin > t.layout.x &&
      l.y < t.layout.y + t.layout.height + margin && l.y + l.height + margin > t.layout.y);

    for (let r = 0; r <= MAX_RADIUS; r++) {
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue; // nur der Ring mit Abstand r
          const candidate = { x: origin.x + dx * STEP, y: origin.y + dy * STEP, ...size };
          if (candidate.x >= 0 && candidate.y >= 0 && !overlaps(candidate)) return candidate;
        }
      }
    }
    return { ...origin, ...size };
  }

  function addTask(kind, position) {
    const task = {
      id: U.uid('t'),
      kind,
      title: C.DEFAULT_TITLES[kind],
      description: '',
      notes: [],
      status: 'open',
      effortDays: C.DEFAULT_EFFORT[kind],
      layout: placeAt(position, C.DEFAULT_SIZE[kind]),
    };
    checkpoint();
    state.tasks.push(task);
    rebuildHierarchy();
    emit({ type: 'add', id: task.id });
    return task.id;
  }

  function addGroup(position) {
    const group = {
      id: U.uid('g'),
      title: C.DEFAULT_TITLES.group,
      description: '',
      layout: placeAt(position, C.DEFAULT_SIZE.group),
    };
    checkpoint();
    state.groups.push(group);
    rebuildHierarchy();
    emit({ type: 'add', id: group.id });
    return group.id;
  }

  /**
   * Ändert Felder eines Knotens.
   * options.record=false: kein Historieneintrag (z. B. beim Tippen, siehe checkpoint()).
   * options.source: wird im Ereignis weitergegeben (z. B. 'sidebar').
   */
  function updateNode(id, patch, { record = true, source } = {}) {
    const node = getNode(id);
    if (!node) return;
    if (record) checkpoint();
    Object.assign(node, patch);
    emit({ type: 'update', id, source });
  }

  function removeNode(id) {
    if (!getNode(id)) return;
    checkpoint();
    state.tasks = state.tasks.filter((t) => t.id !== id);
    state.groups = state.groups.filter((g) => g.id !== id);
    state.dependencies = state.dependencies.filter((d) => d.from !== id && d.to !== id);
    rebuildHierarchy();
    emit({ type: 'remove', id });
  }

  function duplicateTask(id) {
    const task = state.tasks.find((t) => t.id === id);
    if (!task) return null;
    const copy = {
      ...JSON.parse(JSON.stringify(task)),
      id: U.uid('t'),
      title: `${task.title} (Kopie)`,
      status: 'open',
    };
    copy.layout.x += C.GRID * 2;
    copy.layout.y += C.GRID * 2;
    checkpoint();
    state.tasks.push(copy);
    rebuildHierarchy();
    emit({ type: 'add', id: copy.id });
    return copy.id;
  }

  /* ---------- Abhängigkeiten ---------- */

  /** Prüft, ob from → to erlaubt ist. Liefert null oder einen Fehlertext. */
  function validateDependency(from, to) {
    if (!getNode(from) || !getNode(to) || from === to) return 'Ungültige Abhängigkeit';
    if (areNested(from, to)) return 'Eine Gruppe und ihr eigenes Element können nicht voneinander abhängen';
    if (state.dependencies.some((d) => d.from === from && d.to === to)) return 'Diese Abhängigkeit existiert bereits';
    const candidate = [...state.dependencies, { from, to }];
    if (PB.analysis.hasCycle(PB.analysis.predecessorMap(api, candidate))) {
      return 'Nicht möglich – das würde einen Kreis (Zyklus) erzeugen';
    }
    return null;
  }

  /** Legt from → to an. Liefert { ok, error? }. */
  function addDependency(from, to) {
    const error = validateDependency(from, to);
    if (error) return { ok: false, error };
    checkpoint();
    state.dependencies.push({ id: U.uid('d'), from, to });
    emit({ type: 'dependency' });
    return { ok: true };
  }

  function removeDependency(id) {
    if (!getDependency(id)) return;
    checkpoint();
    state.dependencies = state.dependencies.filter((d) => d.id !== id);
    emit({ type: 'dependency' });
  }

  function reverseDependency(id) {
    const dep = getDependency(id);
    if (!dep) return { ok: false, error: 'Abhängigkeit nicht gefunden' };
    const others = state.dependencies.filter((d) => d.id !== id);
    const reversed = [...others, { from: dep.to, to: dep.from }];
    if (PB.analysis.hasCycle(PB.analysis.predecessorMap(api, reversed))) {
      return { ok: false, error: 'Umkehren würde einen Zyklus erzeugen' };
    }
    checkpoint();
    [dep.from, dep.to] = [dep.to, dep.from];
    emit({ type: 'dependency' });
    return { ok: true };
  }

  /* ---------- Gesten (Verschieben / Grösse ändern) ---------- */
  // Während einer Geste wird das Layout direkt geändert (ohne Ereignis),
  // damit nur Positionen aktualisiert werden müssen. endGesture() meldet die Änderung.

  const beginGesture = () => checkpoint();
  function setLayout(id, patch) {
    const node = getNode(id);
    if (node) Object.assign(node.layout, patch);
  }
  function endGesture() {
    rebuildHierarchy();
    emit({ type: 'layout' });
  }

  const api = {
    subscribe,
    // Abfragen
    getState, allNodes, getNode, isGroup, getDependency,
    parentOf, childrenOf, descendantsOf, ancestorsOf, tasksWithin, areNested,
    // Historie
    checkpoint, undo, redo, canUndo, canRedo,
    // Board
    createEmptyState, load, replace, clear, setBoardTitle, setView,
    // Knoten
    addTask, addGroup, updateNode, removeNode, duplicateTask,
    // Abhängigkeiten
    validateDependency, addDependency, removeDependency, reverseDependency,
    // Gesten
    beginGesture, setLayout, endGesture,
  };
  return api;
})();
</script>
  <script>
/* js/domain/analysis.js */
/**
 * Abhängigkeitsanalyse (reine Funktionen über dem Modell).
 *
 * Effektive Vorgänger einer Aufgabe T:
 *   - alle Abhängigkeiten, die direkt auf T zeigen,
 *   - plus alle, die auf eine Gruppe zeigen, in der T liegt.
 *   Zeigt eine Abhängigkeit VON einer Gruppe weg, zählen alle Aufgaben darin.
 */
PB.analysis = (() => {
  const C = PB.config;
  const U = PB.util;

  /** Priorität aus der horizontalen Position: 1 (links, hoch) … PRIORITY_LEVELS (rechts, tief). */
  function priorityOf(layout) {
    const cx = layout.x + layout.width / 2;
    return U.clamp(Math.floor(cx / C.ZONE_WIDTH) + 1, 1, C.PRIORITY_LEVELS);
  }
  const priorityLabel = (p) => C.PRIORITY_LABELS[p - 1];

  /** Aufwand in Personentagen; fehlende Angaben zählen als 1. */
  function effortOf(task) {
    const n = Number(task.effortDays);
    return Number.isFinite(n) && n > 0 ? n : 1;
  }

  /** Map<taskId, Set<taskId>> der effektiven Vorgänger. */
  function predecessorMap(model, dependencies = model.getState().dependencies) {
    const preds = new Map();
    const tasks = model.getState().tasks;
    tasks.forEach((t) => preds.set(t.id, new Set()));
    for (const task of tasks) {
      for (const scope of [task.id, ...model.ancestorsOf(task.id)]) {
        for (const dep of dependencies) {
          if (dep.to !== scope) continue;
          for (const p of model.tasksWithin(dep.from)) if (p !== task.id) preds.get(task.id).add(p);
        }
      }
    }
    return preds;
  }

  function hasCycle(preds) {
    const VISITING = 1;
    const DONE = 2;
    const mark = new Map();
    const visit = (node) => {
      mark.set(node, VISITING);
      for (const p of preds.get(node) || []) {
        if (mark.get(p) === VISITING) return true;
        if (!mark.has(p) && visit(p)) return true;
      }
      mark.set(node, DONE);
      return false;
    };
    for (const node of preds.keys()) if (!mark.has(node) && visit(node)) return true;
    return false;
  }

  /** Transitive Hülle ausgehend von start über map (Vorgänger oder Nachfolger). */
  function closure(start, map) {
    const result = new Set();
    const stack = [...start];
    while (stack.length) {
      for (const next of map.get(stack.pop()) || []) {
        if (!result.has(next)) {
          result.add(next);
          stack.push(next);
        }
      }
    }
    return result;
  }

  /**
   * Vollständige Auswertung des Boards.
   * Wellen: offene Aufgaben in topologischen Stufen – innerhalb einer Welle
   * bestehen keine Abhängigkeiten, sie können parallel bearbeitet werden.
   */
  function analyze(model) {
    const tasks = model.getState().tasks;
    const byId = new Map(tasks.map((t) => [t.id, t]));
    const isDone = (id) => byId.get(id)?.status === 'done';

    const predecessors = predecessorMap(model);
    const successors = new Map(tasks.map((t) => [t.id, new Set()]));
    predecessors.forEach((preds, id) => preds.forEach((p) => successors.get(p).add(id)));

    // Kahn-Algorithmus über offene Aufgaben
    const open = tasks.filter((t) => !isDone(t.id));
    const remaining = new Map(open.map((t) => [t.id, [...predecessors.get(t.id)].filter((p) => !isDone(p)).length]));
    const wave = new Map();
    const order = open.filter((t) => remaining.get(t.id) === 0).map((t) => t.id);
    order.forEach((id) => wave.set(id, 1));
    for (let i = 0; i < order.length; i++) {
      const id = order[i];
      for (const next of successors.get(id)) {
        if (!remaining.has(next)) continue;
        wave.set(next, Math.max(wave.get(next) || 1, wave.get(id) + 1));
        remaining.set(next, remaining.get(next) - 1);
        if (remaining.get(next) === 0) order.push(next);
      }
    }
    const inOrder = new Set(order);
    const cycle = new Set(open.filter((t) => !inOrder.has(t.id)).map((t) => t.id));
    cycle.forEach((id) => wave.delete(id));

    const openPredecessors = (id) => [...(predecessors.get(id) || [])].filter((p) => !isDone(p));
    const ready = new Set(open.filter((t) => !cycle.has(t.id) && openPredecessors(t.id).length === 0).map((t) => t.id));

    // Wellen als sortierte Listen (Priorität, dann Umsetzung vor Denken)
    const priority = new Map(tasks.map((t) => [t.id, priorityOf(t.layout)]));
    const waves = [];
    wave.forEach((n, id) => (waves[n - 1] ||= []).push(id));
    waves.forEach((list) => list.sort((a, b) =>
      priority.get(a) - priority.get(b) ||
      (byId.get(a).kind === 'implementation' ? -1 : 1) - (byId.get(b).kind === 'implementation' ? -1 : 1)));

    // Kritischer Pfad: längste Kette nach Aufwand über offene Aufgaben
    const finish = new Map();
    const via = new Map();
    for (const id of order) {
      let best = 0;
      let bestPred = null;
      for (const p of predecessors.get(id)) {
        if (finish.has(p) && finish.get(p) > best) {
          best = finish.get(p);
          bestPred = p;
        }
      }
      finish.set(id, best + effortOf(byId.get(id)));
      via.set(id, bestPred);
    }
    let end = null;
    finish.forEach((f, id) => { if (end === null || f > finish.get(end)) end = id; });
    const criticalPath = [];
    for (let id = end; id; id = via.get(id)) criticalPath.unshift(id);

    /** 'done' | 'cycle' | 'in_progress' | 'ready' | 'waiting' */
    function stateOf(id) {
      const task = byId.get(id);
      if (!task) return null;
      if (task.status === 'done') return 'done';
      if (cycle.has(id)) return 'cycle';
      if (task.status === 'in_progress') return 'in_progress';
      return ready.has(id) ? 'ready' : 'waiting';
    }

    return {
      predecessors, successors,
      wave, waves, cycle, ready,
      criticalPath, criticalEffort: end ? finish.get(end) : 0,
      openPredecessors, stateOf,
      priorityOf: (id) => priority.get(id) ?? priorityOf(model.getNode(id).layout),
    };
  }

  return { priorityOf, priorityLabel, effortOf, predecessorMap, hasCycle, closure, analyze };
})();
</script>
  <script>
/* js/io/format.js */
/**
 * JSON-Dateiformat „prio-board“ (Version 1) – Export, Import, Validierung, Migration.
 * Beschreibung: schema/prio-board.schema.json und README.md.
 *
 *   {
 *     "format": "prio-board", "version": 1, "exportedAt": "…",
 *     "board": { "title": "…" },
 *     "view": { "zoom": 1, "showPriorityAxis": true },
 *     "groups": [ { "id", "title", "description", "layout": { "x", "y", "width", "height" } } ],
 *     "tasks": [ { "id", "kind": "thinking|implementation", "title", "description",
 *                  "notes": ["…"], "status": "open|in_progress|done", "effortDays": 3, "layout": {…} } ],
 *     "dependencies": [ { "id", "from", "to" } ],      // from muss vor to fertig sein
 *     "analysis": { … }                                 // nur Export, wird beim Import ignoriert
 *   }
 */
PB.format = (() => {
  const C = PB.config;
  const U = PB.util;
  const KINDS = ['thinking', 'implementation'];
  const STATUSES = ['open', 'in_progress', 'done'];

  class FormatError extends Error {
    constructor(problems) {
      super(`Datei ungültig:\n• ${problems.slice(0, 8).join('\n• ')}${problems.length > 8 ? `\n• … (+${problems.length - 8})` : ''}`);
      this.name = 'FormatError';
      this.problems = problems;
    }
  }

  /* ---------- Export ---------- */

  const layoutOut = (l) => ({ x: l.x, y: l.y, width: l.width, height: l.height });

  /**
   * Zustand → Dokument. Mit { model, analysis } wird zusätzlich ein
   * berechneter "analysis"-Block angehängt (für Auswertungen ausserhalb des Tools).
   */
  function serialize(state, { model, analysis, exportedAt = new Date().toISOString() } = {}) {
    const doc = {
      format: C.FORMAT.name,
      version: C.FORMAT.version,
      exportedAt,
      board: { title: state.board.title },
      view: { zoom: state.view.zoom, showPriorityAxis: state.view.showPriorityAxis },
      groups: state.groups.map((g) => ({
        id: g.id,
        title: g.title,
        description: g.description,
        layout: layoutOut(g.layout),
      })),
      tasks: state.tasks.map((t) => ({
        id: t.id,
        kind: t.kind,
        title: t.title,
        description: t.description,
        notes: [...t.notes],
        status: t.status,
        effortDays: t.effortDays ?? null,
        layout: layoutOut(t.layout),
      })),
      dependencies: state.dependencies.map((d) => ({ id: d.id, from: d.from, to: d.to })),
    };
    if (model && analysis) doc.analysis = buildAnalysis(state, model, analysis);
    return doc;
  }

  function buildAnalysis(state, model, a) {
    return {
      note: 'Beim Export berechnet – wird beim Import ignoriert.',
      tasks: Object.fromEntries(state.tasks.map((t) => [t.id, {
        priority: a.priorityOf(t.id),
        group: model.parentOf(t.id),
        wave: a.wave.get(t.id) ?? null,
        state: a.stateOf(t.id),
        blockedBy: a.openPredecessors(t.id),
      }])),
      waves: a.waves,
      criticalPath: { tasks: a.criticalPath, effortDays: a.criticalEffort },
    };
  }

  /* ---------- Import ---------- */

  /**
   * String oder Objekt → normalisierter Zustand.
   * Standard (Import): streng – wirft FormatError mit allen Problemen.
   * { repair: true } (eigener gespeicherter Stand): repariert stattdessen, was geht
   *   (ungültige Werte → Standardwerte, kaputte Pfeile entfernt, doppelte IDs umbenannt)
   *   und meldet jede Reparatur über onWarning(message).
   */
  function parse(input, { repair = false, onWarning = () => {} } = {}) {
    let raw = input;
    if (typeof input === 'string') {
      try {
        raw = JSON.parse(input);
      } catch (e) {
        throw new FormatError([`Kein gültiges JSON (${e.message})`]);
      }
    }
    if (isLegacy(raw)) raw = migrateLegacy(raw);
    return normalize(raw, { repair, onWarning });
  }

  function normalize(raw, { repair, onWarning }) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new FormatError(['Inhalt ist kein JSON-Objekt']);

    // Grundstruktur ist nie reparierbar
    const fatal = [];
    if (raw.format !== C.FORMAT.name) fatal.push(`"format" muss "${C.FORMAT.name}" sein`);
    if (!Number.isInteger(raw.version) || raw.version < 1 || raw.version > C.FORMAT.version) {
      fatal.push(`"version" ${JSON.stringify(raw.version)} wird nicht unterstützt (1–${C.FORMAT.version})`);
    }
    for (const key of ['groups', 'tasks', 'dependencies']) {
      if (!Array.isArray(raw[key])) fatal.push(`"${key}" muss eine Liste sein`);
    }
    if (fatal.length) throw new FormatError(fatal);

    // Alles Weitere: im Reparaturmodus Hinweis + Standardwert, sonst Fehler
    const problems = [];
    const report = (message) => (repair ? onWarning(message) : problems.push(message));
    const text = (v) => (typeof v === 'string' ? v : '');

    const nodeIds = new Set();
    const readId = (id, where) => {
      if (typeof id !== 'string' || !id.trim()) {
        report(`${where}: "id" fehlt`);
        id = U.uid('n');
      } else if (nodeIds.has(id)) {
        report(`${where}: doppelte id "${id}"`);
        id = U.uid('n');
      }
      nodeIds.add(id);
      return id;
    };
    const DEFAULT_LAYOUT = { x: 0, y: 0, width: 240, height: 130 };
    const readLayout = (l, where) => {
      const out = {};
      for (const k of ['x', 'y', 'width', 'height']) {
        let v = Number(l?.[k]);
        const invalid = !Number.isFinite(v) || ((k === 'width' || k === 'height') && v <= 0);
        if (invalid) {
          report(`${where}: "layout.${k}" fehlt oder ist ungültig`);
          v = DEFAULT_LAYOUT[k];
        }
        out[k] = v;
      }
      return out;
    };

    const groups = raw.groups.map((g, i) => {
      const where = `groups[${i}]`;
      return {
        id: readId(g?.id, where),
        title: text(g?.title) || 'Gruppe',
        description: text(g?.description),
        layout: readLayout(g?.layout, where),
      };
    });

    const tasks = raw.tasks.map((t, i) => {
      const where = `tasks[${i}]`;
      let kind = t?.kind;
      if (!KINDS.includes(kind)) {
        report(`${where}: "kind" muss "thinking" oder "implementation" sein`);
        kind = 'thinking';
      }
      let status = t?.status ?? 'open';
      if (!STATUSES.includes(status)) {
        report(`${where}: unbekannter "status" "${status}"`);
        status = 'open';
      }
      let effort = t?.effortDays === null || t?.effortDays === undefined || t?.effortDays === '' ? null : Number(t.effortDays);
      if (effort !== null && !(effort >= 0)) {
        report(`${where}: "effortDays" muss eine Zahl ≥ 0 oder null sein`);
        effort = null;
      }
      return {
        id: readId(t?.id, where),
        kind,
        title: text(t?.title) || 'Ohne Titel',
        description: text(t?.description),
        notes: Array.isArray(t?.notes) ? t.notes.filter((n) => typeof n === 'string' && n.trim()) : [],
        status,
        effortDays: effort,
        layout: readLayout(t?.layout, where),
      };
    });

    const dependencies = [];
    const depIds = new Set();
    const pairs = new Set();
    raw.dependencies.forEach((d, i) => {
      const where = `dependencies[${i}]`;
      const broken = [];
      if (!nodeIds.has(d?.from)) broken.push(`"from" verweist auf unbekannte id "${d?.from}"`);
      if (!nodeIds.has(d?.to)) broken.push(`"to" verweist auf unbekannte id "${d?.to}"`);
      if (d?.from === d?.to) broken.push('"from" und "to" sind identisch');
      if (broken.length) {
        broken.forEach((b) => report(`${where}: ${b}${repair ? ' – entfernt' : ''}`));
        return;
      }
      const pair = `${d.from}→${d.to}`;
      if (pairs.has(pair)) return; // Duplikate still ignorieren
      pairs.add(pair);
      const id = typeof d.id === 'string' && d.id && !depIds.has(d.id) ? d.id : U.uid('d');
      depIds.add(id);
      dependencies.push({ id, from: d.from, to: d.to });
    });

    if (problems.length) throw new FormatError(problems);

    return {
      board: { title: text(raw.board?.title).trim() || 'Prio-Board' },
      view: {
        zoom: U.clamp(Number(raw.view?.zoom) || 1, C.ZOOM.min, C.ZOOM.max),
        showPriorityAxis: raw.view?.showPriorityAxis !== false,
      },
      groups,
      tasks,
      dependencies,
    };
  }

  /* ---------- Migration älterer Stände ---------- */

  /** Interner Speicherstand der ersten Versionen: { blocks: [...], deps: [...] } */
  const isLegacy = (o) => o && !o.format && Array.isArray(o.blocks) && Array.isArray(o.deps);

  /** mirror=true: Version mit „hohe Priorität rechts“ → horizontal spiegeln. */
  function migrateLegacy(old, { mirror = false } = {}) {
    const KIND = { denken: 'thinking', umsetzung: 'implementation' };
    const STATUS = { offen: 'open', laeuft: 'in_progress', fertig: 'done' };
    const axisWidth = C.ZONE_WIDTH * C.PRIORITY_LEVELS;
    const layoutOf = (b) => ({
      x: mirror ? Math.max(0, axisWidth - b.x - b.w) : b.x,
      y: b.y,
      width: b.w,
      height: b.h,
    });
    const isGroupBlock = (b) => b.type === 'gruppe';
    return {
      format: C.FORMAT.name,
      version: C.FORMAT.version,
      board: { title: 'Prio-Board' },
      view: { zoom: old.view?.scale ?? 1, showPriorityAxis: old.view?.prio !== false },
      groups: old.blocks.filter(isGroupBlock).map((b) => ({
        id: b.id, title: b.title, description: b.desc || '', layout: layoutOf(b),
      })),
      tasks: old.blocks.filter((b) => !isGroupBlock(b)).map((b) => ({
        id: b.id,
        kind: KIND[b.type] || 'thinking',
        title: b.title,
        description: b.desc || '',
        notes: String(b.notes || '').split('\n').map((s) => s.trim()).filter(Boolean),
        status: STATUS[b.status] || 'open',
        effortDays: U.parseNumber(b.aufwand),
        layout: layoutOf(b),
      })),
      dependencies: old.deps.map((d) => ({ id: d.id, from: d.from, to: d.to })),
    };
  }

  return { serialize, parse, migrateLegacy, FormatError };
})();
</script>

/* js/io/storage.js */
/** Persistenz: Browser-Speicher (automatisch) und Dateien (Import/Export). */
PB.storage = (() => {
  const C = PB.config;
  const F = PB.format;

  function read(key) {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  }

  function write(key, value) {
    try {
      localStorage.setItem(key, value);
      return true;
    } catch {
      return false;
    }
  }

  /**
   * Letzten Stand laden; ältere Speicherstände werden migriert, kleine Schäden repariert.
   * Liefert { state, repairs[], backupKey } oder null, wenn nichts Brauchbares gespeichert ist.
   * Vor jeder Reparatur wird das Original unter einem Sicherungs-Key abgelegt.
   */
  function loadLocal() {
    const candidates = [
      { key: C.STORAGE_KEY, convert: (o) => o },
      ...C.LEGACY_STORAGE.map((l) => ({ key: l.key, convert: (o) => F.migrateLegacy(o, { mirror: l.mirror }) })),
    ];
    for (const { key, convert } of candidates) {
      const text = read(key);
      if (!text) continue;
      try {
        const repairs = [];
        const state = F.parse(convert(JSON.parse(text)), { repair: true, onWarning: (m) => repairs.push(m) });
        let backupKey = null;
        if (repairs.length) {
          backupKey = `${C.STORAGE_KEY}.backup-${new Date().toISOString()}`;
          write(backupKey, text);
        }
        return { state, repairs, backupKey };
      } catch (e) {
        console.warn(`Gespeicherter Stand ${key} nicht lesbar:`, e);
        write(`${key}.unreadable-${new Date().toISOString()}`, text);
      }
    }
    return null;
  }

  /** Liefert false, wenn der Browser-Speicher nicht verfügbar ist (z. B. Sandbox, privates Fenster). */
  function saveLocal(state) {
    return write(C.STORAGE_KEY, JSON.stringify(F.serialize(state)));
  }

  function download(content, filename, type) {
    const url = URL.createObjectURL(new Blob([content], { type }));
    const link = Object.assign(document.createElement('a'), { href: url, download: filename });
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  return { loadLocal, saveLocal, downloadText: download };
})();
</script>

/* js/render/diagram-styles.js */
/**
 * Darstellung des Diagramms (Blöcke, Gruppen, Pfeile, Prioritätsachse).
 *
 * Bewusst als JS-Modul statt .css-Datei: Dieselben Regeln werden
 *   1) beim Start in die App eingefügt und
 *   2) in die exportierte statische HTML-Seite geschrieben.
 * Browser verbieten unter file:// das Auslesen von Stylesheets, daher eine gemeinsame Quelle hier.
 * Farben kommen als CSS-Variablen aus css/theme.css.
 */
PB.diagramStyles = (() => {
  /** Tokens aus theme.css, die das Diagramm benötigt (werden beim Export mitkopiert). */
  const TOKENS = [
    '--navy', '--accent', '--bg', '--ink', '--text', '--muted', '--line',
    '--thinking', '--thinking-bg', '--thinking-line', '--impl', '--impl-bg', '--impl-line', '--group',
    '--ok', '--ok-bg', '--wait', '--wait-bg', '--bad', '--bad-bg', '--run', '--run-bg',
    '--link', '--link-done', '--up', '--down', '--crit', '--sel', '--radius', '--shadow',
  ];

  /** Pfeilspitzen je Zustand → Token. */
  const MARKERS = {
    def: '--link', done: '--link-done', bad: '--bad', up: '--up', down: '--down', crit: '--crit', sel: '--sel',
  };

  const CSS = `
.pb-world{position:absolute;left:0;top:0;transform-origin:0 0;background-color:var(--bg);
  background-image:radial-gradient(circle,#c9d4e2 1.1px,transparent 1.3px);background-size:20px 20px}
.pb-world .ico{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Prioritätsachse */
.pb-zones{position:absolute;left:0;top:0;height:100%;display:flex;pointer-events:none}
.pb-zones .z{height:100%;border-right:1px solid #e1e8f1;position:relative}
.pb-zones .z span{position:absolute;top:12px;left:14px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.pb-zones .axis{position:absolute;top:50px;left:14px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;font-weight:600}
.pb-zones .axis i{display:block;height:3px;width:220px;border-radius:3px;background:linear-gradient(90deg,var(--navy),#c9d4e2)}
.pb-zones.off{display:none}

/* Blöcke */
.block{position:absolute;border-radius:var(--radius)}
.block.task{z-index:1000;background:#fff;box-shadow:var(--shadow);border:1.5px solid var(--line)}
.block.task::before{content:"";position:absolute;left:-1.5px;top:-1.5px;bottom:-1.5px;width:6px;border-radius:var(--radius) 0 0 var(--radius)}
.block.task.thinking{background:var(--thinking-bg);border-color:var(--thinking-line)}
.block.task.thinking::before{background:var(--thinking)}
.block.task.implementation{background:var(--impl-bg);border-color:var(--impl-line)}
.block.task.implementation::before{background:var(--impl)}
.block.group{border:2px dashed var(--group);background:rgba(255,255,255,.55)}
.block.st-done{opacity:.55}
.block.st-done .title{text-decoration:line-through}
.inner{position:absolute;inset:0;padding:12px 14px 30px 14px;overflow:hidden;border-radius:calc(var(--radius) - 2px)}
.thead{display:flex;align-items:center;gap:10px;margin-bottom:4px;padding-right:34px}
.tico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;font-size:20px}
.thinking .tico{background:var(--thinking);box-shadow:0 0 0 4px rgba(0,159,227,.18)}
.implementation .tico{background:var(--impl);box-shadow:0 0 0 4px rgba(31,154,107,.16)}
.tkind{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.thinking .tkind{color:var(--thinking)}
.implementation .tkind{color:var(--impl)}
.title{font-weight:700;font-size:16px;color:var(--ink);line-height:1.25;word-break:break-word}
.notes{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--text)}
.notes li::marker{color:var(--muted)}
.desc{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.foot{position:absolute;left:14px;right:10px;bottom:7px;display:flex;gap:6px;align-items:center;font-size:12px;white-space:nowrap;overflow:hidden}
.badge{padding:1px 8px;border-radius:999px;font-weight:700}
.badge.ready{background:var(--ok-bg);color:var(--ok)}
.badge.waiting{background:var(--wait-bg);color:var(--wait)}
.badge.cycle{background:var(--bad-bg);color:var(--bad)}
.badge.in_progress{background:var(--run-bg);color:var(--run)}
.badge.done{background:#e3e8ef;color:#4e5d70}
.meta{color:var(--muted)}
.wave{position:absolute;top:10px;right:10px;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy);border-radius:999px;padding:1px 8px}

/* Gruppen */
.ghead{position:absolute;left:14px;top:-15px;display:flex;gap:8px;align-items:center;background:var(--navy);color:#fff;
  border-radius:999px;padding:3px 12px;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;box-shadow:var(--shadow)}
.gtitle{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.gmeta{font-size:12px;opacity:.75}
.gdesc{position:absolute;left:16px;bottom:8px;right:16px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Pfeile */
.pb-links{position:absolute;left:0;top:0;z-index:500;pointer-events:none;overflow:visible}
.pb-links .vis{fill:none;stroke:var(--link);stroke-width:2.2;marker-end:url(#m-def)}
.pb-links .link.done .vis{stroke:var(--link-done);stroke-dasharray:5 4;marker-end:url(#m-done)}
.pb-links .link.bad .vis{stroke:var(--bad);marker-end:url(#m-bad)}
`;

  /** <defs> mit den Pfeilspitzen für ein SVG. */
  function markerDefs() {
    return Object.entries(MARKERS).map(([name, token]) =>
      `<marker id="m-${name}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">` +
      `<path d="M0,0 L10,5 L0,10 z" style="fill:var(${token})"/></marker>`).join('');
  }

  /** Aktuelle Werte der Tokens als :root-Regel (für den Export). */
  function themeVariables() {
    const computed = getComputedStyle(document.documentElement);
    const lines = TOKENS.map((t) => `  ${t}:${computed.getPropertyValue(t).trim()};`);
    return `:root{\n${lines.join('\n')}\n}`;
  }

  function inject() {
    const style = document.createElement('style');
    style.id = 'pb-diagram-styles';
    style.textContent = CSS;
    document.head.appendChild(style);
  }

  return { CSS, inject, markerDefs, themeVariables };
})();

/* js/render/board.js */
/**
 * Darstellung des Boards.
 *  - markup(): reines HTML/SVG des Diagramms – wird auch vom statischen Export genutzt.
 *  - render() & Co.: Live-Board mit Zoom, Auswahl, Hervorhebungen.
 */
PB.board = (() => {
  const C = PB.config;
  const U = PB.util;
  const I = PB.icons;
  const A = PB.analysis;
  const model = PB.model;
  const ui = PB.ui;

  let dom = null;
  let analysis = null;

  /* =====================================================================
   * Markup (zustandslos)
   * ===================================================================== */

  function zonesHtml() {
    const zones = C.PRIORITY_LABELS.map((label, i) =>
      `<div class="z" style="width:${C.ZONE_WIDTH}px"><span>Prio ${i + 1} · ${label}</span></div>`).join('');

  }

  function statusBadge(task, a) {
    const state = a.stateOf(task.id);
    const text = {
      done: '✓ fertig',
      cycle: '⟳ Zyklus',
      in_progress: '● läuft',
      ready: '▶ startbar',
      waiting: `⏸ wartet auf ${a.openPredecessors(task.id).length}`,
    }[state];
    return `<span class="badge ${state}">${text}</span>`;
  }

    const effort = task.effortDays != null ? `<span class="meta">${U.formatNumber(task.effortDays)} PT</span>` : '';

      ${wave ? `<span class="wave" title="Welle ${wave}">W${wave}</span>` : ''}
      <div class="thead">
        <span class="tico">${I.forKind(task.kind)}</span>
        <div><div class="tkind">${C.KIND_SUBTITLES[task.kind]}</div><div class="title">${esc(task.title || 'Ohne Titel')}</div></div>
      </div>
      ${notes}
      ${task.description ? `<div class="desc">${esc(task.description)}</div>` : ''}
      <div class="foot">${statusBadge(task, a)}${effort}${priority}</div>

  }

  function groupHtml(group, a) {
    const esc = U.escapeHtml;
    const tasks = model.tasksWithin(group.id);
    const done = tasks.filter((id) => a.stateOf(id) === 'done').length;
    const ready = tasks.filter((id) => a.ready.has(id)).length;
    return `<div class="ghead"><span class="gtitle">${esc(group.title || 'Gruppe')}</span>

      ${group.description ? `<div class="gdesc">${esc(group.description)}</div>` : ''}`;

  const HANDLES = '<div class="port" title="Ziehen: Pfeil zu einem Block, der hiervon abhängt"></div>' +

  function nodeHtml(node, a, { interactive, showPriority, zIndex }) {
    const isGroup = model.isGroup(node.id);
    const classes = isGroup ? 'block group' : `block task ${node.kind} st-${node.status}`;
    const { x, y, width, height } = node.layout;
    const style = `left:${x}px;top:${y}px;width:${width}px;height:${height}px${zIndex ? `;z-index:${zIndex}` : ''}`;
    const body = isGroup ? groupHtml(node, a) : taskHtml(node, a, showPriority);
    return `<div class="${classes}" data-id="${U.escapeHtml(node.id)}" style="${style}">${body}${interactive ? HANDLES : ''}</div>`;
