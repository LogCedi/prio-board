    const frame = current.frames.find((f) => point.x >= f.x && point.x <= f.x + f.width && point.y >= f.y && point.y <= f.y + f.height);
    return frame ? frame.themeId : null;
  }

  /** Rahmen als Ziel beim Ziehen eines Pfeils markieren (null = keiner). */
  function markDropTheme(themeId) {
    dom.world.querySelectorAll('.tl-frame').forEach((el) => el.classList.toggle('drop', el.dataset.theme === themeId));
  }

  function hideDraftLink() {
    const draft = dom.world.querySelector('#draftLink');
    if (draft) draft.style.display = 'none';
  }

  /**
   * Vorschau beim Verschieben: Balken folgen der Maus per CSS-Transform (ohne neu zu zeichnen),
   * Ziel-Band wird markiert, ein Etikett zeigt Priorität und Start.
   */
  function showMovePreview(ids, dx, dy, { priority, start, point }) { // ids[0] = gegriffener Balken
    const moving = new Set(ids);
    dom.world.classList.add('moving');
    dom.world.querySelectorAll('.bar').forEach((el) => {
      const active = moving.has(el.dataset.id);
      el.classList.toggle('drag-preview', active);
      el.style.transform = active ? `translate(${dx}px, ${dy}px)` : '';
    });
    dom.world.querySelectorAll('.tl-band').forEach((el) => el.classList.toggle('drop', Number(el.dataset.priority) === priority));
    let hint = dom.world.querySelector('.drag-hint');
    if (!hint) {
      hint = document.createElement('div');
      hint.className = 'drag-hint';
      dom.world.appendChild(hint);
    }
    const date = CAL.dateOf(start);
    hint.textContent = `Prio ${priority} · ab ${CAL.shortDate(date)} (KW ${CAL.weekNumber(date)})`;
    // Über dem gegriffenen Balken (lead = erster in ids), damit der Titel sichtbar bleibt
    const lead = dom.world.querySelector(`.bar[data-id="${CSS.escape(ids[0])}"]`);
    const x = lead ? parseFloat(lead.style.left) + dx : point.x;
    const y = lead ? parseFloat(lead.style.top) + dy - 34 : point.y - 34;
    Object.assign(hint.style, { left: `${x}px`, top: `${y}px` });
  }

  function hideMovePreview() {
    dom.world.classList.remove('moving');
    dom.world.querySelectorAll('.bar.drag-preview').forEach((el) => {
      el.classList.remove('drag-preview');
      el.style.transform = '';
    });
    dom.world.querySelectorAll('.tl-band.drop').forEach((el) => el.classList.remove('drop'));
    dom.world.querySelector('.drag-hint')?.remove();
  }

  /** Auswahlrechteck (Weltkoordinaten); null blendet es aus. Liefert die getroffenen Aufgaben. */
  function showLasso(rect) {
    const lasso = dom.world.querySelector('#lasso');
    if (!lasso) return [];
    lasso.hidden = !rect;
    if (!rect) return [];
    Object.assign(lasso.style, { left: `${rect.x}px`, top: `${rect.y}px`, width: `${rect.width}px`, height: `${rect.height}px` });
    const hits = [];
    current.boxes.forEach((box, id) => {
      const right = box.x + box.w;
      const bottom = box.y + C.BAR_HEIGHT;
      if (box.x < rect.x + rect.width && right > rect.x && box.y < rect.y + rect.height && bottom > rect.y) hits.push(id);
    });
    return hits;
  }

  function applySelection() {
    const { type, ids } = ui.selection;
    const selected = new Set(ids);
    dom.world.querySelectorAll('.bar').forEach((el) =>
      el.classList.toggle('selected', type === 'task' && selected.has(el.dataset.id)));
    dom.world.querySelectorAll('.tl-frame').forEach((el) =>
      el.classList.toggle('selected', type === 'theme' && selected.has(el.dataset.theme)));
    dom.world.querySelectorAll('.link').forEach((el) =>
      el.classList.toggle('sel', type === 'dependency' && selected.has(el.dataset.dep)));
  }

  /** Hover (vorher nötig / blockiert) hat Vorrang vor dem Fokusmodus. */
  function applyHighlight() {
    const CLASSES = ['dim', 'hl', 'up', 'down', 'crit', 'ready-hl'];
    const bars = [...dom.world.querySelectorAll('.bar')];
    const links = [...dom.world.querySelectorAll('.link')];
    bars.forEach((el) => el.classList.remove(...CLASSES));
    links.forEach((el) => el.classList.remove(...CLASSES));
    if (!analysis || ui.dragging) return;
    const rule = highlightRule();
    if (!rule) return;
    bars.forEach((el) => el.classList.add(rule.taskClass(el.dataset.id) || 'dim'));
    const ids = (value) => (value ? value.split(' ') : []);
    links.forEach((el) => el.classList.add(rule.linkClass(ids(el.dataset.from), ids(el.dataset.to)) || 'dim'));
  }

  function highlightRule() {
    if (ui.hoverId && model.getNode(ui.hoverId)) {
      const focus = new Set(model.tasksOf(ui.hoverId));
      const up = A.closure(focus, analysis.predecessors);
      const down = A.closure(focus, analysis.successors);
      return {
        taskClass: (id) => (focus.has(id) ? 'hl' : up.has(id) ? 'up' : down.has(id) ? 'down' : null),
        linkClass: (from, to) => {
          const any = (list, set) => list.some((id) => set.has(id));
          if (any(from, up) && (any(to, up) || any(to, focus))) return 'up';
          if ((any(from, focus) || any(from, down)) && any(to, down)) return 'down';
          return null;
        },
      };
    }
    if (ui.focusMode === 'ready') {
      return { taskClass: (id) => (analysis.ready.has(id) ? 'ready-hl' : null), linkClass: () => null };
    }
    if (ui.focusMode === 'critical') {
      const index = new Map(analysis.criticalPath.map((id, i) => [id, i]));
      return {
        taskClass: (id) => (index.has(id) ? 'crit' : null),
        linkClass: (from, to) => (from.some((f) => index.has(f) && to.some((t) => index.get(t) === index.get(f) + 1)) ? 'crit' : null),
      };
    }
    return null;
  }

  /* ---------- Koordinaten, Zoom, Scrollen ---------- */

  function toWorld(clientX, clientY) {
    const rect = dom.world.getBoundingClientRect();
    const zoom = model.getState().view.zoom;
    return { x: (clientX - rect.left) / zoom, y: (clientY - rect.top) / zoom };
  }

  const priorityAt = (y) => L.priorityAt(current, y);

  function viewportCenter() {
    const zoom = model.getState().view.zoom;
    const c = dom.canvas;
    return { x: (c.scrollLeft + c.clientWidth / 2) / zoom, y: (c.scrollTop + c.clientHeight / 2) / zoom };
  }

  /** Zoomen um einen Ankerpunkt (Pixel relativ zur Arbeitsfläche), Standard: Mitte. */
  function setZoom(zoom, anchor) {
    const c = dom.canvas;
    const old = model.getState().view.zoom;
    const next = U.clamp(zoom, C.ZOOM.min, C.ZOOM.max);
    const p = anchor || { x: c.clientWidth / 2, y: c.clientHeight / 2 };
    const wx = (c.scrollLeft + p.x) / old;
    const wy = (c.scrollTop + p.y) / old;
    model.setView({ zoom: next });
    applyView();
    c.scrollLeft = wx * next - p.x;
    c.scrollTop = wy * next - p.y;
  }

  /** Alle Prioritätsbänder in der Höhe zeigen (nicht kleiner als fitMin), in der Breite scrollen; ab heute. */
  function fit() {
    const c = dom.canvas;
    const zoom = U.clamp(Math.min(c.clientHeight / current.height, 1), C.ZOOM.fitMin, C.ZOOM.max);
    model.setView({ zoom });
    applyView();
    c.scrollLeft = 0;
    c.scrollTop = 0;
  }

  function scrollTo(id) {
    const box = current?.boxes.get(id);
    if (!box) return;
    const zoom = model.getState().view.zoom;
    dom.canvas.scrollTo({
      left: Math.max(0, (box.x - C.LABEL_WIDTH - 40) * zoom),
      top: Math.max(0, (box.y + C.BAR_HEIGHT / 2) * zoom - dom.canvas.clientHeight / 2),
      behavior: 'smooth',
    });
  }

  return {
    markup,
    init, render, applyView, showDraftLink, hideDraftLink, themeAt, markDropTheme, showMovePreview, hideMovePreview, showLasso, applySelection, applyHighlight,
    toWorld, dayAt: L.dayAt, priorityAt, viewportCenter, setZoom, fit, scrollTo,
  };
})();
</script>
  <script>
/* js/render/sidebar.js */
/**
 * Seitenleiste: Tabs „Details“ (Aufgabe, mehrere Aufgaben, Thema oder Abhängigkeit bearbeiten),
 * „Ablauf“ (wichtigste Denk-Themen, startbar, kritischer Pfad, Themen) und „Hilfe“.
 * Ändert das Modell direkt; Navigation/Meldungen laufen über die bei init() übergebenen actions.
 */
PB.sidebar = (() => {
  const C = PB.config;
  const U = PB.util;
  const I = PB.icons;
  const CAL = PB.calendar;
  const model = PB.model;
  const ui = PB.ui;
  const esc = U.escapeHtml;

  /** Sonderwerte in Auswahllisten: „Neues Thema anlegen“ und (Mehrfachauswahl) „unverändert lassen“. */
  const NEW_THEME = '__new__';
  const KEEP = '__keep__';

  let dom = null;
  let actions = null;
  let analysis = null;
  let editCheckpointPending = false;

  function init(elements, callbacks) {
    dom = elements;
    actions = callbacks;
    dom.tabs.addEventListener('click', onTabClick);
    dom.body.addEventListener('focusin', () => { editCheckpointPending = true; });
    dom.body.addEventListener('input', onInput);
    dom.body.addEventListener('change', onChange);
    dom.body.addEventListener('click', onClick);
    dom.body.addEventListener('mouseover', onHover);
    dom.body.addEventListener('mouseleave', () => actions.hover(null));
  }

  /** silent: nur Analyse übernehmen, nicht neu zeichnen (z. B. während im Panel getippt wird). */
  function render(a, { silent = false } = {}) {
    analysis = a;
    if (silent) return;
    dom.tabs.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.tab === ui.tab));
    const views = { details: detailsView, plan: planView, help: helpView };
    dom.body.innerHTML = views[ui.tab]();
  }

  /* =====================================================================
   * Bausteine
   * ===================================================================== */

  function dot(id) {
    const theme = model.getTheme(id);
    if (theme) return `<span class="dot theme" style="--c:${theme.color}"></span>`;
    const task = model.getTask(id);
    return `<span class="dot ${task.kind}">${I.forKind(task.kind)}</span>`;
  }

  function listItem(id, { meta = '', removeDep = null } = {}) {
    const node = model.getNode(id);
    if (!node) return '';
    const remove = removeDep ? `<button class="x" data-remove-dep="${esc(removeDep)}" title="Entfernen">×</button>` : '';
    return `<li data-goto="${esc(id)}">${dot(id)}<span class="t">${esc(node.title)}</span>${meta}${remove}</li>`;
  }

  const list = (items, empty = '– nichts –') =>
    `<ul class="list">${items.join('') || `<li class="hint">${empty}</li>`}</ul>`;

  const field = (label, control) => `<div class="field"><label>${label}</label>${control}</div>`;
  const small = (text) => `<span class="small">${text}</span>`;

  function select(attrs, options, current) {
    const opts = Object.entries(options)
      .map(([value, label]) => `<option value="${esc(value)}"${String(value) === String(current) ? ' selected' : ''}>${esc(label)}</option>`).join('');
    return `<select ${attrs}>${opts}</select>`;
  }

  const priorityOptions = Object.fromEntries(C.PRIORITY_LABELS.map((label, i) => [i + 1, `Prio ${i + 1} – ${label}`]));

  function themeOptions(withNew = true) {
    return {
      '': '– kein Thema –',
      ...Object.fromEntries(model.getState().themes.map((th) => [th.id, th.title])),
      ...(withNew ? { [NEW_THEME]: '+ Neues Thema…' } : {}),
    };
  }

  /** Dauer-Eingabe mit Schnellwahl. */
  function durationField(label, name, value, { presets = C.DURATION_PRESETS, min = 1 } = {}) {
    const buttons = presets.map((p) =>
      `<button class="chip${p.days === value ? ' on' : ''}" data-preset="${name}" data-days="${p.days}">${p.label}</button>`).join('');
    return field(label,
      `<div class="duration"><input type="number" min="${min}" step="1" data-field="${name}" value="${value}">
        <span class="small">Arbeitstage = ${CAL.durationLabel(value)}</span></div><div class="chips">${buttons}</div>`);
  }

  function legend() {
    return `<h3>Legende</h3><div class="legend">
      <div><span class="dot thinking">${I.svg('brain')}</span><span><b>Denken</b> – Analyse, Konzept</span></div>
      <div><span class="dot implementation">${I.svg('wrench')}</span><span><b>Umsetzung</b> – direkt machbar</span></div>
      <div><span class="sw int-focused"></span><span>Voll = intensiv</span></div>
      <div><span class="sw int-medium"></span><span>Dicht schraffiert = mittel</span></div>
      <div><span class="sw int-background"></span><span>Licht schraffiert = nebenbei / reift</span></div>
      <div><span class="sw buffer"></span><span>Gestrichelt = Puffer / Unsicherheit</span></div>
      <div><span class="sw ongoing"></span><span>∞ = läuft weiter</span></div>
      <div><span class="sw frame"></span><span>Rahmen = Thema</span></div>
      <div><span class="lev">🔓 3</span><span>Hebel: gibt 3 Umsetzungen frei</span></div>
      <div><span class="sw risky-line"></span><span>Orange Pfeil: startet, bevor der Vorgänger (inkl. Puffer) fertig ist</span></div>
    </div>`;
  }

  /* =====================================================================
   * Tab „Details“
   * ===================================================================== */

  function detailsView() {
    const { type, ids } = ui.selection;
    if (type === 'dependency') return dependencyDetails(model.getDependency(ids[0]));
    if (type === 'theme' && model.getTheme(ids[0])) return themeDetails(model.getTheme(ids[0]));
    if (type === 'task' && ids.length > 1) return multiDetails(ids);
    if (type === 'task' && model.getTask(ids[0])) return taskDetails(model.getTask(ids[0]));
    return `<p class="hint">Wähle einen Balken aus – <b>Strg/Shift + Klick</b> oder <b>Shift + Ziehen</b> wählt mehrere.
      Doppelklick auf eine freie Stelle legt eine Aufgabe an.</p>${legend()}`;
  }

  function iterationLabel(task, index) {
    return index === null || !task?.iterations[index] ? 'komplett' : `nach „${task.iterations[index].title}“`;
  }

  function dependencyDetails(dep) {
    if (!dep) return '';
    const fromTask = model.getTask(dep.from);
    const iterationSelect = fromTask?.iterations.length
      ? field('Benötigt wird',
        select(`data-dep-iteration="${esc(dep.id)}"`,
          { '': 'Vorgänger komplett', ...Object.fromEntries(fromTask.iterations.map((it, i) => [i, `nur bis „${it.title}“`])) },
          dep.fromIteration ?? ''))
      : '';
    return `<h3>Abhängigkeit</h3>
      ${list([listItem(dep.from, { meta: small('zuerst') })])}
      <div class="hint" style="margin:0 8px 6px">↓ muss fertig sein (${iterationLabel(fromTask, dep.fromIteration)}), bevor</div>
      ${list([listItem(dep.to, { meta: small('danach') })])}
      ${iterationSelect}
      <div class="btnrow">
        <button class="btn" data-action="reverse-dependency">Richtung umkehren</button>
        <button class="btn danger" data-action="delete">Löschen</button>
      </div>`;
  }

  /** Mehrere Aufgaben: gemeinsame Änderungen. „—“ = unterschiedliche Werte bleiben unverändert. */
  function multiDetails(ids) {
    const tasks = ids.map(model.getTask).filter(Boolean);
    const same = (key) => tasks.every((t) => t[key] === tasks[0][key]);
    const common = (key) => (same(key) ? (tasks[0][key] ?? '') : KEEP);
    const keep = { [KEEP]: '— unterschiedlich, unverändert lassen —' };
    const withKeep = (key, options) => (same(key) ? options : { ...keep, ...options });
    return `<h3>${tasks.length} Aufgaben ausgewählt</h3>
      ${list(tasks.map((t) => listItem(t.id, { meta: small(`P${t.priority}`) })))}
      ${field('Thema', select('data-bulk="theme"', withKeep('theme', themeOptions()), common('theme')))}
      <div class="row">
        ${field('Priorität', select('data-bulk="priority"', withKeep('priority', priorityOptions), common('priority')))}
        ${field('Status', select('data-bulk="status"', withKeep('status', C.STATUS_LABELS), common('status')))}
      </div>
      ${field('Arbeitsweise', select('data-bulk="intensity"', withKeep('intensity', C.INTENSITY_LABELS), common('intensity')))}
      <p class="hint">Gemeinsam verschieben: einen der ausgewählten Balken ziehen.</p>
      <div class="btnrow">
        <button class="btn" data-action="clear-selection">Auswahl aufheben</button>
        <button class="btn danger" data-action="delete">${tasks.length} löschen</button>
      </div>`;
  }

  function taskDetails(task) {
    const isThinking = task.kind === 'thinking';
    const end = CAL.dateOf(model.endOf(task));
    const durationBlock = task.iterations.length
      ? field('Dauer', `<p class="hint">Summe der Iterationen: <b>${CAL.durationLabel(model.durationOf(task))}</b></p>`)
      : durationField('Dauer', 'durationDays', task.durationDays);

    return `
      ${field('Titel', `<input data-field="title" value="${esc(task.title)}">`)}
      <div class="row">
        ${field('Art', select('data-field="kind"', { thinking: 'Denken', implementation: 'Umsetzung' }, task.kind))}
        ${field('Status', select('data-field="status"', C.STATUS_LABELS, task.status))}
      </div>
      <div class="row">
        ${field('Priorität', select('data-field="priority"', priorityOptions, task.priority))}
        ${field('Start', `<input type="date" data-field="start" min="${CAL.isoOf(0)}" value="${CAL.isoOf(task.start)}">`)}
      </div>
      ${field('Thema', select('data-field="theme"', themeOptions(), task.theme ?? ''))}
      ${durationBlock}
      ${durationField('Puffer (Unsicherheit)', 'bufferDays', task.bufferDays, {
        min: 0, presets: [{ label: 'kein', days: 0 }, { label: '1 Wo', days: 5 }, { label: '2 Wo', days: 10 }, { label: '1 Mt', days: 20 }],
      })}
      <p class="hint">Ende: <b>${CAL.longDate(end)}</b> (KW ${CAL.weekNumber(end)})${task.bufferDays ? `, spätestens ${CAL.longDate(CAL.dateOf(model.endOf(task) + task.bufferDays))}` : ''}</p>
      ${task.iterations.length ? '' : field('Arbeitsweise', select('data-field="intensity"', C.INTENSITY_LABELS, task.intensity))}
      ${isThinking ? iterationsEditor(task) : ''}
      ${field('Stichpunkte (eine Zeile = ein Punkt)', `<textarea data-field="notes" rows="3">${esc(task.notes.join('\n'))}</textarea>`)}
      ${field('Beschreibung', `<textarea data-field="description" rows="3">${esc(task.description)}</textarea>`)}
      <p class="hint">${taskStateText(task)}</p>
      ${blockedBySection(task)}
      ${dependencySections(task.id)}
      <div class="btnrow">
        <button class="btn" data-action="duplicate">Duplizieren</button>
        <button class="btn danger" data-action="delete">Löschen</button>
      </div>`;
  }

  function iterationsEditor(task) {
    const rows = task.iterations.map((it, i) => `
      <div class="iter-row">
        <input type="checkbox" data-iter="${i}" data-iter-field="done" ${it.done ? 'checked' : ''} title="Erledigt">
        <input data-iter="${i}" data-iter-field="title" value="${esc(it.title)}">
        <input type="number" min="1" step="1" data-iter="${i}" data-iter-field="durationDays" value="${it.durationDays}" title="Dauer in Arbeitstagen">
        ${select(`data-iter="${i}" data-iter-field="intensity" title="Arbeitsweise"`, C.INTENSITY_LABELS, it.intensity)}
        <button class="x" data-action="remove-iteration" data-index="${i}" title="Entfernen">×</button>
      </div>`).join('');
    const head = task.iterations.length
      ? '<div class="iter-row iter-head"><span></span><span>Schritt</span><span>Tage</span><span>Arbeitsweise</span><span></span></div>'
      : '';
    return `<h3>Iterationen</h3>
      <p class="hint">Denken in Schritten, jeder mit eigener Dauer und Arbeitsweise. Eine Umsetzung kann schon nach einer Iteration starten (Punkt an der Iterationsgrenze ziehen).</p>
      ${head}${rows}
      <div class="btnrow">
        <button class="btn" data-action="add-iteration">+ Iteration</button>
        <label class="check"><input type="checkbox" data-field="ongoing" ${task.ongoing ? 'checked' : ''}> ∞ läuft danach weiter</label>
      </div>`;
  }

  function taskStateText(task) {
    const leverage = analysis.leverage.get(task.id);
    const lever = leverage ? ` 🔓 Gibt ${leverage} offene Umsetzung(en) frei.` : '';
    switch (analysis.stateOf(task.id)) {
      case 'done': return 'Erledigt.';
      case 'cycle': return '⚠ Teil eines Zyklus – Abhängigkeiten prüfen.';
      case 'ready': return `✓ Kann jetzt gestartet werden.${lever}`;
      case 'in_progress': return `In Arbeit.${lever}`;
      default: return `Wartet auf ${analysis.openPredecessors(task.id).length} offene Aufgabe(n).${lever}`;
    }
  }

  function blockedBySection(task) {
    const open = analysis.openPredecessors(task.id);
    if (!open.length) return '';
    return `<h3>Blockiert durch</h3>${list(open.map((id) => listItem(id)))}`;
  }

  function themeDetails(theme) {
    const members = model.membersOf(theme.id);
    return `
      ${field('Thema', `<input data-theme-field="title" value="${esc(theme.title)}">`)}
      ${field('Farbe des Rahmens', `<input type="color" data-theme-field="color" value="${theme.color}">`)}
      <p class="hint">Eine Abhängigkeit auf ein Thema gilt für alle Aufgaben darin.</p>
      <h3>Aufgaben (${members.length})</h3>
      ${list(members.map((id) => listItem(id)), 'Aufgaben auswählen und im Panel diesem Thema zuordnen')}
      ${members.length ? '<div class="btnrow"><button class="btn" data-action="select-members">Alle auswählen</button></div>' : ''}
      ${dependencySections(theme.id)}
      <div class="btnrow"><button class="btn danger" data-action="delete">Thema löschen</button></div>`;
  }

  function dependencyOptions(id, direction) {
    const deps = model.getState().dependencies;
    const used = new Set(direction === 'incoming'
      ? deps.filter((d) => d.to === id).map((d) => d.from)
      : deps.filter((d) => d.from === id).map((d) => d.to));
    const { tasks, themes } = model.getState();
    const option = (node, prefix) => `<option value="${esc(node.id)}">${prefix}: ${esc(node.title)}</option>`;
    const available = (node) => node.id !== id && !used.has(node.id);
    return [
      ...themes.filter(available).map((th) => option(th, 'Thema')),
      ...tasks.filter(available).sort((a, b) => a.title.localeCompare(b.title, 'de')).map((t) => option(t, C.KIND_LABELS[t.kind])),
    ].join('');
  }

  function dependencySections(id) {
    const deps = model.getState().dependencies;
    const incoming = deps.filter((d) => d.to === id).map((d) => listItem(d.from, {
      meta: d.fromIteration !== null ? small(iterationLabel(model.getTask(d.from), d.fromIteration)) : '',
      removeDep: d.id,
    }));
    const outgoing = deps.filter((d) => d.from === id).map((d) => listItem(d.to, {
      meta: d.fromIteration !== null ? small(`ab „${model.getTask(id).iterations[d.fromIteration].title}“`) : '',
      removeDep: d.id,
    }));
    return `
      <h3>Hängt ab von</h3>${list(incoming)}
      <select class="adddep" data-add-dependency="incoming">
        <option value="">+ Voraussetzung hinzufügen…</option>${dependencyOptions(id, 'incoming')}</select>
      <h3>Ist Voraussetzung für</h3>${list(outgoing)}
      <select class="adddep" data-add-dependency="outgoing">
        <option value="">+ abhängige Aufgabe hinzufügen…</option>${dependencyOptions(id, 'outgoing')}</select>`;
  }

  /* =====================================================================
   * Tab „Ablauf“
   * ===================================================================== */

  function planView() {
    const { tasks, themes } = model.getState();
    if (!tasks.length) {
      return '<p class="hint">Noch keine Aufgaben. Lege oben mit „Denken“ oder „Umsetzung“ los – oder doppelklicke auf die Zeitachse.</p>';
    }
    const a = analysis;
    const open = tasks.filter((t) => t.status !== 'done');
    const openDays = (kind) => open.filter((t) => t.kind === kind).reduce((s, t) => s + model.durationOf(t), 0);
    const planEnd = CAL.dateOf(a.planEnd);
    const durationOfId = (id) => CAL.durationLabel(model.durationOf(model.getTask(id)));

    const stats = `<div class="stats">
      <div class="stat"><b>${a.ready.size}</b><span>jetzt parallel startbar</span></div>
      <div class="stat"><b>KW ${CAL.weekNumber(planEnd)}</b><span>Plan-Ende (${CAL.shortDate(planEnd)})</span></div>
      <div class="stat thinking"><b>${CAL.durationLabel(openDays('thinking'))}</b><span>${I.svg('brain')} Denken offen</span></div>
      <div class="stat impl"><b>${CAL.durationLabel(openDays('implementation'))}</b><span>${I.svg('wrench')} Umsetzung offen</span></div>
    </div>`;
    const warning = a.cycle.size
      ? `<div class="warn">⚠ Zyklische Abhängigkeit zwischen: ${[...a.cycle].map((id) => esc(model.getTask(id).title)).join(', ')}</div>`
      : '';
    const important = a.importantThinking.slice(0, 6).map((id) => {
      const lever = a.leverage.get(id);
      return listItem(id, { meta: small(`${lever ? `🔓 ${lever} · ` : ''}${durationOfId(id)} · P${model.getTask(id).priority}`) });
    });
    const ready = [...a.ready]
      .sort((x, y) => model.getTask(x).priority - model.getTask(y).priority)
      .map((id) => listItem(id, { meta: small(`P${model.getTask(id).priority} · ${durationOfId(id)}`) }));
    const critical = a.criticalPath.map((id, i) => listItem(id, { meta: small(`${i ? '↳ ' : ''}${durationOfId(id)}`) }));
    const themeItems = themes.map((th) => listItem(th.id, { meta: small(`${model.membersOf(th.id).length} Aufgaben`) }));
    const done = tasks.filter((t) => t.status === 'done').map((t) => listItem(t.id, { meta: small('✓') }));

    return `${stats}${warning}
      <h3>Wichtigste Denk-Themen</h3>
      <p class="hint">Viel Hebel (🔓 = freigegebene Umsetzungen) × lange Dauer – hier früh anfangen.</p>
      ${list(important, 'Keine offenen Denk-Themen')}
      <h3>Jetzt parallel startbar (${a.ready.size})</h3>${list(ready)}
      ${critical.length ? `<h3>Kritischer Pfad · ${CAL.durationLabel(a.criticalDays)}</h3>
        <p class="hint">Längste Kette nacheinander abhängiger Aufgaben – bestimmt die minimale Gesamtdauer.</p>${list(critical)}` : ''}
      <h3>Themen</h3>${list(themeItems, 'Noch keine Themen')}
      <div class="btnrow"><button class="btn" data-action="add-theme">+ Thema</button></div>
      ${done.length ? `<h3>Erledigt (${done.length})</h3>${list(done)}` : ''}`;
  }

  /* =====================================================================
   * Tab „Hilfe“
   * ===================================================================== */

  function helpView() {
    return `<h3>Die Zeitachse</h3>
    <ul class="help">
      <li><b>Waagrecht = Zeit</b> in Kalenderwochen ab heute. Die <b>Länge</b> eines Balkens ist seine Dauer.</li>
      <li><b>Senkrecht = Priorität</b>: Prio 1 oben. Steht etwas Wichtiges weit rechts, wartet es zu lange.</li>
      <li><b>Rahmen</b> fassen die Aufgaben eines Themas innerhalb eines Prio-Bands zusammen.</li>
    </ul>
    <h3>Bedienen</h3>
    <ul class="help">
      <li><b>Balken frei ziehen</b>: waagrecht = Start, senkrecht = Priorität – das Ziel-Band wird markiert, übernommen wird beim Loslassen. Abhängigkeiten verschieben nichts automatisch; ein <b>oranger Pfeil</b> zeigt, wenn etwas vor dem Ende seines Vorgängers startet.</li>
      <li><b>Mehrere auswählen</b>: Strg/⌘ oder Shift + Klick, oder <b>Shift + Ziehen</b> auf freier Fläche. Ein ausgewählter Balken zieht alle anderen mit; im Panel lassen sich Thema, Priorität, Status und Arbeitsweise gemeinsam setzen.</li>
      <li><b>Rechte Kante</b> = Dauer, <b>gestrichelte Kante</b> = Puffer.</li>
      <li><b>Punkt am Ende ziehen</b> und auf einer Aufgabe loslassen = Abhängigkeit. Der Punkt an einer <b>Iterationsgrenze</b> heisst: „braucht nur bis hier“.</li>
      <li><b>Doppelklick</b> auf eine freie Stelle = neue Aufgabe an diesem Tag in diesem Prio-Band.</li>
      <li><b>Klick auf einen Rahmen-Namen</b> öffnet das Thema. Eine Abhängigkeit auf ein Thema gilt für alle Aufgaben darin.</li>
      <li><b>Thema → Thema</b>: Punkt rechts am Rahmen ziehen und in einem anderen Rahmen loslassen – ein Pfeil statt vieler. Loslassen auf einem Balken verbindet Thema → Aufgabe, ein Balken-Punkt in einen Rahmen gezogen verbindet Aufgabe → Thema.</li>
      <li><b>Hover</b> zeigt, was vorher nötig ist (orange) und was blockiert wird (blau).</li>
    </ul>
    <h3>Tastatur</h3>
    <ul class="help">
      <li><b>Entf</b> löschen · <b>Strg+D</b> duplizieren · <b>Strg+A</b> alle auswählen · <b>Esc</b> Auswahl aufheben</li>
      <li><b>Strg+Z / Strg+Y</b> rückgängig / wiederholen · <b>Strg + Mausrad</b> zoomen</li>
    </ul>
    <h3>Speichern & Teilen</h3>
    <ul class="help">
      <li>Alles wird automatisch im Browser gespeichert.</li>
      <li><b>Datei ▸ Export</b> speichert als JSON (Format „prio-board“), <b>Import</b> lädt JSON oder eine exportierte HTML-Seite.</li>
      <li><b>Datei ▸ Als HTML</b> erzeugt eine statische Seite nur mit dem Diagramm.</li>
    </ul>
    ${legend()}`;
  }

  /* =====================================================================
   * Ereignisse
   * ===================================================================== */

  const selectedIds = () => ui.selection.ids;
  const selectedTask = () => (ui.selection.type === 'task' && selectedIds().length === 1 ? model.getTask(selectedIds()[0]) : null);
  const selectedTheme = () => (ui.selection.type === 'theme' ? model.getTheme(selectedIds()[0]) : null);

  /** Ein Historieneintrag pro Fokus beim Tippen. */
  function typingOptions() {
    if (editCheckpointPending) {
      model.checkpoint();
      editCheckpointPending = false;
    }
    return { record: false, source: 'sidebar' };
  }

  function onTabClick(event) {
    const button = event.target.closest('button[data-tab]');
    if (!button) return;
    ui.tab = button.dataset.tab;
    render(analysis);
  }

  /** Text- und Zahleneingaben: Seitenleiste wird dabei nicht neu gezeichnet (Fokus bleibt). */
  function onInput(event) {
    const t = event.target;
    if (t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'date') return;
    const task = selectedTask();
    const theme = selectedTheme();

    if (task && t.dataset.field) {
      const value = readField(t.dataset.field, t.value);
      if (value === undefined) return;
      model.updateTask(task.id, { [t.dataset.field]: value }, typingOptions());
      if (t.type === 'number') updateDurationLabel(t, value);
    } else if (task && t.dataset.iterField) {
      const value = t.dataset.iterField === 'durationDays' ? U.parseNumber(t.value) : t.value;
      if (value === null) return;
      model.updateIteration(task.id, Number(t.dataset.iter), { [t.dataset.iterField]: value }, typingOptions());
    } else if (theme && t.dataset.themeField) {
      model.updateTheme(theme.id, { [t.dataset.themeField]: t.value }, typingOptions());
    }
  }

  /** „= 2 Wo“ neben einer Dauer-Eingabe aktualisieren, ohne die Seitenleiste neu zu zeichnen. */
  function updateDurationLabel(input, days) {
    const label = input.parentElement.querySelector('.small');
    if (label) label.textContent = `Arbeitstage = ${CAL.durationLabel(days)}`;
  }

  /** Feldwert umwandeln; undefined = (noch) ungültig, nicht übernehmen. */
  function readField(name, value) {
    if (name === 'notes') return value.split('\n').map((s) => s.trim()).filter(Boolean);
    if (name === 'durationDays' || name === 'bufferDays') {
      const n = U.parseNumber(value);
      if (n === null) return undefined;
      return Math.max(name === 'durationDays' ? 1 : 0, Math.round(n));
    }
    return value;
  }

  /** Thema zuordnen; „Neues Thema…“ legt eines an (actions.run → app.addTheme ordnet die Auswahl zu). */
  function assignTheme(ids, value) {
    if (value === NEW_THEME) {
      actions.run('add-theme');
      return;
    }
    const result = model.assignTheme(ids, value || null);
    if (!result.ok) {
      actions.toast(result.error);
      render(analysis);
    }
  }

  function onChange(event) {
    const t = event.target;
    const task = selectedTask();

    if (t.dataset.addDependency && t.value) {
      const id = selectedIds()[0];
      const [from, to] = t.dataset.addDependency === 'incoming' ? [t.value, id] : [id, t.value];
      actions.addDependency(from, to, null);
    } else if (t.dataset.depIteration) {
      model.setDependencyIteration(t.dataset.depIteration, t.value === '' ? null : Number(t.value));
    } else if (t.dataset.bulk) {
      if (t.value === KEEP) return;
      if (t.dataset.bulk === 'theme') assignTheme(selectedIds(), t.value);
      else model.updateTasks(selectedIds(), { [t.dataset.bulk]: t.dataset.bulk === 'priority' ? Number(t.value) : t.value });
    } else if (task && t.dataset.field === 'theme') {
      assignTheme([task.id], t.value);
    } else if (task && t.dataset.field === 'ongoing') {
      model.updateTask(task.id, { ongoing: t.checked });
    } else if (task && t.dataset.field === 'start') {
      const day = CAL.dayOf(t.value);
      if (day !== null) model.updateTask(task.id, { start: day });
    } else if (task && t.tagName === 'SELECT' && t.dataset.field) {
      const value = t.dataset.field === 'priority' ? Number(t.value) : t.value;
      model.updateTask(task.id, { [t.dataset.field]: value });
    } else if (task && t.dataset.iterField === 'done') {
      model.updateIteration(task.id, Number(t.dataset.iter), { done: t.checked });
    } else if (task && t.dataset.iterField === 'intensity') {
      model.updateIteration(task.id, Number(t.dataset.iter), { intensity: t.value });
    }
    // Bewusst kein Neuzeichnen nach Texteingaben: Ein Klick, der den Fokus wechselt,
    // würde sonst auf einem bereits ersetzten Element landen und verloren gehen.
  }

  function onClick(event) {
    const t = event.target;
    const remove = t.closest('[data-remove-dep]');
    if (remove) {
      event.stopPropagation();
      model.removeDependency(remove.dataset.removeDep);
      return;
    }
    const preset = t.closest('[data-preset]');
    if (preset && selectedTask()) {
      model.updateTask(selectedTask().id, { [preset.dataset.preset]: Number(preset.dataset.days) });
      return;
    }
    const action = t.closest('[data-action]');
    if (action) {
      runAction(action.dataset.action, action.dataset.index === undefined ? null : Number(action.dataset.index));
      return;
    }
    const item = t.closest('[data-goto]');
    if (item) actions.goTo(item.dataset.goto);
  }

  function runAction(name, index) {
    const task = selectedTask();
    if (name === 'add-iteration' && task) model.addIteration(task.id);
    else if (name === 'remove-iteration' && task) model.removeIteration(task.id, index);
    else if (name === 'select-members' && selectedTheme()) actions.selectTasks(model.membersOf(selectedTheme().id));
    else actions.run(name);
  }

  function onHover(event) {
    const item = event.target.closest('[data-goto]');
    actions.hover(item ? item.dataset.goto : null);
  }

  return { init, render };
})();
</script>

  <script>
/* js/ui/dialog.js */
/**
 * Eigene Dialoge statt alert()/confirm() und Datei-Download-Fallback.
 *
 * Grund: In eingebetteten Vorschauen (sandboxed iframes) werden alert/confirm ignoriert
 * und Downloads still blockiert. Diese Dialoge funktionieren überall; Exporte bieten
 * zusätzlich „In Zwischenablage kopieren“, Importe „JSON einfügen“.
 */
PB.dialog = (() => {
  const esc = PB.util.escapeHtml;
  let dialog = null;

  function ensure() {
    if (dialog) return dialog;
    dialog = document.createElement('dialog');
    dialog.className = 'pb-dialog';
    document.body.appendChild(dialog);
    return dialog;
  }

  /** Öffnet einen Dialog; resolve(value) schliesst ihn. */
  function open(html, setup) {
    const d = ensure();
    d.innerHTML = `<form method="dialog" class="pb-dialog-body">${html}</form>`;
    return new Promise((resolve) => {
      const finish = (value) => {
        d.close();
        resolve(value);
      };
      d.onclose = () => resolve(undefined);
      d.querySelectorAll('[data-result]').forEach((b) => b.addEventListener('click', (e) => {
        e.preventDefault();
        finish(b.dataset.result === 'true');
      }));
      setup?.(d, finish);
      d.showModal();
    });
  }

  const paragraphs = (text) => esc(text).split('\n').map((line) => `<p>${line}</p>`).join('');

  /** Ja/Nein-Frage. Liefert true/false. */
  async function confirm(message, { okLabel = 'OK', danger = false } = {}) {
    const result = await open(`
      <div class="pb-dialog-text">${paragraphs(message)}</div>
      <div class="pb-dialog-actions">
        <button class="btn" data-result="false">Abbrechen</button>
        <button class="btn primary${danger ? ' danger' : ''}" data-result="true" autofocus>${esc(okLabel)}</button>
      </div>`);
    return result === true;
  }

  /** Hinweis mit OK-Knopf. */
  function alert(message, { title = 'Hinweis' } = {}) {
    return open(`
      <h2>${esc(title)}</h2>
      <div class="pb-dialog-text">${paragraphs(message)}</div>
      <div class="pb-dialog-actions"><button class="btn primary" data-result="true" autofocus>OK</button></div>`);
  }

  async function copyText(textarea) {
    try {
      await navigator.clipboard.writeText(textarea.value);
      return true;
    } catch {
      textarea.focus();
      textarea.select();
      try {
        return document.execCommand('copy');
      } catch {
        return false;
      }
    }
  }

  /**
   * Export-Dialog: Herunterladen und/oder Kopieren.
   * download: Funktion, die den Download auslöst.
   */
  function exportFile({ title, description, filename, content, download }) {
    return open(`
      <h2>${esc(title)}</h2>
      <p class="pb-dialog-hint">${esc(description)}</p>
      <textarea class="pb-dialog-code" readonly spellcheck="false">${esc(content)}</textarea>
      <p class="pb-dialog-hint small">Falls der Download hier blockiert ist (z. B. in einer Vorschau):
        kopieren, in einen Texteditor einfügen und als <b>${esc(filename)}</b> speichern.</p>
      <div class="pb-dialog-actions">
        <span class="pb-dialog-status" aria-live="polite"></span>
        <button class="btn" data-result="false">Schliessen</button>
        <button class="btn" data-copy>In Zwischenablage kopieren</button>
        <button class="btn primary" data-download autofocus>Herunterladen</button>
      </div>`, (d) => {
      const status = d.querySelector('.pb-dialog-status');
      d.querySelector('[data-download]').addEventListener('click', (e) => {
        e.preventDefault();
        download();
        status.textContent = 'Download gestartet – falls nichts passiert: kopieren.';
      });
      d.querySelector('[data-copy]').addEventListener('click', async (e) => {
        e.preventDefault();
        status.textContent = (await copyText(d.querySelector('textarea'))) ? '✓ Kopiert' : 'Bitte Text markieren und mit Strg+C kopieren';
      });
    });
  }

  /** Import-Dialog: Datei wählen oder Text einfügen. Liefert den Text oder undefined. */
  function importFile() {
    return open(`
      <h2>Board importieren</h2>
      <p class="pb-dialog-hint">JSON-Datei („prio-board“) oder eine mit „Als HTML“ erstellte Seite.</p>
      <label class="btn pb-file">Datei wählen…<input type="file" accept=".json,application/json,.html,text/html" hidden></label>
      <p class="pb-dialog-hint">…oder Inhalt hier einfügen:</p>
      <textarea class="pb-dialog-code" spellcheck="false" placeholder='{ "format": "prio-board", … }'></textarea>
      <div class="pb-dialog-actions">
        <button class="btn" data-result="false">Abbrechen</button>
        <button class="btn primary" data-import>Importieren</button>
      </div>`, (d, finish) => {
      const textarea = d.querySelector('textarea');
      d.querySelector('input[type=file]').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) finish(await file.text());
      });
      d.querySelector('[data-import]').addEventListener('click', (e) => {
        e.preventDefault();
        if (textarea.value.trim()) finish(textarea.value);
        else textarea.focus();
      });
    });
  }

  return { confirm, alert, exportFile, importFile };
})();

  <script>
/* js/ui/interactions.js */
/**
 * Maus-/Touch-Interaktionen auf der Zeitachse:
 *  - Balken ziehen: waagrecht = Start, senkrecht = Prioritätsband (ausgewählte Balken gemeinsam)
 *  - Strg/⌘/Shift + Klick: Balken zur Auswahl hinzufügen/entfernen
 *  - Shift + Ziehen auf leerer Fläche: Auswahlrechteck
 *  - rechte Kante = Dauer, gestrichelte Kante = Puffer
 *  - Punkt am Ende (oder an einer Iterationsgrenze) ziehen = Abhängigkeit;
 *    Punkt am Rahmen ziehen = Abhängigkeit des ganzen Themas; Loslassen im Rahmen = auf das Thema
 *  - Klick auf ein Rahmen-Etikett = Thema auswählen
 *  - leere Fläche ziehen = verschieben, Doppelklick = neue Aufgabe, Strg+Mausrad = Zoom
 */
PB.interactions = (() => {
  const C = PB.config;
  const model = PB.model;
  const board = PB.board;
  const ui = PB.ui;

  /** Ab dieser Mausbewegung (px) gilt ein Klick als Ziehen. */
  const DRAG_THRESHOLD = 4;

  let dom = null;
  let actions = null;

  function init(elements, callbacks) {
    dom = elements;
    actions = callbacks;
    dom.canvas.addEventListener('pointerdown', onPointerDown);
    dom.canvas.addEventListener('wheel', onWheel, { passive: false });
    dom.world.addEventListener('pointerover', onPointerOver);
    dom.world.addEventListener('pointerleave', () => actions.hover(null));
    dom.world.addEventListener('dblclick', onDoubleClick);
  }

  /* ---------- Verteilung ---------- */

  function onPointerDown(event) {
    if (event.button !== 0 && event.button !== 1) return;
    const target = event.target;
    const bar = target.closest('.bar');
    const id = bar?.dataset.id;
    if (bar && event.button === 0) {
      const port = target.closest('.port');
      if (port) return startLink(event, id, port.dataset.iteration === undefined ? null : Number(port.dataset.iteration));
      if (target.closest('.rs.dur')) return startResize(event, id, 'duration');
      if (target.closest('.rs.buf')) return startResize(event, id, 'buffer');
      if (event.ctrlKey || event.metaKey || event.shiftKey) return actions.toggleTask(id);
      return startMove(event, id);
    }
    const themePort = target.closest('.theme-port');
    if (themePort && event.button === 0) return startLink(event, themePort.parentElement.dataset.theme, null);
    const frameLabel = target.closest('.tl-frame-label');
    if (frameLabel) return actions.select('theme', frameLabel.parentElement.dataset.theme);
    const link = target.closest('.link');
    if (link) return actions.select('dependency', link.dataset.dep);
    if (event.shiftKey && event.button === 0) return startLasso(event);
    return startPan(event);
  }

  /** Verfolgt eine Zeigerbewegung bis zum Loslassen. */
  function track(onMove, onEnd) {
    const move = (e) => onMove(e);
    const end = (e) => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', end);
      window.removeEventListener('pointercancel', end);
      ui.dragging = false;
      onEnd(e);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  }

  /** Geste, die erst bei echter Bewegung beginnt (Klicks erzeugen keinen Historieneintrag). */
  function gesture() {
    let started = false;
    return {
      get started() { return started; },
      start() {
        if (started) return;
        started = true;
        ui.dragging = true;
        model.beginGesture();
      },
    };
  }

  /** Verschiebung in ganzen Arbeitstagen seit Gestenbeginn. */
  const daysBetween = (fromX, toX) => Math.round((toX - fromX) / C.DAY_WIDTH);

  /* ---------- Balken verschieben ---------- */

  /**
   * Verschiebt den gegriffenen Balken – und alle anderen ausgewählten mit (gleicher Versatz).
   * Während des Ziehens bleibt das Board unverändert: Die Balken folgen als Vorschau der Maus
   * (waagrecht tageweise, senkrecht frei), das Ziel-Band wird markiert. Erst beim Loslassen
   * wird übernommen – so springt nichts, wenn sich Bandhöhen durch das Verschieben ändern.
   */
  function startMove(event, id) {
    event.preventDefault();
    const { type, ids } = ui.selection;
    const group = type === 'task' && ids.includes(id) ? ids : [id];
    if (group.length === 1) actions.select('task', id);
    const origin = board.toWorld(event.clientX, event.clientY);
    const leadPriority = model.getTask(id).priority;
    const initial = group.map((taskId) => {
      const t = model.getTask(taskId);
      return { id: taskId, start: t.start, priority: t.priority };
    });
    let started = false;
    let target = null;

    track((e) => {
      const p = board.toWorld(e.clientX, e.clientY);
      if (!started && Math.hypot(p.x - origin.x, p.y - origin.y) * model.getState().view.zoom < DRAG_THRESHOLD) return;
      if (!started) {
        started = true;
        ui.dragging = true;
        board.applyHighlight();
      }
      const days = daysBetween(origin.x, p.x);
      const priorityShift = board.priorityAt(p.y) - leadPriority;
      target = initial.map((t) => ({
        id: t.id,
        start: Math.max(0, t.start + days),
        priority: Math.min(C.PRIORITY_LEVELS, Math.max(1, t.priority + priorityShift)),
      }));
      const lead = target.find((t) => t.id === id);
      board.showMovePreview([id, ...group.filter((x) => x !== id)], (lead.start - model.getTask(id).start) * C.DAY_WIDTH, p.y - origin.y,
        { priority: lead.priority, start: lead.start, point: p });
    }, () => {
      board.hideMovePreview();
      if (!started || !target) return;
      const changed = target.some((t, i) => t.start !== initial[i].start || t.priority !== initial[i].priority);
      if (!changed) {
        board.applyHighlight();
        return;
      }
      model.beginGesture();
      model.previewTasks(new Map(target.map((t) => [t.id, { start: t.start, priority: t.priority }])));
      model.endGesture();
    });
  }

  /* ---------- Auswahlrechteck ---------- */

  function startLasso(event) {
    event.preventDefault();
    const origin = board.toWorld(event.clientX, event.clientY);
    let hits = [];
    ui.dragging = true;
    track((e) => {
      const p = board.toWorld(e.clientX, e.clientY);
      hits = board.showLasso({
        x: Math.min(origin.x, p.x), y: Math.min(origin.y, p.y),
        width: Math.abs(p.x - origin.x), height: Math.abs(p.y - origin.y),
      });
    }, () => {
      board.showLasso(null);
      if (hits.length) actions.selectTasks(hits);
      else actions.clearSelection();
    });
  }

  /* ---------- Dauer / Puffer ändern ---------- */

  function startResize(event, id, mode) {
    event.preventDefault();
    event.stopPropagation();
    actions.select('task', id);
    const task = model.getTask(id);
    const origin = board.toWorld(event.clientX, event.clientY);
    const lastIteration = task.iterations.length - 1;
    const initial = {
      duration: lastIteration >= 0 ? task.iterations[lastIteration].durationDays : task.durationDays,
      buffer: task.bufferDays,
    };
    const g = gesture();

    track((e) => {
      g.start();
      const delta = daysBetween(origin.x, board.toWorld(e.clientX, e.clientY).x);
      if (mode === 'buffer') model.previewTask(id, { bufferDays: Math.max(0, initial.buffer + delta) });
      else if (lastIteration >= 0) model.previewIteration(id, lastIteration, initial.duration + delta);
      else model.previewTask(id, { durationDays: Math.max(1, initial.duration + delta) });
      actions.preview();
    }, () => {
      if (g.started) model.endGesture();
    });
  }

  /* ---------- Abhängigkeit ziehen ---------- */

  /**
   * Pfeil ziehen – von einer Aufgabe (optional ab einer Iteration) oder einem Thema (Rahmen-Punkt).
   * Ziel ist der Balken unter dem Zeiger, sonst das Thema, in dessen Rahmen losgelassen wird.
   */
  function startLink(event, fromId, iteration) {
    event.preventDefault();
    event.stopPropagation();
    ui.dragging = true;
    document.body.classList.add('linking');
    board.applyHighlight();

    const targetAt = (e) => {
      const bar = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bar');
      if (bar) return { id: bar.dataset.id, theme: null };
      const theme = board.themeAt(board.toWorld(e.clientX, e.clientY));
      return { id: theme, theme };
    };

    track((e) => {
      board.showDraftLink(fromId, iteration, board.toWorld(e.clientX, e.clientY));
      board.markDropTheme(targetAt(e).theme);
    }, (e) => {
      document.body.classList.remove('linking');
      board.hideDraftLink();
      board.markDropTheme(null);
      const target = targetAt(e).id;
      if (target && target !== fromId) actions.addDependency(fromId, target, iteration);
      else board.applyHighlight();
    });
  }

  /* ---------- Pannen ---------- */

  function startPan(event) {
    const canvas = dom.canvas;
    const start = { left: canvas.scrollLeft, top: canvas.scrollTop, x: event.clientX, y: event.clientY };
    let moved = false;
    canvas.classList.add('panning');
    track((e) => {
      if (Math.abs(e.clientX - start.x) + Math.abs(e.clientY - start.y) > DRAG_THRESHOLD) moved = true;
      canvas.scrollLeft = start.left - (e.clientX - start.x);
      canvas.scrollTop = start.top - (e.clientY - start.y);
    }, () => {
      canvas.classList.remove('panning');
      if (!moved) actions.clearSelection();
    });
  }

  /* ---------- Hover, Doppelklick, Zoom ---------- */

  function onPointerOver(event) {
    if (ui.dragging) return;
    actions.hover(event.target.closest('.bar')?.dataset.id ?? null);
  }

  function onDoubleClick(event) {
    const bar = event.target.closest('.bar');
    if (bar) {
      actions.select('task', bar.dataset.id);
      actions.focusTitle();
      return;
    }
    const p = board.toWorld(event.clientX, event.clientY);
    if (p.x < C.LABEL_WIDTH || p.y < C.HEADER_HEIGHT) return;
    actions.createAt({ start: board.dayAt(p.x), priority: board.priorityAt(p.y) }, event.clientX, event.clientY);
  }

  function onWheel(event) {
    if (!event.ctrlKey && !event.metaKey) return;
    event.preventDefault();
    const rect = dom.canvas.getBoundingClientRect();
    const factor = event.deltaY < 0 ? 1.1 : 1 / 1.1;
    board.setZoom(model.getState().view.zoom * factor, { x: event.clientX - rect.left, y: event.clientY - rect.top });
    actions.viewChanged();
  }

  return { init };
})();
</script>
  <script>
/* js/app.js */
/**
 * Einstiegspunkt: verbindet Modell, Darstellung, Interaktionen und Werkzeugleiste.
 *
 * Datenfluss:  Benutzeraktion → PB.model (Änderung + Zeitplan) → Ereignis → onModelChange()
 *              → Analyse → Zeitachse + Seitenleiste neu zeichnen → im Browser speichern.
 */
PB.app = (() => {
  const C = PB.config;
  const U = PB.util;
  const model = PB.model;
  const board = PB.board;
  const sidebar = PB.sidebar;
  const storage = PB.storage;
  const format = PB.format;
  const ui = PB.ui;

  const $ = (selector) => document.querySelector(selector);
  let analysis = null;
  let toastTimer = null;
  let previewFrame = null;

  /* ---------- Start ---------- */

  function init() {
    PB.diagramStyles.inject();
    PB.icons.hydrate();

    board.init({ canvas: $('#canvas'), sizer: $('#sizer'), world: $('#world') });
    sidebar.init({ tabs: $('#sideTabs'), body: $('#sideBody') }, {
      goTo, hover, addDependency, toast, selectTasks, run: runAction,
    });
    PB.interactions.init({ canvas: $('#canvas'), world: $('#world') }, {
      select, selectTasks, toggleTask, clearSelection, hover, addDependency, focusTitle, createAt, preview,
      viewChanged: persist,
    });

    model.subscribe(onModelChange);
    bindToolbar();
    bindFileMenu();
    bindBoardTitle();
    bindKeyboard();

    const saved = storage.loadLocal();
    model.load(saved ? saved.state : format.parse(PB.example));
    requestAnimationFrame(() => {
      board.fit();
      updateHeader();
      persist();
      if (saved?.migrated) reportMigration(saved);
      else if (saved?.repairs.length) reportRepairs(saved);
    });
  }

  function onModelChange(meta = {}) {
    dropStaleSelection();
    analysis = PB.analysis.analyze(model);
    board.render(analysis);
    sidebar.render(analysis, { silent: meta.source === 'sidebar' });
    updateHeader();
    persist();
  }

  /** Live-Vorschau während des Ziehens (höchstens einmal pro Frame). */
  function preview() {
    if (previewFrame) return;
    previewFrame = requestAnimationFrame(() => {
      previewFrame = null;
      analysis = PB.analysis.analyze(model);
      board.render(analysis);
    });
  }

  /** Speichert im Browser; zeigt einen Hinweis, wenn das nicht möglich ist (z. B. Vorschau/Sandbox). */
  function persist() {
    $('#saveWarning').hidden = storage.saveLocal(model.getState());
  }

  function reportRepairs({ repairs, backupKey }) {
    const list = repairs.slice(0, 6).map((r) => `• ${r}`).join('\n');
    const more = repairs.length > 6 ? `\n• … (+${repairs.length - 6})` : '';
    PB.dialog.alert(
      `Dein gespeichertes Board hatte kleine Fehler und wurde automatisch repariert:\n${list}${more}\n\n` +
      `Das Original ist im Browser gesichert (${backupKey}).`,
      { title: 'Board repariert' });
  }

  function reportMigration({ fromVersion }) {
    const timeline = fromVersion < 2
      ? '• Neue Zeitachse: Priorität = bisherige Position (links = hoch), Dauer = bisheriger Aufwand (1 PT ≈ 1 Arbeitstag)\n' +
        '• Startdaten wurden einmalig aus den Abhängigkeiten vorgeschlagen – danach frei verschiebbar\n'
      : '';
    PB.dialog.alert(
      'Dein Board wurde auf die neue Version umgestellt:\n' + timeline +
      '• Themen werden als Rahmen gezeigt; jede Aufgabe gehört zu höchstens einem Thema\n' +
      '  (Abhängigkeiten weiterer Themen wurden direkt auf die Aufgabe übertragen)\n' +
      '• Intensität (intensiv / mittel / nebenbei) gibt es jetzt auch pro Iteration\n\n' +
      'Das alte Board bleibt im Browser gesichert.',
      { title: 'Board umgestellt' });
  }

  /* ---------- Auswahl & Navigation ---------- */

  function setSelection(type, ids) {
    ui.selection = { type: ids.length ? type : null, ids };
    if (ids.length) ui.tab = 'details';
    else if (ui.tab === 'details') ui.tab = 'plan';
    board.applySelection();
    sidebar.render(analysis);
  }

  const select = (type, id) => setSelection(type, [id]);
  const selectTasks = (ids) => setSelection('task', ids);
  const selectedTasks = () => (ui.selection.type === 'task' ? ui.selection.ids : []);

  /** Strg/Shift-Klick: Aufgabe zur Auswahl hinzufügen oder daraus entfernen. */
  function toggleTask(id) {
    const ids = selectedTasks();
    selectTasks(ids.includes(id) ? ids.filter((x) => x !== id) : [...ids, id]);
  }

  function clearSelection() {
    if (ui.selection.type) setSelection(null, []);
  }

  function dropStaleSelection() {
    const exists = { task: model.getTask, theme: model.getTheme, dependency: model.getDependency }[ui.selection.type];
    if (!exists) return;
    const ids = ui.selection.ids.filter((id) => exists(id));
    ui.selection = { type: ids.length ? ui.selection.type : null, ids };
  }

  function hover(id) {
    if (ui.hoverId === id) return;
    ui.hoverId = id;
    board.applyHighlight();
  }

  function goTo(id) {
    if (model.isTheme(id)) {
      select('theme', id);
      return;
    }
    board.scrollTo(id);
    select('task', id);
  }

  function focusTitle() {
    const input = $('#sideBody [data-field="title"], #sideBody [data-theme-field="title"]');
    if (input) {
      input.focus();
      input.select();
    }
  }

  /* ---------- Aktionen ---------- */

  function addTask(kind, position) {
    const id = model.addTask(kind, position);
    board.scrollTo(id);
    select('task', id);
    focusTitle();
  }

  /** Neue Aufgabe an der sichtbaren Stelle (Werkzeugleiste). */
  function addTaskInView(kind) {
    const center = board.viewportCenter();
    addTask(kind, { start: board.dayAt(center.x), priority: board.priorityAt(center.y) });
  }

  /** Doppelklick auf freie Fläche: kleines Menü „Denken / Umsetzung“. */
  function createAt(position, clientX, clientY) {
    const menu = $('#createMenu');
    menu.hidden = false;
    menu.style.left = `${Math.min(clientX, window.innerWidth - 200)}px`;
    menu.style.top = `${Math.min(clientY, window.innerHeight - 110)}px`;
    menu.onclick = (event) => {
      const button = event.target.closest('[data-kind]');
      menu.hidden = true;
      if (button) addTask(button.dataset.kind, position);
    };
  }

  /** Neues Thema; ausgewählte Aufgaben werden ihm direkt zugeordnet. */
  function addTheme() {
    const tasks = selectedTasks();
    const id = model.addTheme();
    if (tasks.length) {
      const result = model.assignTheme(tasks, id);
      if (!result.ok) toast(result.error);
    }
    select('theme', id);
    focusTitle();
  }

  function addDependency(from, to, fromIteration = null) {
    const result = model.addDependency(from, to, fromIteration);
    const fromTask = model.getTask(from);
    const iteration = fromIteration !== null && fromTask?.iterations[fromIteration];
    toast(result.ok
      ? `„${model.getNode(to).title}“ hängt jetzt von „${model.getNode(from).title}“${iteration ? ` (bis „${iteration.title}“)` : ''} ab`
      : result.error);
  }

  function deleteSelection() {
    const { type, ids } = ui.selection;
    if (type === 'task') model.removeTasks(ids);
    if (type === 'theme') ids.forEach(model.removeTheme);
    if (type === 'dependency') ids.forEach(model.removeDependency);
  }

  function duplicateSelection() {
    const ids = selectedTasks();
    if (ids.length !== 1) return;
    const copy = model.duplicateTask(ids[0]);
    if (copy) select('task', copy);
  }

  function reverseSelectedDependency() {
    if (ui.selection.type !== 'dependency') return;
    const result = model.reverseDependency(ui.selection.ids[0]);
    if (!result.ok) toast(result.error);
  }

  function runAction(name) {
    const handlers = {
      delete: deleteSelection,
      duplicate: duplicateSelection,
      'reverse-dependency': reverseSelectedDependency,
      'add-theme': addTheme,
      'clear-selection': clearSelection,
    };
    handlers[name]?.();
  }

  /* ---------- Import / Export ---------- */

  const fileName = (extension) => `${U.slugify(model.getState().board.title)}-${U.today()}.${extension}`;

  function exportJson() {
    const filename = fileName('json');
    const content = JSON.stringify(format.serialize(model.getState(), { model, analysis }), null, 2);
    PB.dialog.exportFile({
      title: 'Export (JSON)',
      description: 'Das Board im Format „prio-board“ – mit „Import“ wieder ladbar.',
      filename,
      content,
      download: () => storage.downloadText(content, filename, 'application/json'),
    });
  }

  function exportHtml() {
    const filename = fileName('html');
    const content = PB.staticExport.build(analysis);
    PB.dialog.exportFile({
      title: 'Als HTML',
      description: 'Eigenständige Seite nur mit dem Diagramm – zum Verschicken oder Ablegen. Lässt sich auch wieder importieren.',
      filename,
      content,
      download: () => storage.downloadText(content, filename, 'text/html'),
    });
  }

  async function importBoard() {
    let text = await PB.dialog.importFile();
    if (!text) return;
    try {
      if (/^\s*</.test(text)) {
        text = PB.staticExport.extractData(text);
        if (!text) throw new format.FormatError(['Die HTML-Datei enthält keine Prio-Board-Daten']);
      }
      model.replace(format.parse(text));
      clearSelection();
      board.fit();
      updateHeader();
      persist();
      toast(`„${model.getState().board.title}“ importiert`);
    } catch (error) {
      if (!(error instanceof format.FormatError)) console.error(error);
      PB.dialog.alert(error instanceof format.FormatError ? error.message : `Import fehlgeschlagen: ${error.message}`,
        { title: 'Import nicht möglich' });
    }
  }

  async function loadExample() {
    if (!await PB.dialog.confirm('Aktuelles Board durch das Beispiel ersetzen?\n(Rückgängig möglich)', { okLabel: 'Ersetzen' })) return;
    model.replace(format.parse(PB.example));
    board.fit();
    updateHeader();
    persist();
  }

  async function clearBoard() {
    if (!await PB.dialog.confirm('Alle Aufgaben, Themen und Abhängigkeiten entfernen?\n(Rückgängig möglich)', { okLabel: 'Leeren', danger: true })) return;
    model.clear();
  }

  /* ---------- Werkzeugleiste ---------- */

  function bindToolbar() {
    const on = (selector, handler) => $(selector).addEventListener('click', handler);
    on('#addThinking', () => addTaskInView('thinking'));
    on('#addImplementation', () => addTaskInView('implementation'));
    on('#addTheme', addTheme);
    on('#undo', model.undo);
    on('#redo', model.redo);
    const zoomBy = (factor) => {
      board.setZoom(model.getState().view.zoom * factor);
      updateHeader();
      persist();
    };
    on('#zoomIn', () => zoomBy(C.ZOOM.step));
    on('#zoomOut', () => zoomBy(1 / C.ZOOM.step));
    on('#fit', () => { board.fit(); updateHeader(); persist(); });
    $('#focusMode').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-focus]');
      if (!button) return;
      ui.focusMode = button.dataset.focus;
      updateHeader();
      board.applyHighlight();
    });
    on('#exportJson', exportJson);
    on('#exportHtml', exportHtml);
    on('#importJson', importBoard);
    on('#loadExample', loadExample);
    on('#clearBoard', clearBoard);
    on('#saveWarning', () => PB.dialog.alert(
      'Diese Ansicht darf nichts im Browser speichern (z. B. eingebettete Vorschau).\n' +
      'Änderungen gehen beim Schliessen verloren. Sichere dein Board über Datei ▸ Export\n' +
      'oder öffne prio-board.html direkt im Browser (Chrome, Edge, Firefox).',
      { title: 'Nicht gespeichert' }));
  }

  function bindFileMenu() {
    const menu = $('#fileMenu');
    const button = $('#fileMenuButton');
    const createMenu = $('#createMenu');
    const setOpen = (open) => {
      menu.classList.toggle('open', open);
      button.setAttribute('aria-expanded', String(open));
    };
    button.addEventListener('click', () => setOpen(!menu.classList.contains('open')));
    menu.querySelector('.menu-panel').addEventListener('click', () => setOpen(false));
    document.addEventListener('pointerdown', (event) => {
      if (!menu.contains(event.target)) setOpen(false);
      if (!createMenu.contains(event.target)) createMenu.hidden = true;
    });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      setOpen(false);
      createMenu.hidden = true;
    });
  }

  function bindBoardTitle() {
    const title = $('#boardTitle');
    title.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === 'Escape') {
        event.preventDefault();
        title.blur();
      }
    });
    title.addEventListener('blur', () => model.setBoardTitle(title.textContent));
  }

  function updateHeader() {
    const { board: info, view } = model.getState();
    const title = $('#boardTitle');
    if (document.activeElement !== title) title.textContent = info.title;
    document.title = `${info.title} – Prio-Board`;
    $('#undo').disabled = !model.canUndo();
    $('#redo').disabled = !model.canRedo();
    $('#zoomLabel').textContent = `${Math.round(view.zoom * 100)}%`;
    document.querySelectorAll('#focusMode button').forEach((b) => b.classList.toggle('on', b.dataset.focus === ui.focusMode));
  }

  /* ---------- Tastatur ---------- */

  function bindKeyboard() {
    document.addEventListener('keydown', (event) => {
      const active = document.activeElement;
      const typing = active && (/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName) || active.isContentEditable);
      const mod = event.ctrlKey || event.metaKey;
      const key = event.key.toLowerCase();

      if (event.key === 'Escape') {
        if (typing) active.blur();
        clearSelection();
        return;
      }
      if (typing || document.querySelector('dialog[open]')) return;
      if (mod && key === 'z') { event.preventDefault(); event.shiftKey ? model.redo() : model.undo(); }
      else if (mod && key === 'y') { event.preventDefault(); model.redo(); }
      else if (mod && key === 'd') { event.preventDefault(); duplicateSelection(); }
      else if (mod && key === 'a') { event.preventDefault(); selectTasks(model.getState().tasks.map((t) => t.id)); }
      else if (event.key === 'Delete' || event.key === 'Backspace') { event.preventDefault(); deleteSelection(); }
    });
  }

  /* ---------- Meldungen ---------- */

  function toast(message) {
    const el = $('#toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  return { init };
})();

PB.app.init();
</script>
