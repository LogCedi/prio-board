<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prio-Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header>
    <h1><span class="mark"></span><span id="boardTitle" contenteditable="plaintext-only" spellcheck="false" title="Titel bearbeiten">Prio-Board</span></h1>

    <button class="btn primary thinking" id="addThinking" title="Analyse/Konzept – braucht Denkzeit"><span class="ib" data-icon="brain"></span>Denken</button>
    <button class="btn primary impl" id="addImplementation" title="Direkt umsetzbar"><span class="ib" data-icon="wrench"></span>Umsetzung</button>
    <button class="btn primary grp" id="addGroup" title="Rahmen für zusammengehörige Themen (Abhängigkeitsblock)"><span class="ib" data-icon="group"></span>Gruppe</button>
    <span class="sep"></span>

    <button class="btn icon" id="undo" title="Rückgängig (Strg+Z)">↶</button>
    <button class="btn icon" id="redo" title="Wiederholen (Strg+Y)">↷</button>
    <span class="sep"></span>

    <button class="btn icon" id="zoomOut" title="Verkleinern">−</button>
    <span id="zoomLabel">100%</span>
    <button class="btn icon" id="zoomIn" title="Vergrössern">+</button>
    <button class="btn" id="fit">Einpassen</button>
    <span class="sep"></span>

    <div class="seg" id="focusMode" title="Fokus: hebt Blöcke auf dem Board hervor">
      <button data-focus="none" class="on">Aus</button>
      <button data-focus="ready">Jetzt startbar</button>
      <button data-focus="critical">Kritischer Pfad</button>
    </div>
    <button class="btn on" id="priorityAxis" title="Prioritätsachse ein/aus">Prio-Achse</button>

    <span class="spacer"></span>
    <button class="btn warn" id="saveWarning" hidden title="Wird nicht im Browser gespeichert – Details">⚠<span class="long"> Nicht gespeichert</span></button>
    <div class="menu" id="fileMenu">
      <button class="btn" id="fileMenuButton" aria-haspopup="true" aria-expanded="false">Datei ▾</button>
      <div class="menu-panel" role="menu">
        <button role="menuitem" id="exportHtml"><b>Als HTML</b><small>Statische Seite nur mit dem Diagramm</small></button>
        <button role="menuitem" id="exportJson"><b>Export (JSON)</b><small>Board als Datei speichern</small></button>
        <button role="menuitem" id="importJson"><b>Import</b><small>JSON oder exportierte HTML-Seite laden</small></button>
        <hr>
        <button role="menuitem" id="loadExample"><b>Beispiel laden</b></button>
        <button role="menuitem" id="clearBoard" class="danger"><b>Board leeren</b></button>
      </div>
    </div>
  </header>

  <div id="canvas">
    <div id="sizer">
      <div id="world" class="pb-world">
        <div id="zones" class="pb-zones"></div>
        <svg id="links" class="pb-links" xmlns="http://www.w3.org/2000/svg">
          <defs></defs>
          <g id="linkLayer"></g>
          <path id="draftLink" class="draft" d="" style="display:none"/>
        </svg>
      </div>
    </div>
  </div>

  <aside>
    <nav class="tabs" id="sideTabs">
      <button data-tab="details">Details</button>
      <button data-tab="plan">Ablauf</button>
      <button data-tab="help">Hilfe</button>
    </nav>
    <div id="sideBody"></div>
  </aside>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Reihenfolge = Abhängigkeiten der Module -->
  <script src="js/core/config.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/ui-state.js"></script>
  <script src="js/domain/model.js"></script>
  <script src="js/domain/analysis.js"></script>
  <script src="js/io/format.js"></script>
  <script src="js/io/storage.js"></script>
  <script src="js/io/example.js"></script>
  <script src="js/render/diagram-styles.js"></script>
  <script src="js/render/board.js"></script>
  <script src="js/render/sidebar.js"></script>
  <script src="js/io/static-export.js"></script>
  <script src="js/ui/dialog.js"></script>
  <script src="js/ui/interactions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
